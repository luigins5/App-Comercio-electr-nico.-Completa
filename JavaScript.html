            </div>
            {body}
          </div>
        </div>
      );
    }
    // save plumbing for a FormModal: busy flag + server error kept in the modal (form stays filled)
    const useSaver = (onSave) => {
      const [busy, setBusy] = useState(false), [err, setErr] = useState('');
      const run = (data) => { setBusy(true); setErr('');
        return Promise.resolve(onSave(data)).then((m) => m && setErr(m)).finally(() => setBusy(false)); };
      return { busy, err, setErr, run };
    };

    // csv import window: template -> drop the file -> header check + preview -> ONE import call
    // onImport(recs) resolves '' when done (caller closes + reports) or an error message kept in the window
    function ImportModal({ title, need, cols, onTemplate, onImport, onClose }) {
      const [csv, setCsv] = useState(null);                           // { name, kb, heads, recs }
      const { busy, err, setErr, run } = useSaver((p) => p);
      const pick = (fl) => {
        if (!/\.csv$/i.test(fl.name) && !/csv/i.test(fl.type)) return setErr('Elige un archivo .csv — ' + fl.name + ' no lo es');
        setErr(''); fl.text().then((t) => { const all = parseCSV(t).filter((r) => r.some((c) => String(c).trim()));
          if (all.length < 2) return setErr('Este CSV tiene fila de encabezado pero no tiene filas de datos');
          const heads = all[0].map((h) => h.replace(/^\uFEFF/, '').trim());
          setCsv({ name: fl.name, kb: Math.max(1, Math.round(fl.size / 1024)), heads, recs: all.slice(1).map((r) => Object.fromEntries(heads.map((h, i) => [h, (r[i] || '').trim()]))) });
        }).catch(() => setErr('No se pudo leer ese archivo')); };
      const miss = !!csv && !csv.heads.includes(need), extra = csv && cols ? csv.heads.filter((h) => h && !cols.includes(h)) : [];
      const submit = () => { if (!csv) return setErr('Primero selecciona el archivo CSV');
        if (miss) return setErr('Falta la columna "' + need + '" — descarga la plantilla para ver los encabezados exactos');
        run(Promise.resolve(onImport(csv.recs)).catch((e) => (e && e.message) || 'Error de conexión')); };
      return (
        <FormModal icon="fa-file-import" title={title} onClose={onClose} onSubmit={submit} busy={busy} busyLabel="Importando…" err={err} wide submitIcon="fa-file-import"
          submitLabel={csv && !miss ? 'Importar ' + num0(csv.recs.length) + ' ' + (csv.recs.length === 1 ? 'fila' : 'filas') : 'Importar'}>
          <ol className="imp-steps">
            <li><b>1</b><span>Descarga la plantilla</span><button type="button" className="tb-tbtn ghost" onClick={onTemplate}><i className="fas fa-file-arrow-down"></i> Plantilla</button></li>
            <li><b>2</b><span>Llena una fila por registro — mantén la fila de encabezados tal como está</span></li>
            <li><b>3</b><span>Arrastra el CSV abajo y verifica la vista previa</span></li>
          </ol>
          {csv ? <FileCard icon="fa-file-csv" name={csv.name} meta={num0(csv.recs.length) + ' filas · ' + csv.heads.length + ' columnas · ' + num0(csv.kb) + ' KB'} onRemove={() => { setCsv(null); setErr(''); }} disabled={busy} />
            : <FileDrop accept=".csv,text/csv" icon="fa-file-csv" onPick={pick} title="Arrastra y suelta el CSV aquí" hint="o elígelo abajo · la primera fila debe contener los encabezados" />}
          {csv && <div className="imp-check">
            <span className={miss ? 'bad' : 'ok'}><i className={'fas ' + (miss ? 'fa-circle-xmark' : 'fa-circle-check')}></i> Columna "{need}" {miss ? 'no encontrada' : 'encontrada'}</span>
            <span className="ok"><i className="fas fa-list-ol"></i> {num0(csv.recs.length)} filas de datos</span>
            {extra.length > 0 && <span className="warn"><i className="fas fa-circle-exclamation"></i> No están en la plantilla: {extra.join(', ')}</span>}
          </div>}
          {csv && <div className="about-table-wrapper imp-prev">
            <table className="about-roles-table"><thead><tr><th>#</th>{csv.heads.map((h, i) => <th key={i} className={h === need ? 'need' : ''}>{h}</th>)}</tr></thead>
              <tbody>{csv.recs.slice(0, 5).map((r, i) => <tr key={i}><td>{i + 1}</td>{csv.heads.map((h, j) => <td key={j}>{r[h]}</td>)}</tr>)}</tbody></table>
            {csv.recs.length > 5 && <small className="imp-more"><i className="fas fa-ellipsis"></i> y {num0(csv.recs.length - 5)} filas más</small>}
          </div>}
          <p className="sec-note"><i className="fas fa-circle-info"></i> Las filas que no pasen la verificación se omiten y se listan tras la importación; el resto se guardan.</p>
        </FormModal>
      );
    }

    // quick-look popup — centred, 90% of the screen: record facts on the left (side), tabs on the right; every View / stock-card action opens it
    function Drawer({ icon, title, sub, side, tabs, tab, setTab, onClose, children }) {
      useEffect(() => { const k = (e) => e.key === 'Escape' && onClose(); document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, []);
      return (
        <div className="drawer-ov" onClick={onClose}>
          <aside className={'drawer' + (side ? ' has-side' : '')} onClick={(e) => e.stopPropagation()} role="dialog" aria-modal="true" aria-label={title}>
            <header className="drawer-h">
              <span className="set-ic"><i className={'fas ' + icon}></i></span>
              <div className="drawer-t"><b>{title}</b>{sub && <small>{sub}</small>}</div>
              <button className="close-btn" onClick={onClose} aria-label="Cerrar"><i className="fas fa-times"></i></button>
            </header>
            <div className="drawer-main">
              {side && <div className="drawer-side">{side}</div>}
              <section className="drawer-pane">
                {tabs && <nav className="drawer-tabs" role="tablist">{tabs.map(([k, l, ic]) => <button key={k} role="tab" aria-selected={tab === k} className={tab === k ? 'on' : ''} onClick={() => setTab(k)}><i className={'fas ' + ic}></i> {l}</button>)}</nav>}
                <div className="drawer-b" key={tab}>{children}</div>
              </section>
            </div>
          </aside>
        </div>
      );
    }
    // left-panel pieces: a titled block + one fact per line (empty facts drop out)
    const SideSec = ({ title, icon, children }) => <section className="ds-sec">{title && <h5 className="ds-h"><i className={'fas ' + icon}></i> {title}</h5>}{children}</section>;
    const SideKv = ({ l, v }) => (v === '' || v == null ? null : <div className="ds-kv"><span>{l}</span><b>{v}</b></div>);

    // chip tables search one blob per row; the pipeline key rides in _pk
    const masterMatch = (d, p) => rowMatch(d, p) && (!p.f.pipe || d._pk.indexOf('|' + p.f.pipe + '|') !== -1);
    const csvDownload = (name, text) => {
      const url = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' }));
      Object.assign(document.createElement('a'), { href: url, download: name }).click();
      URL.revokeObjectURL(url);
    };
    const csvLine = (a) => a.map((v) => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',');

    // one list page for every master: pipeline + toolbar + bulk bar + chip table + import/template + add/edit/delete
    // cfg: page, key, fetch, listKey, entity, plural, icon, name, blob, derive, pipe, selects, colMenu, columns, rowActs, onAct, tint, Form, editRef, fn{save,del,status,bulkDel,imp}, csvReq, csvOf, csvDemo, minW, after
    //      entityOf(pipe) = Add label follows the active tab · preset(pipe) = values a new record starts with · pipeDefault = opening tab
    //      tsField/dateLabel = what the date filter reads · noActive · editWhy(r)/delWhy(r) = locked row reason · bulkBar(ctx) · acts(ctx) = extra header icons
    //      apiRef = hands {patchList, mutate, table, openEdit} to the owning view · onSave data._again = keep the modal open with that preset
    //      onAdd / onEdit = the owning view opens its own editor (full-page documents) · noDelete = no trash icon / bulk delete (documents cancel instead)
    //      pipe.stagesOf(rows) = tabs built from the data (expense heads) · noImport = no Import / Template icons · foot(rows) = totals line for the filtered rows
    function MasterPage({ cfg, perms, initialSearch, initialFilters }) {
      const P = cfg.page, canAdd = can(perms, P, 'a'), canEdit = can(perms, P, 'e'), canDel = can(perms, P, 'd');
      const { data: res, error, mutate, isLoading } = useSWR(cfg.key, cfg.fetch, { revalidateOnFocus: false, dedupeMs: 30000, keep: !!cfg.range });
      const ok = res && res.success, limited = !!(ok && res.limited);
      const rows = useMemo(() => (ok ? res[cfg.listKey].map((r) => ({ ...r, ...(cfg.derive ? cfg.derive(r) : {}),
        _active: r.is_active ? 'Active' : 'Inactive', _ts: Date.parse(r[cfg.tsField || 'created']), _blob: cfg.blob(r).toLowerCase(),
        _pk: '|' + (cfg.pipe ? cfg.pipe.keys(r) : []).join('|') + '|' })) : undefined), [res]);
      const loading = rows === undefined && !error;
      const [edit, setEdit] = useState(null);                     // null = closed · {} = add · row = edit
      const [selCount, setSelCount] = useState(0);
      const [counts, setCounts] = useState({ shown: 0, total: 0 });
      const [foot, setFoot] = useState('');                        // cfg.foot(rows) = totals line for the filtered rows
      const tableElRef = useRef(null);
      const blank = useMemo(() => Object.assign({ search: '', pipe: cfg.pipeDefault || '', from: '', to: '' }, ...cfg.selects.map((s) => ({ [s.k]: '' }))), []);
      const { filters, setF, reset, args } = useListFilters(blank, initialSearch, cfg.selects.map((s) => [s.k, s.field]), ['_blob']);
      // a register's from/to belong to its server window (cfg.range, seeded by the view) — never a second filter on top
      useEffect(() => { if (initialFilters) Object.keys(initialFilters).forEach((k) => (cfg.range && (k === 'from' || k === 'to')) || setF(k, initialFilters[k])); }, [initialFilters]);
      const ent = cfg.entityOf ? cfg.entityOf(filters.pipe) : cfg.entity;
      const openAdd = () => (cfg.onAdd ? cfg.onAdd(filters.pipe) : setEdit({ _preset: cfg.preset ? cfg.preset(filters.pipe) : null }));   // documents open a full-page editor instead
      useEffect(() => { if (res && !res.success) toastErr(res); }, [res]);

      const patchList = (fn) => mutate((d) => (d && d.success ? { ...d, [cfg.listKey]: fn(d[cfg.listKey]) } : d), false);
      const after = () => cfg.after && cfg.after();
      const csvCols = ok ? (cfg.csvOf ? cfg.csvOf(res) : res.csv) : [];
      const act = useRef({}); act.current = { edit: (r) => (cfg.onEdit ? cfg.onEdit(r) : setEdit(r)), del: (r, el) => removeRow(r, el), tgl: (r, el) => toggleRow(r, el) };

      const shape = (canEdit ? 'e' : '') + (canDel ? 'd' : '') + (limited ? 'L' : '');
      const tableRef = useTabulator(tableElRef, rows, shape, (data) => {
        const sel = (canEdit || canDel) && !limited && !cfg.noSelect;
        const t = new Tabulator(tableElRef.current, {
          data, index: 'id', layout: 'fitColumns', responsiveLayout: false, placeholder: 'No hay ' + cfg.plural.toLowerCase() + ' que coincidan',
          pagination: true, paginationSize: 10, paginationSizeSelector: [10, 25, 50, 100], paginationCounter: 'rows',
          selectableRows: sel ? 'highlight' : false,   // checkbox column only — a click on a row icon must never select the row
          rowFormatter: (row) => { const el = row.getElement(), c = cfg.tint ? cfg.tint(row.getData()) : '';
            el.classList.remove('row-good', 'row-bad', 'row-wait', 'row-mute'); if (c) el.classList.add(c); },
          columns: [
            { formatter: 'rowSelection', titleFormatter: 'rowSelection', headerSort: false, download: false, width: 46, minWidth: 46,
              hozAlign: 'center', resizable: false, visible: sel, frozen: true, cellClick: (e, cell) => cell.getRow().toggleSelect() },
            ...cfg.columns({ limited, canEdit }),
            { title: 'Activo', field: '_active', width: 92, hozAlign: 'center', cssClass: 'ctr', visible: !limited && !cfg.noActive,
              formatter: (c) => { const r = c.getRow().getData();
                return canEdit ? '<button class="act-tgl" data-act="tgl" title="' + (r.is_active ? 'Desactivar' : 'Activar') + '" aria-label="Alternar activo"><span class="tgl"><input type="checkbox" tabindex="-1"' + (r.is_active ? ' checked' : '') + ' disabled><span class="tgl-track"></span></span></button>'
                               : '<span class="tb-pill ' + (r.is_active ? 'ok' : 'off') + '"><i></i>' + (r.is_active ? 'Activo' : 'Inactivo') + '</span>'; },
              cellClick: (e, cell) => { const hit = e.target.closest('[data-act]'); hit && act.current.tgl(cell.getRow().getData(), hit); } },
            { title: 'Acciones', field: '_act', headerSort: false, download: false, width: cfg.actW || 130, cssClass: 'col-actions', resizable: false, frozen: true,
              formatter: (c) => { const r = c.getRow().getData();
                const ew = cfg.editWhy ? cfg.editWhy(r) : '', dw = cfg.delWhy ? cfg.delWhy(r) : r.is_system ? 'Integrado — no se puede eliminar' : r.in_use ? 'En uso — desactiva en su lugar' : '';
                return '<div class="actions-cell">' + (cfg.rowActs ? cfg.rowActs(r, { limited, canEdit }) : '') +
                  (canEdit && !limited && !cfg.noEdit ? '<button class="act act-edit" data-act="edit"' + (ew ? ' disabled title="' + esc(ew) + '"' : ' title="Editar"') + ' aria-label="Editar"><i class="fas fa-pen-to-square"></i></button>' : '') +
                  (canDel && !limited && !cfg.noDelete ? '<button class="act act-del" data-act="del"' + (dw ? ' disabled title="' + esc(dw) + '"' : ' title="Eliminar"') + ' aria-label="Eliminar"><i class="fas fa-trash"></i></button>' : '') + '</div>'; },
              cellClick: (e, cell) => { const hit = e.target.closest('[data-act]'); if (!hit || hit.disabled) return;
                const r = cell.getRow().getData(), a = hit.dataset.act;
                act.current[a] ? act.current[a](r, hit) : cfg.onAct && cfg.onAct(a, r, hit); } },
          ],
        });
        t.on('rowSelectionChanged', (d) => setSelCount(d.length));
        trackCounts(t, setCounts);
        if (cfg.foot) t.on('dataFiltered', (f, rs) => setFoot(cfg.foot(rs.map((x) => x.getData()))));
        return t;
      }, args, masterMatch);

      // ---- writes ----
      const save = (data) => gsRun(cfg.fn.save, data).then((r) => {
        if (!r || !r.success) return (r && r.message) || 'Error al guardar';
        patchList((a) => (a.some((x) => x.id === r.row.id) ? a.map((x) => (x.id === r.row.id ? r.row : x)) : [r.row].concat(a)));
        data._again ? setEdit({ _preset: data._again, _k: Date.now() }) : setEdit(null); after(); cfg.onSaved && cfg.onSaved(r); toastOk(r.message);
      }).catch((e) => (e && e.message) || 'Error de conexión');
      const removeRow = (r, el) => Swal.fire({ icon: 'warning', title: '¿Eliminar ' + cfg.entity + '?', text: '¿Eliminar "' + cfg.name(r) + '"?',
          showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Eliminar', cancelButtonText: 'Cancelar' })
        .then((c) => { if (!c.isConfirmed) return;
          const stop = spinIcon(el);
          return gsRun(cfg.fn.del, r.id).then((x) => { if (!x || !x.success) return toastErr(x);
            patchList((a) => a.filter((y) => y.id !== r.id)); after(); toastOk(x.message); }).catch(toastErr).finally(stop); });
      const toggleRow = (r, el) => { const stop = spinIcon(el);
        gsRun(cfg.fn.status, [r.id], !r.is_active).then((x) => { if (!x || !x.success) return toastErr(x);
          if (!x.count) return Swal.fire({ icon: 'info', title: 'Sin cambios', text: (x.skippedNames || []).join(', ') });
          patchList((a) => a.map((y) => (y.id === r.id ? { ...y, is_active: r.is_active ? 0 : 1 } : y))); after(); }).catch(toastErr).finally(stop); };

      const selIds = () => (tableRef.current ? tableRef.current.getSelectedData().map((r) => r.id) : []);
      const bulk = (kind) => { const ids = selIds(); if (!ids.length) return;
        const del = kind === 'delete', on = kind === 'on';
        const [wOn, wOff] = cfg.onOff || ['Activar', 'Desactivar'];
        Swal.fire({ icon: del ? 'warning' : 'question', title: (del ? '¿Eliminar ' : on ? '¿' + wOn + ' ' : '¿' + wOff + ' ') + ids.length + ' ' + cfg.plural.toLowerCase() + '?',
          text: del ? (cfg.bulkDelNote || 'Se omiten los registros del sistema y en uso.') : '', showCancelButton: true,
          confirmButtonColor: del ? '#ea4335' : 'var(--navy-primary)', confirmButtonText: del ? 'Eliminar' : 'Sí', cancelButtonText: 'Cancelar' })
          .then((c) => c.isConfirmed && (del ? gsRun(cfg.fn.bulkDel, ids) : gsRun(cfg.fn.status, ids, on)).then((x) => {
            if (!x || !x.success) return toastErr(x);
            const hit = new Set(x.ids || []);
            tableRef.current && tableRef.current.deselectRow();
            patchList((a) => (del ? a.filter((y) => !hit.has(y.id)) : a.map((y) => (hit.has(y.id) ? { ...y, is_active: on ? 1 : 0 } : y)))); after();
            Swal.fire({ icon: 'success', title: 'Listo', text: x.count + ' ' + cfg.plural.toLowerCase() + ' ' + (del ? 'eliminados' : (on ? 'activados' : 'desactivados')) +
              (x.skipped ? ' — ' + x.skipped + ' omitidos (' + x.skippedNames.slice(0, 5).join(', ') + (x.skipped > 5 ? '…' : '') + ')' : ''), timer: x.skipped ? undefined : 1800, showConfirmButton: !!x.skipped });
          })).catch(toastErr); };
      const toggleAll = () => { const t = tableRef.current; if (t) selCount ? t.deselectRow() : t.selectRow(t.getRows('active')); };

      // csv import: ImportModal (drop -> header check -> preview) -> ONE bulk call -> refetch -> "N imported, M skipped"
      const [imp, setImp] = useState(false);
      const doImport = (recs) => { const p = gsRun(cfg.fn.imp, recs); busyNote(recs.length + ' filas');
        return p.then((r) => { if (!r || !r.success) return (r && r.message) || 'Error al importar';
          setImp(false); mutate(); after();
          const bad = r.errors || [];
          Swal.fire({ icon: bad.length ? 'warning' : 'success', title: 'Importación completa',
            html: '<b>' + r.count + ' importados</b>' + (bad.length ? ', ' + bad.length + ' omitidos<div class="imp-errs">' + bad.slice(0, 12).map(esc).join('<br>') + (bad.length > 12 ? '<br>…' : '') + '</div>' : '') }); return ''; }); };
      const template = () => csvDownload(P + '_template.csv', csvLine(csvCols) + '\n' + csvLine(csvCols.map((h) => cfg.csvDemo[h] == null ? '' : cfg.csvDemo[h])) + '\n');

      useEffect(() => {
        if (!ok) return;
        setPageActions([
          ...(canAdd && !limited && !cfg.noAdd ? [{ icon: 'fa-plus', label: cfg.addLabel || 'Agregar ' + ent, primary: true, onClick: openAdd }] : []),
          ...(cfg.acts ? cfg.acts({ table: () => tableRef.current }) : []),
          ...exportActs(() => tableRef.current, P, cfg.plural),
          ...(canAdd && !limited && !cfg.noImport ? [{ icon: 'fa-file-import', label: 'Importar CSV', onClick: () => setImp(true) },
                                    { icon: 'fa-file-arrow-down', label: 'Descargar plantilla CSV', onClick: template }] : []),
        ]);
        return () => setPageActions([]);
      }, [canAdd, ok, limited, ent, filters.pipe]);

      const stages = useMemo(() => (cfg.pipe && rows ? (cfg.pipe.stagesOf ? cfg.pipe.stagesOf(rows) : cfg.pipe.stages).map((s) => ({ ...s, n: s.k ? rows.filter((r) => r._pk.indexOf('|' + s.k + '|') !== -1).length : rows.length })) : null), [rows]);
      const selects = useMemo(() => (limited ? cfg.selectsL || [] : cfg.selects).map((s) => ({ ...s, options: s.options || [...new Set((rows || []).map((r) => r[s.field]).filter(Boolean))].sort() })), [rows]);
      const Form = cfg.Form;
      if (cfg.editRef) cfg.editRef.current = (r) => setEdit(r);   // outside callers (a drawer) can open the edit form
      if (cfg.apiRef) cfg.apiRef.current = { patchList, mutate, table: () => tableRef.current, openEdit: (r) => setEdit(r), openAdd: (p) => setEdit({ _preset: p || null }) };

      if (error && !res) return <LoadError onRetry={() => mutate()} />;
      return (
        <div className={'data-section' + (isLoading && res ? ' is-stale' : '')}>
          {loading ? <TableSkeleton rows={8} columns={6} /> : (
            <>
              {stages && <Pipeline stages={stages} value={filters.pipe} onPick={(k) => setF('pipe', k)} />}
              <TableToolbar filters={filters} setF={setF} onReset={() => { reset(); cfg.range && cfg.range.set(cfg.range.def); }} searchPh={cfg.searchPh} dateLabel={cfg.dateLabel || 'Creado entre'}
                cols={limited ? cfg.colMenuL || [] : cfg.colMenu} tableRef={tableRef} selects={selects} range={cfg.range} />
              <div className="tb-bar">
                <div className="tb-bulk">
                  {(canEdit || canDel) && !limited && !cfg.noSelect && <>
                    <input type="checkbox" className="tb-all" title="Seleccionar todo" aria-label="Seleccionar todo"
                      checked={selCount > 0 && selCount === counts.shown} onChange={toggleAll}
                      ref={(el) => { if (el) el.indeterminate = selCount > 0 && selCount < counts.shown; }} />
                    <span className="tb-bulk-n">{selCount} seleccionados</span>
                    {cfg.bulkBar ? cfg.bulkBar({ ids: selIds, count: selCount, patchList, mutate, clear: () => tableRef.current && tableRef.current.deselectRow(), canEdit }) : <>
                      {canEdit && <button className="tb-bulk-btn ok" disabled={!selCount} onClick={() => bulk('on')}><i className="fas fa-play"></i> {(cfg.onOff || ['Activar'])[0]}</button>}
                      {canEdit && <button className="tb-bulk-btn warn" disabled={!selCount} onClick={() => bulk('off')}><i className={'fas ' + (cfg.onOff ? 'fa-box-archive' : 'fa-pause')}></i> {(cfg.onOff || ['', 'Desactivar'])[1]}</button>}
                    </>}
                    {canDel && !cfg.noDelete && <button className="tb-bulk-btn danger" disabled={!selCount} onClick={() => bulk('delete')}><i className="fas fa-trash"></i> Eliminar</button>}
                    <button className="tb-bulk-btn info" disabled={!selCount} onClick={() => tableRef.current.download('csv', P + '_selected.csv', {}, 'selected')}><i className="fas fa-file-export"></i> Exportar seleccionados</button>
                  </>}
                </div>
                <span className="tb-count">{foot && <b className="tb-foot">{foot}</b>}Mostrando {counts.shown} de {counts.total} {cfg.plural.toLowerCase()}{cfg.range && <span className="tb-rng"><i className="fas fa-calendar-days"></i> {rangeTxt(cfg.range)}</span>}</span>
              </div>
              {rows && !rows.length && (
                <div className="soon-view list-empty">
                  <i className={'fas ' + cfg.icon}></i>
                  <h2 className="sec-h">Aún no hay {cfg.plural.toLowerCase()}</h2>
                  {canAdd && !limited && !cfg.noAdd && <button className="btn btn-primary" onClick={openAdd}><i className="fas fa-plus"></i> Agregar {ent}</button>}
                </div>
              )}
            </>
          )}
          <div className={'tb-table chip-table' + (cfg.minW ? ' ' + cfg.minW : '')} ref={tableElRef} style={{ display: loading || (rows && !rows.length) ? 'none' : 'block' }}></div>
          {imp && <ImportModal title={'Importar ' + cfg.plural} need={cfg.csvReq} cols={csvCols} onTemplate={template} onImport={doImport} onClose={() => setImp(false)} />}
          {edit && <Form key={edit._k || 0} row={edit.id ? edit : null} preset={edit._preset} onClose={() => setEdit(null)} onSave={save} />}
        </div>
      );
    }

    // ============== Users Management ==============
    const USER_CSV_COLS = ['Username', 'Email', 'Password', 'Role', 'Status', 'FullName', 'Phone', 'Address'];
    const USER_BLANK = { role: '', status: '', search: '', from: '', to: '' };
    const USER_EXACT = [['role', '_role'], ['status', 'Status']], USER_TEXT = ['Username', 'FullName', 'Phone', 'Email', '_role', 'Status', 'Address'];
    const USER_COLS = [['_contact', 'Contacto'], ['Role', 'Rol'], ['Status', 'Estado'], ['CreatedAt', 'Creado']];

    function UsersView({ perms, initialSearch }) {
      const canAdd = can(perms, 'users', 'a'), canEdit = can(perms, 'users', 'e'), canDel = can(perms, 'users', 'd');
      const { data: res, error, mutate } = useSWR('users:all', () => gsRun('getAllUsers'), { revalidateOnFocus: false, dedupeMs: 30000 });
      const { data: rRes } = useSWR('roles:list', () => gsRun('getRoleOptions'), { revalidateOnFocus: false, dedupeMs: 30000 });
      const roleName = useMemo(() => Object.fromEntries(((rRes && rRes.success && rRes.data) || []).map((r) => [r.key, r.label])), [rRes]);
      const rows = useMemo(() => res ? withTs(res.success ? res.data : [], 'CreatedAt').map((u) => ({ ...u, _role: roleName[u.Role] || u.Role })) : undefined, [res, roleName]);
      const loading = rows === undefined && !error;
      // kpi from cached rows — [value, label, icon, color]
      const kpi = useMemo(() => {
        const list = rows || [];
        let active = 0, admins = 0;
        for (const u of list) { if (u.Status === 'Active') active++; if (u.Role === 'Admin') admins++; }
        return [
          [list.length,          'Total Usuarios',     'fa-users',       'bg-navy'],
          [active,               'Usuarios Activos',   'fa-user-check',  'bg-success'],
          [list.length - active, 'Inactivos',          'fa-user-clock',  'bg-warning'],
          [admins,               'Administradores',    'fa-user-shield', 'bg-info'],
        ];
      }, [rows]);
      const [showModal, setShowModal] = useState(false);
      const [editingUser, setEditingUser] = useState(null);
      const [selCount, setSelCount] = useState(0);
      const [counts, setCounts] = useState({ shown: 0, total: 0 });
      const tableElRef = useRef(null);
      const { filters, setF, reset, args } = useListFilters(USER_BLANK, initialSearch, USER_EXACT, USER_TEXT);
      const openEdit = (u) => { setEditingUser(u); setShowModal(true); };
      const closeModal = () => { setShowModal(false); setEditingUser(null); };

      // surface a server error (e.g. access denied) once
      useEffect(() => { if (res && !res.success) toastErr(res); }, [res]);

      // patch the cached list in place — a single-row write never refetches the whole sheet
      const patchRows = (fn) => mutate((d) => (d && d.success ? { ...d, data: fn(d.data) } : d), false);

      const tableRef = useTabulator(tableElRef, rows, (canEdit ? 'e' : '') + (canDel ? 'd' : ''), (data) => {
        const t = new Tabulator(tableElRef.current, {
          data, layout: 'fitColumns', responsiveLayout: false, placeholder: 'No se encontraron usuarios',
          pagination: true, paginationSize: 10, paginationSizeSelector: [10, 25, 50, 100], paginationCounter: 'rows',
          selectableRows: canEdit || canDel ? 'highlight' : false,   // checkbox column only
          columns: [
            { formatter: 'rowSelection', titleFormatter: 'rowSelection', headerSort: false, download: false,
              width: 46, minWidth: 46, hozAlign: 'center', resizable: false, visible: canEdit || canDel,
              cellClick: (e, cell) => cell.getRow().toggleSelect() },
            { title: 'Usuario', field: 'Username', minWidth: 220, sorter: 'string', accessorDownload: (v, r) => r.FullName + ' (' + r.Username + ')',
              formatter: (cell) => { const r = cell.getRow().getData();
                return `<div class="tb-user"><span class="tb-ava">${esc(initials(r.FullName || r.Username))}</span>` +
                       `<span class="tb-uid"><b>${esc(r.FullName || r.Username)}</b><small>${esc(r.Username)} · ${esc(r.Email)}</small></span></div>`; } },
            { title: 'Correo electrónico', field: 'Email', width: 220, visible: false, download: true }, // hidden but still exports
            { title: 'Contacto', field: '_contact', minWidth: 230, headerSort: false, accessorDownload: (v, r) => [r.Phone, r.Address].filter(Boolean).join(' · '),
              formatter: (c) => { const r = c.getRow().getData();
                return cStack([cRow(cChip('chip-soft-navy', 'fa-phone', 'Teléfono'), orDash(r.Phone)), cRow(cChip('chip-link', 'fa-location-dot', 'Dirección'), orDash(r.Address))]); } },
            { title: 'Rol', field: 'Role', width: 150, accessorDownload: (v, r) => r._role, formatter: (c) => `<span class="tb-pill role">${esc(c.getRow().getData()._role)}</span>` },
            { title: 'Estado', field: 'Status', width: 130,
              formatter: (c) => `<span class="tb-pill ${c.getValue() === 'Active' ? 'ok' : 'off'}"><i></i>${esc(c.getValue() === 'Active' ? 'Activo' : 'Inactivo')}</span>` },
            { title: 'Creado', field: 'CreatedAt', width: 150, formatter: (c) => fmtDate(c.getValue()) },
            { title: 'Acciones', field: '_act', headerSort: false, download: false, width: 110, hozAlign: 'right', resizable: false,
              formatter: () => (canEdit ? '<button class="action-icon edit-icon" data-act="edit" title="Editar"><i class="fas fa-edit"></i></button>' : '') +
                                (canDel ? '<button class="action-icon delete-icon" data-act="del" title="Eliminar"><i class="fas fa-trash"></i></button>' : '') +
                                (!canEdit && !canDel ? '<span class="tb-na">—</span>' : ''),
              cellClick: (e, cell) => {
                const hit = e.target.closest('[data-act]'); if (!hit) return;
                const d = cell.getRow().getData();
                hit.dataset.act === 'edit' ? openEdit(d) : handleDelete(d, hit);
              } },
          ],
        });
        t.on('rowSelectionChanged', (d) => setSelCount(d.length));
        trackCounts(t, setCounts);
        return t;
      }, args);

      // csv import — ImportModal -> bulk insert -> refetch
      const [imp, setImp] = useState(false);
      const doImport = (records) => { const p = gsRun('bulkImportUsers', records); busyNote(records.length + ' filas');
        return p.then((r) => { if (!r || !r.success) return (r && r.message) || 'Error al importar';
          setImp(false); mutate();                                    // new rows -> one refetch
          const bad = r.errors || [];
          Swal.fire({ icon: bad.length ? 'warning' : 'success', title: 'Importación completa',
            html: '<b>' + r.count + ' importados</b>' + (bad.length ? ', ' + bad.length + ' omitidos<div class="imp-errs">' + bad.slice(0, 12).map(esc).join('<br>') + (bad.length > 12 ? '<br>…' : '') + '</div>' : '') }); return ''; }); };

      // template csv — header + 1 generic demo row
      const downloadTemplate = () => {
        const url = URL.createObjectURL(new Blob([USER_CSV_COLS.join(',') + '\ncustomer9@demo.com,customer9@demo.com,demo1234,Customer,Active,Customer 9,03001000009,\"House 9, Street 9, Demo City\"\n'], { type: 'text/csv' }));
        Object.assign(document.createElement('a'), { href: url, download: 'users_template.csv' }).click();
        URL.revokeObjectURL(url);
      };

      // publish this section's buttons -> header toolbar; cleared on unmount
      useEffect(() => {
        setPageActions([
          ...(canAdd ? [{ icon: 'fa-plus', label: 'Agregar Usuario', primary: true, onClick: () => openEdit(null) }] : []),
          ...exportActs(() => tableRef.current, 'users', 'Usuarios'),
          ...(canAdd ? [{ icon: 'fa-file-import', label: 'Importar CSV', onClick: () => setImp(true) }] : []),
          { icon: 'fa-file-arrow-down', label: 'Descargar plantilla CSV', onClick: downloadTemplate },
        ]);
        return () => setPageActions([]);
      }, [canAdd]);

      const roleOptions = useMemo(() => [...new Set((rows || []).map((r) => r._role).filter(Boolean))].sort(), [rows]);
      const toggleAll = () => { const t = tableRef.current; if (t) selCount ? t.deselectRow() : t.selectRow(t.getRows('active')); };

      // ---- bulk actions on the current selection ----
      const selectedNames = () => (tableRef.current ? tableRef.current.getSelectedData().map((r) => r.Username) : []);
      const afterBulk = (r, verb, patch) => {
        if (!r || !r.success) return toastErr(r);
        tableRef.current && tableRef.current.deselectRow();
        patchRows(patch);
        Swal.fire({ icon: 'success', title: verb, text: r.count + ' usuario(s)' + (r.skipped ? ' — ' + r.skipped + ' omitido(s) (tu propia cuenta o cuenta de propietario)' : ''), timer: 1800, showConfirmButton: false });
      };
      const bulkStatus = (status) => {
        const names = selectedNames(); if (!names.length) return;
        Swal.fire({ icon: 'question', title: `¿${status === 'Active' ? 'Activar' : 'Desactivar'} ${names.length} usuario(s)?`,
                    showCancelButton: true, confirmButtonColor: 'var(--navy-primary)', confirmButtonText: 'Sí', cancelButtonText: 'Cancelar' })
          .then((c) => c.isConfirmed && gsRun('bulkSetStatus', names, status).then((r) => {
            const hit = new Set((r && r.changed) || []);
            afterBulk(r, status === 'Active' ? 'Activados' : 'Desactivados', (a) => a.map((u) => (hit.has(u.Username) ? { ...u, Status: status } : u)));
          })).catch(toastErr);
      };
      const bulkDelete = () => {
        const names = selectedNames(); if (!names.length) return;
        Swal.fire({ icon: 'warning', title: `¿Eliminar ${names.length} usuario(s)?`, text: 'Esta acción no se puede deshacer.',
                    showCancelButton: true, confirmButtonText: 'Eliminar', cancelButtonText: 'Cancelar', confirmButtonColor: '#ea4335' })
          .then((c) => c.isConfirmed && gsRun('bulkDeleteUsers', names).then((r) => {
            const gone = new Set((r && r.deleted) || []);
            afterBulk(r, 'Eliminados', (a) => a.filter((u) => !gone.has(u.Username)));
          })).catch(toastErr);
      };
      const exportSelected = () => tableRef.current && tableRef.current.download('csv', 'users_selected.csv', {}, 'selected');

      // returns the promise -> modal button clears its own spinner
      const handleSave = (userData) => (editingUser ? gsRun('updateUser', editingUser.Username, userData) : gsRun('addUser', userData))
        .then((r) => {
          if (!r || !r.success) return (r && r.message) || 'Error al guardar';          // stays in the modal, form kept
          patchRows((a) => editingUser ? a.map((u) => (u.Username === r.user.Username ? r.user : u)) : a.concat(r.user));
          closeModal(); toastOk(r.message);
        })
        .catch((e) => (e && e.message) || 'Error de conexión');

      // confirm FIRST, then the overlay - never animate behind an unanswered dialog
      const handleDelete = (user, btn) => Swal.fire({
          icon: 'warning', title: '¿Eliminar Usuario?', text: `¿Eliminar usuario "${user.Username}"? Esta acción no se puede deshacer.`,
          showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Eliminar', cancelButtonText: 'Cancelar'
        }).then((c) => {
          if (!c.isConfirmed) return;
          const stop = spinIcon(btn);                   // the clicked row icon, not the header
          return gsRun('deleteUser', user.Username)
            .then((r) => { if (!r || !r.success) return toastErr(r); patchRows((a) => a.filter((u) => u.Username !== user.Username)); toastOk(r.message); })
            .catch(toastErr).finally(stop);
        });

      if (error && !res) return <LoadError onRetry={() => mutate()} />;

      return (
        <div className="data-section">
          {loading ? <KpiSkeleton /> : (
            <div className="lte-kpi-grid">
              {kpi.map(([v, l, ic, c], i) => <SmallBox key={i} value={v} label={l} icon={ic} color={c} />)}
            </div>
          )}

          {!loading && (
            <TableToolbar filters={filters} setF={setF} onReset={reset} searchPh="Buscar usuarios por nombre, correo..." dateLabel="Creado entre"
              cols={USER_COLS} tableRef={tableRef}
              selects={[{ k: 'role', icon: 'fa-user', all: 'Todos los Roles', options: roleOptions },
                        { k: 'status', icon: 'fa-filter', all: 'Todos los Estados', options: [{ value: 'Active', label: 'Activo' }, { value: 'Inactive', label: 'Inactivo' }] }]} />
          )}

          {loading && <TableSkeleton rows={8} columns={6} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <div className="tb-bar">
              <div className="tb-bulk">
                <input type="checkbox" className="tb-all" title="Seleccionar todo" aria-label="Seleccionar todo"
                  checked={selCount > 0 && selCount === counts.shown} onChange={toggleAll}
                  ref={(el) => { if (el) el.indeterminate = selCount > 0 && selCount < counts.shown; }} />
                <span className="tb-bulk-n">{selCount} seleccionados</span>
                {canEdit && <button className="tb-bulk-btn ok" disabled={!selCount} onClick={() => bulkStatus('Active')}><i className="fas fa-play"></i> Activar</button>}
                {canEdit && <button className="tb-bulk-btn warn" disabled={!selCount} onClick={() => bulkStatus('Inactive')}><i className="fas fa-pause"></i> Desactivar</button>}
                {canDel && <button className="tb-bulk-btn danger" disabled={!selCount} onClick={bulkDelete}><i className="fas fa-trash"></i> Eliminar</button>}
                <button className="tb-bulk-btn info" disabled={!selCount} onClick={exportSelected}><i className="fas fa-file-export"></i> Exportar seleccionados</button>
              </div>
              <span className="tb-count">Mostrando {counts.shown} de {counts.total} usuarios</span>
            </div>
            <div ref={tableElRef} className="tb-table chip-table"></div>
          </div>

          {/* hidden — opened by the Import CSV toolbar button */}
          {imp && <ImportModal title="Importar Usuarios" need="Username" cols={USER_CSV_COLS} onTemplate={downloadTemplate} onImport={doImport} onClose={() => setImp(false)} />}

          {showModal && <UserModal user={editingUser} onClose={closeModal} onSave={handleSave} />}
        </div>
      );
    }


    // ============== My Account (User Profile) ==============
    function AccountView({ currentUser, currentEmail, role, onEmailChange }) {
      const [formData, setFormData] = useState({
        Email: currentEmail || '',
        CurrentPassword: '',
        NewPassword: '',
        ConfirmPassword: ''
      });
      const [saving, setSaving] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();

        if (formData.NewPassword && formData.NewPassword !== formData.ConfirmPassword) return toastErr({ message: '¡Las nuevas contraseñas no coinciden!' });
        setSaving(true);
        gsRun('updateMyAccount', formData)
          .then((r) => {
            if (!r || !r.success) return toastErr(r);
            toastOk(r.message); onEmailChange(formData.Email.trim());   // header + session follow the new email
            setFormData((f) => ({ ...f, CurrentPassword: '', NewPassword: '', ConfirmPassword: '' }));
          })
          .catch(toastErr)
          .finally(() => setSaving(false));
      };

      return (
        <div className="profile-section">
          <div className="profile-header">
            <div className="profile-avatar">
              {currentUser.charAt(0).toUpperCase()}
            </div>
            <div className="profile-info">
              <h2>{currentUser}</h2>
              <p>Cuenta {role}</p>
            </div>
          </div>

          <form onSubmit={handleSubmit}>
            <div className="form-group">
              <label>Nombre de usuario (No se puede cambiar)</label>
              <input
                type="text"
                value={currentUser}
                disabled
                style={{background: '#f5f5f5', cursor: 'not-allowed'}}
              />
            </div>

            <div className="form-group">
              <label>Correo electrónico *</label>
              <input
                type="email"
                value={formData.Email}
                onChange={(e) => setFormData({...formData, Email: e.target.value})}
                required
              />
            </div>

            <hr style={{margin: '25px 0', border: 'none', borderTop: '2px solid #e0e0e0'}} />

            <h3 className="sec-h" style={{marginBottom: '18px', fontSize: '18px'}}>
              <i className="fas fa-lock"></i> Cambiar Contraseña
            </h3>

            <div className="form-group">
              <label>Contraseña Actual *</label>
              <input
                type="password"
                value={formData.CurrentPassword}
                onChange={(e) => setFormData({...formData, CurrentPassword: e.target.value})}
                required
                autoComplete="current-password"
              />
            </div>

            <div className="form-group">
              <label>Nueva Contraseña (Dejar en blanco para mantener la actual)</label>
              <input
                type="password"
                value={formData.NewPassword}
                onChange={(e) => setFormData({...formData, NewPassword: e.target.value})}
                autoComplete="new-password"
              />
            </div>

            <div className="form-group">
              <label>Confirmar Nueva Contraseña</label>
              <input
                type="password"
                value={formData.ConfirmPassword}
                onChange={(e) => setFormData({...formData, ConfirmPassword: e.target.value})}
                autoComplete="new-password"
              />
            </div>

            <div className="form-actions">
              <button type="submit" className="btn btn-primary" disabled={saving}>
                {saving ? (
                  <><i className="fas fa-spinner fa-spin"></i> Guardando...</>
                ) : (
                  <><i className="fas fa-save"></i> Actualizar Cuenta</>
                )}
              </button>
            </div>
          </form>
        </div>
      );
    }

    // ============== Settings Page ==============
    const NAVY = { primary: '#001f3f', accent: '#0074D9', text: '#333333' };
    function MySettingsView({ sess, canEditRbac, onSettingsUpdate }) {
      const [uploading, setUploading] = useState(false);
      const [customColors, setCustomColors] = useState(NAVY);
      const [themeId, setThemeId] = useState('');        // currently applied preset (saved)
      const [previewId, setPreviewId] = useState('');    // preset being previewed (not yet committed)
      const [defaultId, setDefaultId] = useState(window.__APP_THEME_ID__ || '');  // app-wide default, injected by doGet
      const [showAdvanced, setShowAdvanced] = useState(false);
      const [tsec, setTsec] = useState('all');   // palette section filter
      const [tq, setTq] = useState('');          // palette search
      const isAdmin = canEditRbac;

      // the session already holds the saved palette — no fetch on mount
      useEffect(() => {
        try { const o = JSON.parse(sess.customColors || 'null'); if (!o) return;
          if (o.themeId) { setThemeId(o.themeId); setPreviewId(o.themeId); }
          if (o.primary) setCustomColors({ primary: o.primary, accent: o.accent, text: o.text || NAVY.text });
        } catch (e) {}
      }, [sess.customColors]);

      // persist the palette; the write hands fresh settings back
      const commit = (cc, msg, title) => gsRun('updateUserSettings', { customColors: cc ? JSON.stringify(cc) : '' })
        .then((r) => { if (!r || !r.success) return toastErr(r); toastOk(msg, title); onSettingsUpdate(r.settings); })
        .catch(toastErr);

      // "Set Now" → commit the previewed preset: apply live + persist to this user
      const applySelectedTheme = () => {
        const t = findTheme(previewId) || findTheme(themeId) || UI_THEMES[0], cc = presetPayload(t);
        applyThemeVars(cc.vars); cacheThemeVars(cc.vars); setThemeId(t.id);
        commit(cc, t.name, '¡Tema aplicado!');
      };

      // admin: make this preset the first-load default for everyone
      const makeDefault = (t) => gsRun('setDefaultTheme', t.id, JSON.stringify(themeVars(t)))
        .then((r) => { if (!r || !r.success) return toastErr(r);
          setDefaultId(t.id); window.__APP_THEME_ID__ = t.id; toastOk(t.name + ' se cargará para todos los usuarios al abrir por primera vez.', '¡Predeterminado guardado!'); })
        .catch(toastErr);

      const handleImageUpload = (file) => {
        if (!file.type.startsWith('image/')) return toastErr({ message: 'Por favor, selecciona un archivo de imagen' });
        if (file.size > 3 * 1024 * 1024) return toastErr({ message: 'Imagen demasiado grande — máximo 3 MB' });   // before a 4 MB base64 trip
        const reader = new FileReader();
        setUploading(true);
        reader.onerror = () => { setUploading(false); toastErr({ message: 'No se pudo leer el archivo' }); };
        // upload writes the user row server-side and returns the fresh settings — one round trip
        reader.onload = (ev) => gsRun('uploadProfileImage', ev.target.result, file.name)
          .then((r) => { if (!r || !r.success) return toastErr(r); toastOk('¡Foto de perfil actualizada!'); onSettingsUpdate(r.settings); })
          .catch(toastErr)
          .finally(() => setUploading(false));
        reader.readAsDataURL(file);
      };

      const handleColorChange = (type, color) => setCustomColors((c) => ({ ...c, [type]: color }));

      const applyColors = () => {
        const c = customColors, vars = { '--navy-primary': c.primary, '--navy-dark': c.primary, '--navy-light': c.accent, '--navy-accent': c.accent, '--text-primary': c.text };
        setThemeId('');                                             // custom overrides preset
        applyThemeVars(vars); cacheThemeVars(vars);
        commit({ ...c, vars }, '¡Esquema de colores aplicado!');
      };

      const resetToDefaultColors = () => {
        setCustomColors(NAVY); setThemeId('');
        cacheThemeVars(null); clearThemeVars();
        commit(null, '¡Colores restablecidos al tema Azul Marino predeterminado!', '¡Restablecido!');
      };

      const pv = findTheme(previewId) || findTheme(themeId) || UI_THEMES[0]; // theme shown in preview panel
      const avatar = sess.profileImage || '';
      // gallery = section bucket + name/id search
      const shown = useMemo(() => {
        const q = tq.trim().toLowerCase();
        return UI_THEMES.filter((t) => (tsec === 'all' || themeSec(t.id) === tsec)
          && (!q || t.name.toLowerCase().indexOf(q) !== -1 || t.id.toLowerCase().indexOf(q) !== -1));
      }, [tsec, tq]);

      return (
        <div className="data-section">
          <div className="settings-info-message">
            <i className="fas fa-circle-info"></i>
            <span><strong>Ajustes personales.</strong> Tu foto y paleta se aplican solo a tu cuenta; nadie más verá este cambio.</span>
          </div>

          <div className="set-stack">

            <section className="set-card">
              <header>
                <span className="set-ic"><i className="fas fa-image"></i></span>
                <div>
                  <div className="set-ttl">Foto de Perfil</div>
                  <div className="set-sub">Visible en la barra lateral, el avatar de navegación y el registro de actividad</div>
                </div>
              </header>
              <div className="set-body">
                <div className="set-hero">
                  {avatar
                    ? <img className="set-avatar" src={avatar} alt="Perfil" />
                    : <div className="set-avatar set-avatar-ph"><i className="fas fa-user"></i></div>}
                  <div className="set-hero-main">
                    <FileDrop compact accept="image/*" icon="fa-image" disabled={uploading} onPick={handleImageUpload} title={uploading ? 'Subiendo…' : avatar ? 'Suelta una nueva foto para reemplazarla' : 'Arrastra y suelta una foto aquí'}
                      hint="o elige una abajo · cuadrada, 200 × 200 px o más · JPG o PNG · hasta 3 MB" />
                    {uploading && <p className="set-busy"><i className="fas fa-spinner fa-spin"></i> Subiendo...</p>}
                  </div>
                </div>
              </div>
            </section>

            <section className="set-card">
              <header>
                <span className="set-ic"><i className="fas fa-palette"></i></span>
                <div>
                  <div className="set-ttl">Apariencia</div>
                  <div className="set-sub">
                    Toca una paleta para previsualizarla abajo; nada cambia hasta presionar <strong>Aplicar Ahora</strong>.
                    {isAdmin && ' Como administrador también puedes fijar la paleta predeterminada para todos los visitantes.'}
                  </div>
                </div>
                <span className="set-right">
                  <span className="set-pill ok"><i className="fas fa-circle-check"></i> {(findTheme(themeId) || {}).name || 'Azul Marino Predeterminado'}</span>
                </span>
              </header>
              <div className="set-body">

                <div className="thm-bar">
                  <div className="thm-chips">
                    {THEME_SECTIONS.map(([k, lbl, ic]) => (
                      <button key={k} type="button" className={'thm-chip' + (tsec === k ? ' on' : '')} onClick={() => setTsec(k)}>
                        <i className={'fas ' + ic}></i> {lbl}

                    ))}
                  </div>
                  <div className="thm-search">
                    <i className="fas fa-magnifying-glass"></i>
                    <input type="text" value={tq} placeholder="Buscar paletas..." onChange={(e) => setTq(e.target.value)} />
                  </div>
                </div>

                <p className="thm-count"><i className="fas fa-swatchbook"></i> Mostrando {shown.length} de {UI_THEMES.length} paletas</p>

                <div className="theme-gallery">

                  {!shown.length && <div className="thm-empty"><i className="fas fa-circle-exclamation"></i> Ninguna paleta coincide con el filtro.</div>}
                </div>

                {/* live preview of the picked palette on a mini dashboard */}
                <div className="theme-preview-panel">
                  <div className="tp-head">
                    <span className="tp-title"><i className="fas fa-eye"></i>{pv.name}</span>
                    <span className="tp-chip">{pv.id}</span>
                    {themeId === pv.id && <span className="tp-tag applied"><i className="fas fa-check"></i> APLICADO</span>}

                  </div>

                  <div className="tp-mock" style={{background: pv.bg}}>

                      {['fa-gauge-high','fa-table-cells-large','fa-users','fa-gear'].map(ic => <i className={'fas ' + ic} key={ic}></i>)}
                    </div>
                    <div className="tp-body2">
                      <div className="tp-nav" style={{background: pv.card}}>
                        <span className="tp-h" style={{background: pv.secondary}}></span>
                        <span className="tp-av" style={{background: pv.accent}}></span>
                      </div>
                      <div className="tp-content">
                        <div className="tp-kpis">
                          {[['128','PEDIDOS',pv.primary,'#fff'],['$9.4k','INGRESOS',pv.secondary,'#fff'],['+18%','CRECIMIENTO',pv.accent,pv.onAccent]].map(([n,l,bg,c],i) =>
                            <div className="tp-kpi" style={{background: bg, color: c}} key={i}><b>{n}</b><small>{l}</small></div>)}

    // ============== Activity Logs View ==============
    const LOG_BLANK = { search: '', user: '', action: '', from: '', to: '' };
    const LOG_EXACT = [['user', 'User'], ['action', 'Action']], LOG_TEXT = ['User', 'Action', 'Details'];
    const LOG_COLS = [['User', 'Usuario'], ['Action', 'Acción'], ['Details', 'Detalles']];

    function LogsView({ initialSearch }) {
      const { data, error, mutate } = useSWR('logs:all', () => gsRun('getLogs'), { revalidateOnFocus: false });
      const rows = useMemo(() => data ? withTs(data.success ? data.data : [], 'Timestamp') : undefined, [data]);
      const loading = rows === undefined && !error;
      // kpis + picker options in ONE pass
      const { kpi, userOptions, actionOptions } = useMemo(() => {
        const list = rows || [], d0 = new Date(), users = new Set(), actions = new Set();
        const lo = d0.setHours(0, 0, 0, 0), hi = lo + 86400000;          // today, local
        let todayN = 0, logins = 0;
        for (const l of list) {
          if (l._ts >= lo && l._ts < hi) todayN++;
          if (/login/i.test(l.Action || '')) logins++;
          if (l.User) users.add(l.User);
          if (l.Action) actions.add(l.Action);
        }
        return {
          kpi: [
            [list.length, 'Total Actividades', 'fa-list-check', 'bg-navy'],
            [todayN, 'Actividades de Hoy', 'fa-calendar-day', 'bg-success'],
            [users.size, 'Usuarios Únicos', 'fa-user-group', 'bg-info'],
            [logins, 'Inicios de Sesión', 'fa-right-to-bracket', 'bg-warning'],
          ],
          userOptions: [...users].sort(),
          actionOptions: [...actions].sort(),
        };
      }, [rows]);
      const tableElRef = useRef(null);
      const [counts, setCounts] = useState({ shown: 0, total: 0 });
      const { filters, setF, reset, args } = useListFilters(LOG_BLANK, initialSearch, LOG_EXACT, LOG_TEXT);

      // audit view, so no selection
      const tableRef = useTabulator(tableElRef, rows, 'logs', (d) => {
        const t = new Tabulator(tableElRef.current, {
          data: d, layout: 'fitColumns', responsiveLayout: false, placeholder: 'Aún no hay actividad registrada',
          pagination: true, paginationSize: 10, paginationSizeSelector: [10, 25, 50, 100], paginationCounter: 'rows',
          initialSort: [{ column: 'Timestamp', dir: 'desc' }],
          columns: [
            { title: 'Hora', field: 'Timestamp', width: 190, formatter: (c) => fmtWhen(c.getValue()) },
            { title: 'Usuario', field: 'User', width: 160 },
            { title: 'Acción', field: 'Action', width: 190, formatter: (c) => `<span class="tb-pill role">${esc(c.getValue())}</span>` },
            { title: 'Detalles', field: 'Details', minWidth: 220 },
          ],
        });
        trackCounts(t, setCounts);
        return t;
      }, args);

      // audit view = exports only, no import
      useEffect(() => { setPageActions(exportActs(() => tableRef.current, 'activity_logs', 'Registro de Actividad')); return () => setPageActions([]); }, []);

      if (error && !data) return <LoadError onRetry={() => mutate()} />;

      return (
        <div className="data-section">
          {loading ? <KpiSkeleton /> : (
            <div className="lte-kpi-grid">
              {kpi.map(([v, l, ic, c], i) => <SmallBox key={i} value={v} label={l} icon={ic} color={c} />)}
            </div>
          )}
          {!loading && (
            <TableToolbar filters={filters} setF={setF} onReset={reset} searchPh="Buscar usuario, acción, detalles..." dateLabel="Registrado entre"
              cols={LOG_COLS} tableRef={tableRef}
              selects={[{ k: 'user', icon: 'fa-user', all: 'Todos los Usuarios', options: userOptions },
                        { k: 'action', icon: 'fa-bolt', all: 'Todas las Acciones', options: actionOptions }]} />
          )}

          {loading && <TableSkeleton rows={8} columns={4} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            {/* audit view — no row selection, no bulk actions, exports only */}
            <div className="tb-bar">
              <span className="tb-bulk-n"><i className="fas fa-clock-rotate-left"></i> Registro de auditoría — solo lectura</span>
              <span className="tb-count">Mostrando {counts.shown} de {counts.total} entradas</span>
            </div>
            <div ref={tableElRef} className="tb-table"></div>
          </div>
        </div>
      );
    }

    // ============== Role add / edit modal ==============
    function RoleModal({ role, roles, onSave, onClose }) {
      const [f, setF] = useState({
        key: role?.key || '', label: role?.label || '', color: role?.color || '#0074D9',
        hidden_signup: !!role?.hidden_signup, copyFrom: '',
      });
      const [saving, setSaving] = useState(false);
      const put = (k) => (v) => setF((o) => ({ ...o, [k]: v && v.target ? (v.target.type === 'checkbox' ? v.target.checked : v.target.value) : v }));
      const copyOpts = useMemo(() => (roles || []).map((r) => ({ value: r.key, label: 'Copiar permisos de ' + r.label })), [roles]);
      const submit = (e) => { e.preventDefault(); setSaving(true); Promise.resolve(onSave(f)).finally(() => setSaving(false)); };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" style={{ maxWidth: '520px' }} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className="fas fa-user-shield"></i> {role ? 'Editar' : 'Agregar'} Rol</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <form onSubmit={submit}>
                <div className="form-group">
                  <label><i className="fas fa-key"></i> Clave del Rol *</label>
                  <input type="text" value={f.key} required disabled={!!role} maxLength={30} placeholder="ej. Gerente" onChange={put('key')} />
                  <small className="sec-note" style={{ fontSize:'12px' }}>
                    {role ? 'La clave es lo que almacena Users.Role — no se puede cambiar.'
                          : 'Almacenada en cada usuario con este rol. Letras, números, espacio, _ o - (2-30).'}
                  </small>
                </div>
                <div className="form-grid">
                  <div className="form-group">
                    <label><i className="fas fa-tag"></i> Etiqueta *</label>
                    <input type="text" value={f.label} required placeholder="Visible en la interfaz" onChange={put('label')} />
                  </div>
                  <div className="form-group">
                    <label><i className="fas fa-palette"></i> Color</label>
                    <input type="color" value={f.color} style={{ height:'46px', padding:'4px' }} onChange={put('color')} />
                  </div>
                </div>
                {!role && <SearchableDropdown label="Comenzar desde" icon="fas fa-copy" options={copyOpts} value={f.copyFrom}
                            placeholder="Sin acceso (elegir permisos después)" onChange={put('copyFrom')} />}
                <div className="form-group toggle-row" style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:'12px' }}>
                  <label style={{ marginBottom:0 }}><i className="fas fa-user-slash"></i> Ocultar en registro</label>
                  <label className="tgl">
                    <input type="checkbox" checked={f.hidden_signup} onChange={put('hidden_signup')} />
                    <span className="tgl-track"></span>
                  </label>
                </div>
                <div className="form-actions">
                  <button type="submit" className="btn btn-primary" disabled={saving}>
                    <i className={`fas ${saving ? 'fa-spinner fa-spin' : 'fa-save'}`}></i> {saving ? 'Guardando...' : 'Guardar'}
                  </button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancelar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ============== Roles & Permissions Matrix (Editor Only) ==============
    const PERMS = [['v', 'Ver'], ['a', 'Agregar'], ['e', 'Editar'], ['d', 'Eliminar']];
    // implied-view rule — mirrors toggleRbac on the server
    const applyToggle = (cell, perm, nv) => {
      const c = { ...(cell || { v:0, a:0, e:0, d:0 }), [perm]: nv };
      if (perm === 'v' && !nv) c.a = c.e = c.d = 0;
      if (perm !== 'v' && nv) c.v = 1;
      return c;
    };

    function PermissionsMatrixView() {
      const { data: res, error, isLoading, mutate } = useSWR('rbac:matrix', () => gsRun('getRbacMatrix'), { revalidateOnFocus: false, dedupeMs: 30000 });
      const data = res && res.success ? res : null;
      const [showRole, setShowRole] = useState(false);
      const [editingRole, setEditingRole] = useState(null);
      const openRole = (r) => { setEditingRole(r); setShowRole(true); };
      const closeRole = () => { setShowRole(false); setEditingRole(null); };
      // pages grouped once per payload
      const grouped = useMemo(() => {
        if (!data) return [];
        const m = new Map();
        data.pages.forEach((p) => (m.get(p.group) || m.set(p.group, []).get(p.group)).push(p));
        return [...m];
      }, [data]);
      // the matrix already carries every role — seed the pickers, no second fetch
      useEffect(() => { if (data) swrMutate('roles:list', { success: true, data: data.roles }, false); }, [data]);

      // add role button lives in the header toolbar like every other section action
      useEffect(() => {
        setPageActions([{ icon: 'fa-plus', label: 'Agregar Rol', primary: true, onClick: () => openRole(null) }]);
        return () => setPageActions([]);
      }, []);

      const saveRole = (f) => (editingRole ? gsRun('updateRole', editingRole.key, f) : gsRun('addRole', f))
        .then((r) => {
          if (!r || !r.success) return toastErr(r);
          closeRole(); mutate();                                   // matrix refetch re-seeds every role picker
          Swal.fire({ icon:'success', title:r.message, timer:1500, showConfirmButton:false });
        }).catch(toastErr);

      const removeRole = (r) => Swal.fire({
        icon:'warning', title:`¿Eliminar rol "${r.label}"?`, text:'Solo es posible si ningún usuario tiene este rol asignado.',
        showCancelButton:true, confirmButtonText:'Eliminar', cancelButtonText:'Cancelar', confirmButtonColor:'#ea4335',
      }).then((c) => c.isConfirmed && gsRun('deleteRole', r.key).then((res2) => {
        if (!res2 || !res2.success) return toastErr(res2);
        mutate(); Swal.fire({ icon:'success', title:'Rol eliminado', timer:1500, showConfirmButton:false });
      })).catch(toastErr);

      const toggle = (roleKey, pageKey, perm, cur) => {
        const nv = cur ? 0 : 1;
        mutate((d) => d && d.perms                                  // optimistic
          ? { ...d, perms: { ...d.perms, [roleKey]: { ...d.perms[roleKey], [pageKey]: applyToggle((d.perms[roleKey] || {})[pageKey], perm, nv) } } }
          : d, false);
        gsRun('toggleRbac', roleKey, pageKey, perm, nv)
          .then((r) => { if (!r || !r.success) { toastErr(r); mutate(); } })
          .catch(() => mutate());
      };

      if (isLoading) return <div className="data-section"><TableSkeleton rows={8} columns={4} /></div>;
      if (error && !res) return <LoadError onRetry={() => mutate()} />;
      if (!data) return <NoAccessView />;
      const tableMinW = 200 + data.roles.length * 120; // page col + min role col → wrap scrolls when many roles

      return (
        <div className="data-section">
          <p className="sec-note" style={{ marginBottom:'12px' }}>
            <i className="fas fa-info-circle"></i> Alterna V·A·E·D por rol × página. Los cambios se guardan al instante. Administrador (propietario) tiene acceso total bloqueado.
            Agrega un rol desde el encabezado y luego asígnale páginas aquí — la clave elegida es lo que almacena <code>Users.Role</code>.
          </p>
          <div className="rbac-wrap">
            <table className="rbac-table" style={{ minWidth: tableMinW + 'px' }}>
              <thead><tr>
                <th className="rbac-pagecol">Página</th>
                {data.roles.map((r) => (
                  <th key={r.key}>
                    <span className="rbac-rolehead" style={{ background:r.color }}>{r.label}</span>
                    <div className="rbac-rolebar">
                      <button className="rbac-roleact" title="Editar rol" onClick={() => openRole(r)}><i className="fas fa-pen"></i></button>
                      {!r.is_super && <button className="rbac-roleact del" title="Eliminar rol" onClick={() => removeRole(r)}><i className="fas fa-trash"></i></button>}
                    </div>
                    <div className="rbac-perm-legend">V·A·E·D</div>
                  </th>
                ))}
              </tr></thead>
              <tbody>
                {grouped.map(([grp, pages]) => (
                  <React.Fragment key={grp}>
                    <tr className="rbac-grouprow"><td className="rbac-pagecol">{grp}</td>{data.roles.map((r) => <td key={r.key}></td>)}</tr>
                    {pages.map((pg) => (
                      <tr key={pg.key}>
                        <td className="rbac-pagecol">{pg.label}</td>
                        {data.roles.map((r) => {
                          const cell = (data.perms[r.key] && data.perms[r.key][pg.key]) || {}, locked = !!r.is_super;
                          return (
                            <td key={r.key}><div className="rbac-cell">
                              {PERMS.map(([pk, label]) => (
                                <button key={pk} title={label} className={`rbac-dot${cell[pk] ? ' on' : ''}${locked ? ' locked' : ''}`}
                                  disabled={locked} onClick={() => toggle(r.key, pg.key, pk, cell[pk])}>{pk.toUpperCase()}</button>
                              ))}
                            </div></td>
                          );
                        })}
                      </tr>
                    ))}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>

          {showRole && <RoleModal role={editingRole} roles={data.roles} onSave={saveRole} onClose={closeRole} />}
        </div>
      );
    }

    // ============== Multi-select (tags) — replaces a plain multi <select> ==============
    const MultiItem = React.memo(function MultiItem({ option, checked, onToggle }) {
      return <div className={'searchable-dropdown-item' + (checked ? ' checked' : '')} onClick={() => onToggle(option.value)}>{option.label}</div>;
    });
    function SearchableMultiSelect({ options, values = [], onChange, placeholder = 'Seleccionar...', label, icon, required = false, disabled = false }) {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const ref = useRef(null);
      const sel = useMemo(() => new Set(values), [values]);
      const picked = useMemo(() => options.filter((o) => sel.has(o.value)), [options, sel]);
      const optIdx = useMemo(() => options.map((o) => ({ o, k: String(o.label).toLowerCase() })), [options]);
      const dq = useDeferredValue(search).toLowerCase();
      const filtered = useMemo(() => optIdx.filter((x) => x.k.includes(dq)).map((x) => x.o), [optIdx, dq]);
      useClickAway(ref, () => { setIsOpen(false); setSearch(''); }, isOpen);
      const toggle = useCallback((v) => onChange(sel.has(v) ? values.filter((x) => x !== v) : [...values, v]), [values, sel, onChange]);
      return (
        <div className="form-group">
          {label && <label>{icon && <i className={icon}></i>} {label}{required && ' *'}</label>}
          {picked.length > 0 && (
            <div className="searchable-multi-tags">
              {picked.map((o) => <span key={o.value} className="searchable-multi-tag">{o.label}
                {!disabled && <button type="button" className="searchable-multi-tag-remove" aria-label={'Quitar ' + o.label} onClick={() => toggle(o.value)}><i className="fas fa-times"></i></button>}</span>)}
            </div>
          )}
          <div className="searchable-dropdown" ref={ref}>
            <input type="text" className="searchable-dropdown-input" disabled={disabled} placeholder={values.length ? values.length + ' seleccionados' : placeholder}
              value={isOpen ? search : ''} onChange={(e) => { setSearch(e.target.value); if (!isOpen) setIsOpen(true); }}
              onClick={() => { if (disabled) return; setIsOpen(!isOpen); if (!isOpen) setSearch(''); }} />
            <span className={'searchable-dropdown-arrow' + (isOpen ? ' open' : '')}><i className="fas fa-chevron-down"></i></span>
            {isOpen && !disabled && (
              <div className="searchable-dropdown-list">
                {filtered.length ? filtered.map((o) => <MultiItem key={o.value} option={o} checked={sel.has(o.value)} onToggle={toggle} />)
                  : <div className="searchable-dropdown-item no-results">No se encontraron resultados</div>}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============== Menu — Categories · Add-ons · Products on ONE payload (menu:admin) ==============
    // money for table formatters (built once per table) — follows the shop's currency as soon as settings land
    const _cur = { fmt: (v) => '$ ' + Number(v || 0).toLocaleString('es-CO') };
    const fmtMoney = (v) => _cur.fmt(v);
    const MENU_KEY = 'menu:admin';
    const menuFetch = () => gsRun('getMenuAdmin');
    const useMenu = (on = true) => useSWR(on ? MENU_KEY : null, menuFetch, { revalidateOnFocus: false, dedupeMs: 30000 });
    const menuOf = (r) => (r && r.success ? r : { categories: [], addons: [], products: [], icons: [] });
    // record -> form shape (numbers as text so a half-typed value never jumps)
    const toForm = (blank, row) => Object.fromEntries(Object.keys(blank).map((k) => [k, row && row[k] != null ? (typeof blank[k] === 'string' ? String(row[k]) : row[k]) : blank[k]]));
    const useForm = (blank, row, preset) => { const [f, setF] = useState(() => ({ ...toForm(blank, row), ...(row ? {} : preset || {}) }));
      return [f, setF, (k) => (v) => setF((o) => ({ ...o, [k]: v && v.target ? v.target.value : v }))]; };
    const FlagFld = ({ f, setF, k, label, icon }) => <Fld label={label} icon={icon}><Tgl checked={!!f[k]} onChange={(v) => setF((o) => ({ ...o, [k]: v ? 1 : 0 }))} label={label} /></Fld>;
    const menuList = (listKey, csvKey) => ({ key: MENU_KEY, fetch: menuFetch, listKey, csvOf: (res) => res.csv[csvKey], noDelete: true, onOff: ['Restaurar', 'Archivar'], after: () => swrMutate('store:front') });
    const iconLabel = (ic) => String(ic).replace(/^fa-/, '').replace(/-/g, ' ');
    const moveActs = (x) => (x.canEdit ? '<button class="act" data-act="up" title="Mover arriba" aria-label="Mover arriba"><i class="fas fa-arrow-up"></i></button><button class="act" data-act="down" title="Mover abajo" aria-label="Mover abajo"><i class="fas fa-arrow-down"></i></button>' : '');
    // order + sold-out / featured toggles share one path: server call -> patch the cached list in place
    const moveRow = (api, key, r, dir, el) => { const stop = spinIcon(el);
      gsRun('moveMenuItem', key, r.id, dir).then((x) => { if (!x || !x.success) return toastErr(x);
        api.current.mutate(); }).catch(toastErr).finally(stop); };                  // server hands the list back in menu order
    const flagRows = (api, key, ids, flag, on, el) => { const stop = spinIcon(el);
      return gsRun('setMenuFlag', key, ids, flag, on).then((x) => { if (!x || !x.success) return toastErr(x);
        const hit = new Set(x.ids); api.current.patchList((list) => list.map((y) => (hit.has(y.id) ? { ...y, [flag]: on ? 1 : 0 } : y))); return x; }).catch(toastErr).finally(stop); };
    const tglCell = (on, act, label) => '<button class="act-tgl" data-act="' + act + '" title="' + label + '" aria-label="' + label + '"><span class="tgl"><input type="checkbox" tabindex="-1"' + (on ? ' checked' : '') + ' disabled><span class="tgl-track"></span></span></button>';
    const flagPill = (on, yes, no) => '<span class="tb-pill ' + (on ? 'ok' : 'off') + '"><i></i>' + (on ? yes : no) + '</span>';
    const yesNo = (v) => (v ? 'Sí' : 'No');
    const ARCH = { k: 'archived', label: 'Archivado', tone: 'var(--c-secondary)' };

    // ---- Categories ----
    const CAT_BLANK = { name: '', icon: 'fa-mug-hot', tagline: '', is_active: 1 };
    function CategoryForm({ row, onClose, onSave }) {
      const [f, setF, put] = useForm(CAT_BLANK, row);
      const { data: mres } = useMenu();
      const icons = (menuOf(mres).icons || []).map((ic) => ({ value: ic, label: iconLabel(ic) }));
      const { busy, err, setErr, run } = useSaver(onSave);
      const submit = () => (!f.name.trim() ? setErr('Ingresa el nombre de la categoría') : run({ ...f, id: row ? row.id : 0 }));
      const seed = () => setF((o) => seedForm(o, 'category', 'Categoría', { name: (n) => 'Categoría ' + n, icon: () => 'fa-star', tagline: (n) => 'Eslogan ' + n, is_active: () => 1 }));
