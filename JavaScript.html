            <div className="set-body ab-contact">
              <span className="auth-contact-title"><i className="fas fa-paper-plane"></i> Let's Work Together</span>
              <div className="auth-contact-links">
                <a className="auth-wa" href="https://whatsapp.rameezscripts.com" target="_blank" rel="noopener"><i className="fa-brands fa-whatsapp"></i> WhatsApp</a>
                <a className="auth-em" href="mailto:Contact@rameezscripts.com"><i className="fa-solid fa-envelope"></i> Email</a>
              </div>
            </div>
          </section>
        </div>
      );
    }

    // ============== Welcome tour (first login, once per user; a role only sees steps for pages it can open) ==============
    const TOUR_STEPS = [
      { icon: 'fa-mug-hot', page: 'products', t: 'Build your menu', d: 'Categories, drinks, sizes and add-ons with their own prices.' },
      { icon: 'fa-building-columns', page: 'paymethods', t: 'Add payment methods', d: 'A QR code or bank details that customers pay to.' },
      { icon: 'fa-magnifying-glass-dollar', page: 'review', t: 'Check payments', d: 'Compare each receipt with your bank app, then approve or reject.' },
      { icon: 'fa-blender', page: 'board', t: 'Work the Order Board', d: 'Start, Ready, Picked up. New orders chime in on their own.' },
      { icon: 'fa-chart-line', page: 'dashboard', t: 'Sales and reports', d: 'Today\'s sales, best sellers, and a per-method total to match your bank.' },
    ];
    function TourModal({ onClose, perms, owner }) {
      const steps = useMemo(() => { const v = TOUR_STEPS.filter((x) => pageVisible(x.page, perms, owner));
        return v.length ? v : TOUR_STEPS.slice(0, 1); }, [perms, owner]);
      const [step, setStep] = useState(0);
      const s = steps[step], last = step === steps.length - 1;
      return (
        <div className="modal-overlay">
          <div className="modal tour-modal">
            <div className="modal-body tour-body">
              <div className="tour-ico"><i className={'fas ' + s.icon}></i></div>
              <h3 className="tour-t">{s.t}</h3>
              <p className="tour-d">{s.d}</p>
              <div className="tour-dots">{steps.map((_, i) => <span key={i} className={i === step ? 'on' : ''} onClick={() => setStep(i)} role="button" aria-label={'Step ' + (i + 1)}></span>)}</div>
            </div>
            <div className="form-actions tour-acts">
              <button className="btn btn-secondary" onClick={onClose}><i className="fas fa-forward"></i> Skip</button>
              {last
                ? <button className="btn btn-success" onClick={onClose}><i className="fas fa-check"></i> Get Started</button>
                : <button className="btn btn-primary" onClick={() => setStep(step + 1)}>Next <i className="fas fa-arrow-right"></i></button>}
            </div>
          </div>
        </div>
      );
    }

    // ============== Main Content Router ==============
    function MainContent({ activeMenu, sess, perms, canEditRbac, onSettingsUpdate, onEmailChange, setActiveMenu, jump, deepSearch, fresh }) {
      const seed = (p) => (deepSearch.page === p ? deepSearch.term : ''); // 360-search term for this page
      const seedF = (p) => (deepSearch.page === p ? deepSearch.filters : null); // drill-down filters for this page
      const gate = (ok, el) => (ok ? el : <NoAccessView />);
      const m = PAGE_META[activeMenu];
      if (m && m.soon) return gate(canEditRbac, <ComingSoon page={activeMenu} />);
      switch (activeMenu) {
        case 'settings':    return gate(can(perms, 'settings', 'v'), <AppSettingsView perms={perms} initialTab={(seedF('settings') || {}).tab} />);
        case 'board':       return gate(can(perms, 'orders', 'v'), <BoardView perms={perms} jump={jump} fresh={fresh || []} />);
        case 'review':      return gate(can(perms, 'orders', 'v'), <ReviewView perms={perms} initialNo={seed('review')} />);
        case 'orders':      return gate(can(perms, 'orders', 'v'), <OrdersView perms={perms} initialSearch={seed('orders')} initialFilters={seedF('orders')} />);
        case 'paymethods':  return gate(can(perms, 'paymethods', 'v'), <PayMethodsView perms={perms} initialSearch={seed('paymethods')} />);
        case 'products':    return gate(can(perms, 'products', 'v'), <ProductsView perms={perms} initialSearch={seed('products')} initialFilters={seedF('products')} />);
        case 'dashboard':   return gate(can(perms, 'dashboard', 'v'), <DashboardView perms={perms} jump={jump} />);
        case 'customers':   return gate(can(perms, 'customers', 'v'), <CustomersView perms={perms} jump={jump} initialSearch={seed('customers')} />);
        case 'reports':     return gate(can(perms, 'reports', 'v'), <ReportsView perms={perms} initialFilters={seedF('reports')} />);
        case 'categories':  return gate(can(perms, 'categories', 'v'), <MasterPage cfg={CAT_CFG} perms={perms} initialSearch={seed('categories')} />);
        case 'addons':      return gate(can(perms, 'addons', 'v'), <AddonsView perms={perms} initialSearch={seed('addons')} />);
        case 'about':       return gate(can(perms, 'about', 'v'), <AboutView />);
        case 'users':       return gate(can(perms, 'users', 'v'), <UsersView perms={perms} initialSearch={seed('users')} />);
        case 'mysettings':  return gate(can(perms, 'mysettings', 'v'), <MySettingsView sess={sess} canEditRbac={canEditRbac} onSettingsUpdate={onSettingsUpdate} />);
        case 'logs':        return gate(can(perms, 'logs', 'v'), <LogsView initialSearch={seed('logs')} />);
        case 'permissions': return gate(canEditRbac, <PermissionsMatrixView />);
        case 'account':     return <AccountView currentUser={sess.username} currentEmail={sess.email} role={sess.role} onEmailChange={onEmailChange} />;
        default:            return <NoAccessView />;
      }
    }

    // ============== Dashboard Layout (admin shell) ==============
    // page -> [key, fetcher] it reads first (same key + fetcher the view uses, so a hover pre-fills its cache)
    const PREFETCH = {
      dashboard: () => { const rk = ls.get('dashRange') || 'today'; return rk === 'custom' ? null : ['dash:' + rk, () => gsRun('getDashboard', rk)]; },
      board: () => [OPEN_KEY, openFetch], review: () => [OPEN_KEY, openFetch],
      orders: () => { const t = todayYmd(); return ['orders:list:' + t + ':' + t, () => gsRun('getOrders', t, t)]; },
      products: () => [MENU_KEY, menuFetch], categories: () => [MENU_KEY, menuFetch], addons: () => [MENU_KEY, menuFetch],
      customers: () => ['customers:list', () => gsRun('getCustomers')], paymethods: () => [PM_KEY, pmFetch],
      settings: () => ['maint', () => gsRun('getMaintenance')], users: () => ['users:all', () => gsRun('getAllUsers')],
      permissions: () => ['rbac:matrix', () => gsRun('getRbacMatrix')], logs: () => ['logs:all', () => gsRun('getLogs')], about: () => ['about:info', () => gsRun('getAboutInfo')],
    };
    function Dashboard({ sess, themeMode, onThemeToggle, onSettingsUpdate, onEmailChange, onLogout, onViewStore }) {
      const { username: user, email, role, profileImage, permissions, canEditRbac } = sess;
      // ?page=<key> (the links in shop emails) opens that page when the role can see it
      const sp = window.__START_PAGE__, firstPage = sp && sp !== 'menu' && pageVisible(sp, permissions, canEditRbac) ? sp : homePage(permissions, canEditRbac, sess.has_open);
      useEffect(() => { if (sp && sp !== 'menu') window.__START_PAGE__ = ''; }, []);
      const [activeMenu, setActiveMenu] = useState(firstPage);
      const [deepSearch, setDeepSearch] = useState({ page: '', term: '', filters: null }); // seeds the destination's search / filters (360 search, dashboard drill-downs)
      const jump = useCallback((page, term, filters) => { startTransition(() => setActiveMenu(page)); setDeepSearch({ page: term || filters ? page : '', term: term || '', filters: filters || null }); }, []);
      const go = useCallback((page) => jump(page, ''), [jump]);    // plain nav — clears the seed
      const [showMobileSidebar, setShowMobileSidebar] = useState(false);
      // first-run tour — once per user, only inside the signed-in shell
      const tourKey = 'ai_tour_' + user;
      const [tour, setTour] = useState(() => !ls.get(tourKey));
      const closeTour = () => { setTour(false); ls.set(tourKey, '1'); };

      const pageMeta = PAGE_META[activeMenu] || { label: 'Dashboard', icon: 'fa-chart-line', group: 'General' };
      // ONE open-orders poll for the whole shell: sidebar pills + the new-order alert (the board / review screens share it)
      const { data: od } = useOpenOrders(can(permissions, 'orders', 'v') && BUILD_PHASE >= 6);
      const openRows = od && od.success ? od.rows : null, badges = useMemo(() => badgesOf(openRows), [openRows]), fresh = useNewOrderAlert(openRows);
      const prefetch = (k) => { const x = PREFETCH[k] && PREFETCH[k](); if (x) swrPrefetch(x[0], x[1]); };

      return (
        <>
          <div className={`sidebar-overlay ${showMobileSidebar ? 'show' : ''}`} onClick={() => setShowMobileSidebar(false)}></div>

          <div className="app-container">
            <Sidebar activeMenu={activeMenu} setActiveMenu={go} role={role} profileImage={profileImage}
              showMobile={showMobileSidebar} setShowMobile={setShowMobileSidebar}
              perms={permissions} canEditRbac={canEditRbac} badges={badges} onPrefetch={prefetch} />
            <div className="main-content">
              <div className="header navbar">
                <div className="navbar-start">
                  <button className="notif-btn nav-ham" onClick={() => setShowMobileSidebar(true)} title="Menu" aria-label="Menu"><i className="fas fa-bars"></i></button>
                  <div className="nav-page">
                    <h1 className="nav-page-title"><i className={`fas ${pageMeta.icon}`}></i> <span>{pageMeta.label}</span></h1>
                    <div className="nav-crumb"><i className="fas fa-house"></i> Home <span className="nav-crumb-sep">/</span> {tx('grp.' + pageMeta.group)} <span className="nav-crumb-sep">/</span> {pageMeta.label}</div>
                  </div>
                </div>
                <div className="hdr-actions">
                  <HeaderPageActions />
                  <GlobalSearch perms={permissions} canEditRbac={canEditRbac} jump={jump} />
                  <HeaderPeriod />
                  <button className="notif-btn hdr-store" onClick={onViewStore} title="View Store" aria-label="View Store"><i className="fas fa-store"></i></button>
                  <HeaderThemeMenu themeMode={themeMode} onThemeToggle={onThemeToggle} onSettingsUpdate={onSettingsUpdate} />
                  <ClearCacheButton />
                  <NotificationBell currentUser={user} perms={permissions} setActiveMenu={go} />
                  <button className="notif-btn hdr-dark" onClick={onThemeToggle} title={`Switch to ${themeMode === 'light' ? 'Dark' : 'Light'} Mode`} aria-label="Toggle dark mode">
                    <i className={`fas fa-${themeMode === 'light' ? 'moon' : 'sun'}`}></i>
                  </button>
                  <span className="nav-welcome"><span className="nav-welcome-hi">Welcome</span><strong>{sess.fullName || user}</strong></span>
                  <UserMenu user={user} email={email} role={role} profileImage={profileImage} perms={permissions} setActiveMenu={go} onLogout={onLogout} />
                </div>
              </div>
              <PermsCtx.Provider value={permissions}>
                <ErrorBoundary key={activeMenu}>
                  <MainContent activeMenu={activeMenu} sess={sess} perms={permissions} canEditRbac={canEditRbac}
                    onSettingsUpdate={onSettingsUpdate} onEmailChange={onEmailChange} setActiveMenu={go} jump={jump} deepSearch={deepSearch} fresh={fresh} />
                </ErrorBoundary>
                <Order360Host />
              </PermsCtx.Provider>
            </div>
          </div>

          <BottomNavigation activeMenu={activeMenu} setActiveMenu={go} perms={permissions} owner={canEditRbac} setShowMobileSidebar={setShowMobileSidebar} />
          {tour && <TourModal onClose={closeTour} perms={permissions} owner={canEditRbac} />}
        </>
      );
    }

    // ============== Main App ==============
    // session = ONE object (state + localStorage together): token, identity, perms, settings, loginTime
    function App() {
      const [sess, setSess] = useState(readSession);
      const [themeMode, setThemeMode] = useState(() => (sess && sess.themeMode) || ls.get('appThemeMode', 'dark'));   // first visit = dark storefront
      const [store, setStore] = useState(false);                          // admin looking at the storefront

      // write-through: state and the stored copy never drift
      const save = (s) => { _auth.tok = s ? s.token : ''; ls.set(SESSION_KEY, s ? JSON.stringify(s) : null); setSess(s); };
      const patch = (p) => setSess((s) => { if (!s) return s; const n = { ...s, ...p }; ls.set(SESSION_KEY, JSON.stringify(n)); return n; });
      _auth.tok = sess ? sess.token : '';

      // leave: drop token + every cached payload so the next login never sees this user's data
      const end = () => { save(null); swrClearAll(); setStore(false); setThemeMode(ls.get('appThemeMode', 'light')); };

      useEffect(() => { document.body.classList.toggle('dark-mode', themeMode === 'dark'); }, [themeMode]);

      // palette: preset vars (cached for the pre-paint bootstrap) or the legacy 3-colour shape
      const customColors = sess ? sess.customColors : '';
      useEffect(() => {
        if (!customColors) return;
        try {
          const o = JSON.parse(customColors);
          if (o.vars) { applyThemeVars(o.vars); cacheThemeVars(o.vars); return; }
          applyThemeVars(Object.fromEntries([['--navy-primary', o.primary], ['--navy-accent', o.accent], ['--text-primary', o.text]].filter(([, v]) => v)));
        } catch (e) {}
      }, [customColors]);

      useEffect(() => {
        // any AUTH reply (expired / revoked / deactivated) ends the session once, from one place
        _auth.onExpire = () => {
          if (!_auth.tok) return;
          end();
          Swal.fire({ icon: 'warning', title: 'Session Expired', text: 'Your session has expired. Please sign in again.', confirmButtonColor: 'var(--navy-primary)' });
        };
        if (!sess) { ls.set(SESSION_KEY, null); return; }          // stale / pre-token entry
      }, []);
      // perms through SWR: a restored session refetches them (also proves the token is live), focus keeps them fresh after a role change
      const { data: pm } = useSWR(sess ? 'perms:me' : null, () => gsRun('getMyPermissions'), { dedupeMs: 30000 });
      useEffect(() => { if (pm && pm.success) patch({ permissions: pm.perms, canEditRbac: !!pm.canEdit }); }, [pm]);

      const handleLogin = (r) => {
        swrMutate('perms:me', { success: true, perms: r.permissions || null, canEdit: !!r.canEditRbac }, false);   // the login reply already carries them
        save({ token: r.token, username: r.username, email: r.email, role: r.role, fullName: r.fullName || r.username, phone: r.phone || '', address: r.address || '',
               profileImage: r.profileImage || '', themeMode: r.themeMode || 'light', customColors: r.customColors || '', permissions: r.permissions || null,
               canEditRbac: !!r.canEditRbac, loginTime: Date.now() });
        setThemeMode(r.themeMode || 'light'); setStore(false);
        swrMutate('store:front');                                       // signedIn flag + anything per-account
      };

      const flipTheme = () => { const m = themeMode === 'light' ? 'dark' : 'light'; setThemeMode(m); ls.set('appThemeMode', m); return m; }; // survives logout
      const handleThemeToggle = () => { const m = flipTheme(); if (!sess) return; patch({ themeMode: m }); gsRunBg('updateUserSettings', { themeMode: m }).catch(() => {}); };

      // every settings write hands the fresh settings back — apply, no re-read
      const handleSettingsUpdate = (st) => { if (!st) return; patch(st); setThemeMode(st.themeMode || 'light'); };

      const handleLogout = () => Swal.fire({
        icon: 'question', title: 'Sign out?', text: 'Are you sure you want to sign out?',
        showCancelButton: true, confirmButtonColor: 'var(--navy-primary)', confirmButtonText: 'Yes, sign out'
      }).then((c) => {
        if (!c.isConfirmed) return;
        gsRunBg('logout').catch(() => {});                          // kill the token server-side, don't wait on it
        end();
        Swal.fire({ icon: 'success', title: 'Signed out', text: 'See you again soon.', timer: 1500, showConfirmButton: false });
      });

      const admin = !!sess && hasAdminShell(sess.permissions, sess.canEditRbac);
      return (
        <div>
          <GlobalLoadingBar />{/* reads  */}
          <ProcessingOverlay />{/* writes */}
          {admin && !store ? (
            <Dashboard sess={sess} themeMode={themeMode} onThemeToggle={handleThemeToggle} onViewStore={() => setStore(true)}
              onSettingsUpdate={handleSettingsUpdate} onEmailChange={(email) => patch({ email })} onLogout={handleLogout} />
          ) : (
            <StoreApp sess={sess} onLogin={handleLogin} onLogout={handleLogout} onProfile={patch} onAdmin={admin ? () => setStore(false) : null}
              themeMode={themeMode} onThemeToggle={handleThemeToggle} />
          )}
        </div>
      );
    }

    // ============== Render App ==============
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    // one memoised script loader — Babel on a cache miss, jsPDF on the first PDF export
    var _js = {};
    function loadJs(src) {
      return _js[src] || (_js[src] = new Promise(function (ok, bad) {
        var s = document.createElement('script');
        s.src = src; s.onload = ok;
        s.onerror = function () { delete _js[src]; bad(new Error('Could not load ' + src)); };
        document.head.appendChild(s);
      }));
    }

    // compiled-JSX cache: Babel is downloaded and run only when the source changes (hash key), never on a normal load
    (function () {
      var BABEL = 'https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js';
      var src = document.getElementById('app-src').textContent, h = 2166136261;
      for (var i = 0; i < src.length; i++) { h ^= src.charCodeAt(i); h = Math.imul(h, 16777619); }   // fnv-1a
      var key = 'jsx_' + (h >>> 0).toString(36) + '_' + src.length, code = null;
      var run = function (c) { var s = document.createElement('script'); s.textContent = c; document.body.appendChild(s); };
      try { code = localStorage.getItem(key); } catch (e) {}
      if (code) return run(code);
      loadJs(BABEL).then(function () {
        code = Babel.transform(src, { presets: ['react'], sourceType: 'script', compact: true }).code;   // compact: no reformat pass (and no >500 KB note)
        try {                                                     // keep only the current build
          Object.keys(localStorage).forEach(function (k) { if (k.indexOf('jsx_') === 0) localStorage.removeItem(k); });
          localStorage.setItem(key, code);
        } catch (e) {}
        run(code);
      }).catch(function (e) {
        var d = document.createElement('div');
        d.className = 'boot-err'; d.textContent = 'App failed to start: ' + (e && e.message || e);
        document.getElementById('root').appendChild(d);
      });
    })();
  </script>
