    // ============== Searchable dropdown (replaces every plain <select>) ==============
    const DropdownItem = React.memo(function DropdownItem({ option, selected, onSelect }) {
      return <div className={'searchable-dropdown-item' + (selected ? ' selected' : '')} onClick={() => onSelect(option)}>{option.label}</div>;
    });

    // onAdd(text) -> Promise<newValue>: "+ Add new" inside the list, the saved value gets picked without leaving the form
    function SearchableDropdown({ options, value, onChange, placeholder = 'Select...', label, icon, required = false, disabled = false, onAdd, addLabel = 'Add' }) {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const [adding, setAdding] = useState(false);
      const ref = useRef(null);
      const selectedLabel = (options.find((o) => o.value === value) || {}).label || '';
      // decorate once - filter on the cached lowercase key, not on every keystroke
      const optIdx = useMemo(() => options.map((o) => ({ o, k: String(o.label).toLowerCase() })), [options]);
      const dq = useDeferredValue(search).toLowerCase();
      const filtered = useMemo(() => optIdx.filter((x) => x.k.indexOf(dq) !== -1).map((x) => x.o), [optIdx, dq]);
      const typed = search.trim(), exact = optIdx.some((x) => x.k === typed.toLowerCase());

      useClickAway(ref, () => { setIsOpen(false); setSearch(''); }, isOpen);

      const pickOpt = useCallback((o) => { onChange(o.value); setIsOpen(false); setSearch(''); }, [onChange]);
      const addNew = () => { if (!typed || adding) return; setAdding(true);
        Promise.resolve(onAdd(typed)).then((v) => { if (v != null && v !== '') pickOpt({ value: v }); }).finally(() => setAdding(false)); };

      return (
        <div className="form-group">
          {label && <label>{icon && <i className={icon}></i>} {label}{required && ' *'}</label>}
          <div className="searchable-dropdown" ref={ref}>
            <input type="text" className="searchable-dropdown-input" placeholder={placeholder} disabled={disabled}
              value={isOpen ? search : selectedLabel} required={required && !value}
              onChange={(e) => { setSearch(e.target.value); if (!isOpen) setIsOpen(true); }}
              onClick={() => { if (disabled) return; setIsOpen(!isOpen); if (!isOpen) setSearch(''); }} />
            <span className={'searchable-dropdown-arrow' + (isOpen ? ' open' : '')}><i className="fas fa-chevron-down"></i></span>

              <div className="searchable-dropdown-list">
                <div className={'searchable-dropdown-item' + (!value ? ' selected' : '')} onClick={() => pickOpt({ value: '', label: '' })}>{placeholder}</div>

                  ? filtered.map((o) => <DropdownItem key={o.value} option={o} selected={value === o.value} onSelect={pickOpt} />)
                  : <div className="searchable-dropdown-item no-results">No results found</div>}

                  ? <div className={'searchable-dropdown-item sd-add' + (adding ? ' busy' : '')} onClick={addNew}>

                  : !typed && <div className="searchable-dropdown-item sd-add muted"><i className="fas fa-plus"></i> Type a name to add a new one</div>)}
              </div>

    // ============== Motion & Feedback (overlay = writes, top bar = reads) ==============
    // re-render on a module store ping (overlay, top bar, header actions)
    const useStore = (subs) => {
      const [, force] = useState(0);
      useEffect(() => { const cb = () => force((n) => n + 1); subs.add(cb); return () => subs.delete(cb); }, [subs]);
    };

    // ===== write feedback: counted busy store -> ONE branded overlay =====
    const _busy = { n: 0, verb: '', note: '', subs: new Set() };
    const busyPing = () => _busy.subs.forEach((cb) => cb());
    const busyOn = (verb, note) => { _busy.n++; _busy.verb = verb || 'Working...'; _busy.note = note || ''; busyPing(); };
    const busyOff = () => { _busy.n = Math.max(0, _busy.n - 1); if (!_busy.n) { _busy.verb = ''; _busy.note = ''; } busyPing(); };
    const busyNote = (t) => { _busy.note = t || ''; busyPing(); };            // known-count ops
    const busyRun = (verb, p) => { busyOn(verb); return Promise.resolve(p).finally(busyOff); };
    // global net: an unexpected error or a promise nobody caught must never leave the screen locked under the overlay
    const busyReset = () => { if (!_busy.n) return; _busy.n = 0; _busy.verb = ''; _busy.note = ''; busyPing(); };
    window.addEventListener('error', () => busyReset());
    window.addEventListener('unhandledrejection', () => busyReset());

    // verb off the endpoint name - a new write endpoint gets feedback for free, no call-site churn
    const WRITE_VERBS = [[/^bulkImport|^import/, 'Importing...'], [/^backup/, 'Backing up...'], [/^(bulkDelete|delete|remove|archive)/, 'Deleting...'],
      [/^approve/, 'Approving...'], [/^reject/, 'Rejecting...'], [/^cancel/, 'Cancelling...'], [/^install/, 'Installing...'], [/^move/, 'Saving order...'],
      [/^place/, 'Placing order...'], [/^reupload/, 'Uploading receipt...'], [/^(mark|undo)/, 'Updating...'], [/^send/, 'Sending...'],
      [/^upload/, 'Uploading...'], [/^signup/, 'Creating account...'], [/^(forgotPassword|resetPassword)/, 'Sending...'],
      [/^clear/, 'Removing...'], [/^(save|add|create|insert)/, 'Saving...'], [/^(update|set|toggle|bulk)/, 'Updating...']];
    const verbOf = (fn) => { const h = WRITE_VERBS.find((v) => v[0].test(fn)); return h ? h[1] : ''; };

    function ProcessingOverlay() {
      useStore(_busy.subs);
      useEffect(() => {                                                      // swallow ESC while a write is in flight
        const esc = (e) => { if (_busy.n && e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); } };
        document.addEventListener('keydown', esc, true);
        return () => document.removeEventListener('keydown', esc, true);
      }, []);
      if (!_busy.n) return null;
      return (
        <div className="proc-ov" role="status" aria-live="polite" aria-busy="true"

          <img src={LOGO_URL} alt="" className="proc-logo" />
          <div className="proc-bar"><i></i></div>
          <div className="proc-label">{_busy.verb}</div>
          {_busy.note ? <div className="proc-count">{_busy.note}</div> : null}
        </div>
      );
    }

    // ===== read feedback: thin top bar, driven off the SWR in-flight map =====
    const _bar = { subs: new Set() };
    const barPing = () => _bar.subs.forEach((cb) => cb());

    function GlobalLoadingBar() {
      useStore(_bar.subs);
      return _swr.inflight.size ? <div className="top-loadbar"><span></span></div> : null;

    // spin the clicked control for the life of a call - row actions report themselves, not the header
    const spinIcon = (el) => {
      const i = el && el.querySelector('i'); if (!i) return () => {};

    const toastOk = (msg, title) => Swal.fire({ icon: 'success', title: title || 'Success!', text: msg, timer: 2000, showConfirmButton: false });
    // an expired session already raised its own dialog — never stack a second one
    const toastErr = (e) => e && e.code === 'AUTH' ? null : Swal.fire({ icon: 'error', title: 'Error', text: (e && (e.message || e.msg)) || 'Something went wrong' });

    // ============== Server calls ==============
    // session token rides as arg 0 on every call except the public ones; an AUTH reply ends the session in ONE place
    const OPEN_FNS = new Set(['authenticateUser', 'signup', 'forgotPassword', 'resetPassword']);
    const _auth = { tok: '', onExpire: null };
    const gsCall = (fn, args) => new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((r) => { if (r && r.code === 'AUTH' && _auth.tok && _auth.onExpire) _auth.onExpire(); resolve(r); })
        .withFailureHandler(reject)[fn](...(OPEN_FNS.has(fn) ? args : [_auth.tok, ...args]));
    });
    // writes auto-raise the overlay (verb from the fn name) and dirty the keys they touch; reads stay silent - the top bar covers those
    const gsRun = (fn, ...args) => { const v = verbOf(fn);
      return v ? busyRun(v, gsCall(fn, args).then((r) => { if (r && r.success) swrAfterWrite(fn); return r; })) : gsCall(fn, args); };
    const gsRunBg = (fn, ...args) => gsCall(fn, args);   // silent background write (theme-mode flip)

    // pdf libs load on the first PDF click, not on every page load
    const loadPdf = () => loadJs('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js')

    // CSV / PDF / Print off a Tabulator instance, resolved at click time
    const exportActs = (dt, base, title) => [
      { icon: 'fa-file-csv', label: 'CSV', onClick: () => dt() && dt().download('csv', base + '.csv') },
      { icon: 'fa-file-pdf', label: 'PDF', onClick: () => dt() && loadPdf().then(() => dt().download('pdf', base + '.pdf', { orientation: 'landscape', title })).catch(toastErr) },
      { icon: 'fa-print', label: 'Print', onClick: () => dt() && dt().print(false, true) },
    ];

    // table cell helpers — every value that lands in markup goes through esc()
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
    // avatar initials: demo.admin -> DA, user7 -> U7, saad -> SA
    const initials = (n) => {
      const t = String(n || '?').trim(), p = t.split(/[^A-Za-z0-9]+/).filter(Boolean);
      if (p.length > 1) return (p[0][0] + p[1][0]).toUpperCase();
      const m = t.match(/^([A-Za-z]+)(\d+)$/);
      return (m ? m[1][0] + m[2].slice(-1) : t.slice(0, 2)).toUpperCase();
    };
    // table cells follow the Settings date / time format (dmy / dmyhm below)
    const fmtDate = (d) => (d ? esc(dmy(d)) : '<span class="tb-na">N/A</span>');
    const fmtWhen = (d) => (d ? esc(dmyhm(d)) : '<span class="tb-na">N/A</span>');

    // csv parse — RFC 4180 (quoted fields, escaped quotes, embedded newlines); shared by all list imports
    function parseCSV(text) {
      const rows = [];
      let row = [], field = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQ) {
          if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
          else if (c === '"') inQ = false;
          else field += c;
        } else {
          if (c === '"') inQ = true;
          else if (c === ',') { row.push(field); field = ''; }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else if (c !== '\r') field += c;
        }
      }
      if (field !== '' || row.length) { row.push(field); rows.push(row); }
      return rows.filter(r => r.some(v => v !== ''));
    }

    // ---- page actions: active view publishes its toolbar buttons -> header renders them ----
    const _pgActs = { list: [], subs: new Set() };

    // header slot — shows ONLY the active section's buttons (views clear on unmount)
    // icon-only (label = tooltip + aria-label); phones keep the primary icon, the rest fold into one overflow menu
    function HeaderPageActions() {
      useStore(_pgActs.subs);

    const swrNotify = (key) => { const s = _swr.subs.get(key); if (s) s.forEach((cb) => cb()); };

    const swrRevalidate = (key, fetcher, dedupeMs = 2000) => {

    function LoginPage({ onLogin, mode: mode0, onBack, shop }) {
      const resetToken = window.__RESET_TOKEN__ || '';

      const [f, setF] = useState(() => ({ username: ls.get('rsLoginUser', ''), name: '', email: '', phone: '', password: '', password2: '' }));

      const go = (m) => { setMode(m); setError(''); setMsg(''); setF((o) => ({ ...o, password: '', password2: '' })); };

        return run('resetPassword', [resetToken, f.password], (r) => { window.__RESET_TOKEN__ = ''; go('login'); setMsg(r.message); });

              {(mode === 'login' || mode === 'forgot') && field('authUser', 'Email', 'fa-envelope',

                  placeholder="you@example.com" autoComplete="username" />)}
              {mode === 'signup' && field('authEmail', 'Email', 'fa-envelope',
                <input id="authEmail" type="email" value={f.email} onChange={put('email')} required placeholder="you@example.com" autoComplete="email" />)}
              {mode === 'signup' && field('authPhone', 'Phone', 'fa-phone',
                <input id="authPhone" type="tel" value={f.phone} onChange={put('phone')} required placeholder="Your phone number" autoComplete="tel" />)}
              {mode !== 'forgot' && field('authPwd', mode === 'login' ? 'Password' : 'New password', 'fa-key',
                pwdInput('password', 'authPwd', mode === 'login' ? 'Enter your password' : 'At least 8 characters', mode === 'login' ? 'current-password' : 'new-password'))}
              {(mode === 'signup' || mode === 'reset') && field('authPwd2', 'Confirm password', 'fa-key',

    // ============== Cart — stored on this device: ids + choices only; prices always come from the live menu ==============
    const CART_KEY = 'cart_v1', CART_MAX_LINES = 30, QTY_MAX = 20;
    const readCart = () => { const a = ls.json(CART_KEY, []); return Array.isArray(a) ? a.filter((l) => l && l.product_id && l.qty > 0).slice(0, CART_MAX_LINES) : []; };
    // identical builds share one line: drink + size + sugar + ice + add-ons (sorted) + note
    const lineKey = (l) => [l.product_id, l.size || '', l.sugar || '', l.ice || '', (l.addon_ids || []).slice().sort((a, b) => a - b).join('.'), String(l.note || '').trim().toLowerCase()].join('|');
    const roundTo = (v, dp) => { const f = Math.pow(10, dp); return Math.round((Number(v) || 0) * f + 1e-9) / f; };
    // O(1) lookups over the live menu, built once per payload
    const menuIx = (F) => ({ p: new Map(F.products.map((x) => [x.id, x])), a: new Map(F.addons.map((x) => [x.id, x])), c: new Map(F.categories.map((x) => [x.id, x])),
      dp: Number(F.shop.currency_decimals) === 0 ? 0 : 2, sugar: F.shop.sugar_levels || [], ice: F.shop.ice_levels || [] });
    // THE client price rule (the server repeats it at checkout and its answer wins):
    // unit = base + size change + Σ add-on prices · total = unit × qty — plus every reason a line can't be ordered
    function priceLine(ix, l) {
      const p = ix.p.get(l.product_id), out = { ok: false, why: '', p, unit: 0, total: 0, addons: [], sz: null };
      if (!p) return { ...out, why: 'No longer on the menu' };
      if (!p.is_available) out.why = 'Sold out';
      const sz = p.sizes.length ? p.sizes.find((z) => z.name === l.size) : null;
      if (p.sizes.length && !sz && !out.why) out.why = 'Pick a size';
      if (p.has_sugar && ix.sugar.indexOf(l.sugar) === -1 && !out.why) out.why = 'Pick a sugar level';
      if (p.has_ice && ix.ice.indexOf(l.ice) === -1 && !out.why) out.why = 'Pick an ice level';
      const ids = l.addon_ids || [], ads = ids.map((id) => ix.a.get(id));
      if (ids.length > p.max_addons && !out.why) out.why = 'Too many add-ons';
      ads.forEach((a, i) => { if (out.why) return; if (!a || p.addon_ids.indexOf(ids[i]) === -1) out.why = 'An add-on is no longer offered'; else if (!a.is_available) out.why = a.name + ' is sold out'; });
      const unit = roundTo(p.base_price + (sz ? sz.price_delta : 0) + ads.reduce((s, a) => s + (a ? a.price : 0), 0), ix.dp);
      return { ...out, ok: !out.why, sz, addons: ads.filter(Boolean), unit, total: roundTo(unit * l.qty, ix.dp) };
    }
    const lineSummary = (l, pr) => [pr.sz && pr.sz.name, l.sugar, l.ice].filter(Boolean).concat(pr.addons.map((a) => '+ ' + a.name)).join(' · ');
    function useCart() {
      const [cart, setCart] = useState(readCart);
      const save = (fn) => setCart((c) => { const n = fn(c); ls.set(CART_KEY, n.length ? JSON.stringify(n) : null); return n; });
      // same build -> qty adds up (capped); a new build -> a new line
      const add = (l) => save((c) => { const k = lineKey(l), hit = c.find((x) => lineKey(x) === k);
        return hit ? c.map((x) => (x === hit ? { ...x, qty: Math.min(QTY_MAX, x.qty + l.qty) } : x)) : c.concat({ ...l, id: Date.now() + '' + Math.random().toString(36).slice(2, 6) }).slice(-CART_MAX_LINES); });
      // edit a line: if the new build matches another line, the two merge
      const replace = (id, l) => save((c) => { const rest = c.filter((x) => x.id !== id), k = lineKey(l), hit = rest.find((x) => lineKey(x) === k);
        return hit ? rest.map((x) => (x === hit ? { ...x, qty: Math.min(QTY_MAX, x.qty + l.qty) } : x)) : c.map((x) => (x.id === id ? { ...l, id } : x)); });
      const setQty = (id, q) => save((c) => c.map((x) => (x.id === id ? { ...x, qty: Math.max(1, Math.min(QTY_MAX, q)) } : x)));
      const remove = (id) => save((c) => c.filter((x) => x.id !== id));
      const clear = () => save(() => []);
      return { cart, add, replace, setQty, remove, clear, count: cart.reduce((n, l) => n + l.qty, 0) };
    }
    // priced view of the cart: lines + subtotal + what blocks checkout
    const priceCart = (ix, cart) => { const lines = cart.map((l) => ({ l, pr: priceLine(ix, l) })), dp = ix.dp;
      return { lines, subtotal: roundTo(lines.reduce((s, x) => s + (x.pr.ok ? x.pr.total : 0), 0), dp), bad: lines.filter((x) => !x.pr.ok).length }; };
    const toastAdded = (t) => Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: t, timer: 1500, showConfirmButton: false });

    // ============== Customize — photo + name on the left, choices on the right (bottom sheet on phones) ==============
    function Customize({ F, ix, p, line, money, onClose, onDone }) {
      const cat = ix.c.get(p.category_id) || {};
      const [c, setC] = useState(() => (line ? { size: line.size || '', sugar: line.sugar || '', ice: line.ice || '', addon_ids: (line.addon_ids || []).slice(), note: line.note || '', qty: line.qty }
        : { size: p.sizes.length ? p.sizes[0].name : '', sugar: p.has_sugar ? ix.sugar[0] : '', ice: p.has_ice ? ix.ice[0] : '', addon_ids: [], note: '', qty: 1 }));
      const ref = useRef(null);
      const pr = priceLine(ix, { product_id: p.id, ...c });
      const full = c.addon_ids.length >= p.max_addons;
      const offered = p.addon_ids.map((id) => ix.a.get(id)).filter(Boolean);
      const put = (k, v) => setC((o) => ({ ...o, [k]: v }));
      const toggleAddon = (id) => setC((o) => ({ ...o, addon_ids: o.addon_ids.includes(id) ? o.addon_ids.filter((x) => x !== id) : o.addon_ids.length >= p.max_addons ? o.addon_ids : o.addon_ids.concat(id) }));
      // keyboard: Esc closes, Tab stays inside the sheet
      useEffect(() => { const el = ref.current; el && el.querySelector('.cz-x').focus();
        const k = (e) => { if (e.key === 'Escape') return onClose();
          if (e.key !== 'Tab' || !el) return;
          const f = [...el.querySelectorAll('button:not([disabled]), input:not([disabled]), textarea')], a = f[0], z = f[f.length - 1];
          if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } };
        document.addEventListener('keydown', k); document.body.classList.add('no-scroll');
        return () => { document.removeEventListener('keydown', k); document.body.classList.remove('no-scroll'); }; }, []);
      const group = (title, icon, tag, body) => <fieldset className="cz-sec"><legend><i className={'fas ' + icon}></i> {title}{tag && <small>{tag}</small>}</legend>{body}</fieldset>;
      const radios = (name, list, val, extra) => (
        <div className="cz-opts" role="radiogroup" aria-label={name}>{list.map((o) => { const v = typeof o === 'string' ? o : o.name;
          return <label key={v} className={'cz-opt' + (val === v ? ' on' : '')}><input type="radio" name={name} checked={val === v} onChange={() => put(name, v)} /><span>{v}</span>{extra && extra(o)}</label>; })}</div>
      );
      return (
        <div className="cz-ov" onClick={onClose}>
          <div className="cz" ref={ref} role="dialog" aria-modal="true" aria-label={'Customize ' + p.name} onClick={(e) => e.stopPropagation()}>
            <div className="cz-media">
              <div className="cz-img">{p.image_url ? <img src={p.image_url} alt="" /> : <i className={'fas ' + (cat.icon || 'fa-mug-hot')}></i>}</div>
              <div className="cz-cap"><h3>{p.name}</h3>{p.description && <p>{p.description}</p>}</div>
            </div>
            <div className="cz-main">
              <header className="cz-top">
                <b className="cz-price">{money(pr.unit || p.base_price)}</b>
                <button type="button" className="cz-x" onClick={onClose} aria-label="Close"><i className="fas fa-xmark"></i></button>
              </header>
              <div className="cz-scroll">
                {p.sizes.length > 0 && group('Size', 'fa-up-right-and-down-left-from-center', 'Required', radios('size', p.sizes, c.size, (z) => <em>{z.price_delta ? '+' + money(z.price_delta) : ''}</em>))}
                {p.has_sugar ? group('Sugar', 'fa-cubes-stacked', 'Required', radios('sugar', ix.sugar, c.sugar)) : null}
                {p.has_ice ? group('Ice', 'fa-snowflake', 'Required', radios('ice', ix.ice, c.ice)) : null}
                {p.max_addons > 0 && offered.length > 0 && group('Add-ons', 'fa-circle-plus', 'Optional · up to ' + p.max_addons,
                  <div className="cz-adds">
                    <span className="cz-count" aria-live="polite">{c.addon_ids.length} of {p.max_addons} chosen</span>
                    {offered.map((a) => { const on = c.addon_ids.includes(a.id), off = !a.is_available || (!on && full);
                      return <label key={a.id} className={'cz-add' + (on ? ' on' : '') + (off ? ' off' : '')}>
                        <input type="checkbox" checked={on} disabled={off} onChange={() => toggleAddon(a.id)} />
                        <span>{a.name}{!a.is_available && <em className="cz-so">Sold out</em>}</span><b>+{money(a.price)}</b></label>; })}
                  </div>)}
                {group('Note', 'fa-note-sticky', 'Optional', <div className="cz-note"><textarea rows="2" maxLength={100} value={c.note} onChange={(e) => put('note', e.target.value)} placeholder="Anything we should know?" aria-label="Note for this drink"></textarea><small aria-live="polite">{c.note.length}/100</small></div>)}
              </div>
              <div className="cz-foot">
                <div className="cz-qty" role="group" aria-label="Quantity">
                  <button type="button" onClick={() => put('qty', Math.max(1, c.qty - 1))} disabled={c.qty <= 1} aria-label="One less"><i className="fas fa-minus"></i></button>
                  <b aria-live="polite">{c.qty}</b>
                  <button type="button" onClick={() => put('qty', Math.min(QTY_MAX, c.qty + 1))} disabled={c.qty >= QTY_MAX} aria-label="One more"><i className="fas fa-plus"></i></button>
                </div>
                <button type="button" className="cz-go" disabled={!pr.ok} title={pr.why} onClick={() => onDone({ product_id: p.id, ...c, note: c.note.trim() })}>
                  {pr.ok ? <><b>{money(pr.total)}</b><span className="cz-sep"></span>{line ? 'Update cart' : 'Add to cart'} <i className="fas fa-arrow-right"></i></> : pr.why}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============== Cart panel — right drawer on desktop, bottom sheet on phones ==============
    function CartPanel({ F, ix, cartApi, money, onClose, onEdit, onCheckout, onBrowse }) {
      const { lines, subtotal, bad } = useMemo(() => priceCart(ix, cartApi.cart), [ix, cartApi.cart]);
      const min = Number(F.shop.min_order_amount) || 0, short = min > 0 && subtotal < min;
      const block = !lines.length ? 'Your cart is empty' : bad ? 'Remove the items that are no longer available' : short ? 'Minimum order is ' + money(min) : !F.open.open ? openLine(F.open) : '';
      useEffect(() => { const k = (e) => e.key === 'Escape' && onClose(); document.addEventListener('keydown', k); document.body.classList.add('no-scroll');
        return () => { document.removeEventListener('keydown', k); document.body.classList.remove('no-scroll'); }; }, []);
      return (
        <div className="cart-ov" onClick={onClose}>
          <aside className="cart" role="dialog" aria-modal="true" aria-label="Your cart" onClick={(e) => e.stopPropagation()}>
            <header className="cart-h"><b><i className="fas fa-bag-shopping"></i> Your Cart {cartApi.count > 0 && <small>{cartApi.count} item{cartApi.count === 1 ? '' : 's'}</small>}</b>
              <button type="button" className="close-btn" onClick={onClose} aria-label="Close cart"><i className="fas fa-xmark"></i></button></header>
            <div className="cart-b">
              {!lines.length ? (
                <div className="cart-empty"><span className="cart-empty-ic"><i className="fas fa-bag-shopping"></i></span><b>Your cart is empty</b>
                  <small>Looks like you haven't added a drink yet.</small>
                  <button type="button" className="cart-browse" onClick={onBrowse}><i className="fas fa-mug-hot"></i> Browse drinks</button></div>
              ) : lines.map(({ l, pr }) => (
                <div key={l.id} className={'cart-line' + (pr.ok ? '' : ' bad')}>
                  <span className="cart-th">{pr.p && pr.p.image_url ? <img src={pr.p.image_url} alt="" loading="lazy" /> : <i className="fas fa-mug-hot"></i>}</span>
                  <div className="cart-t"><b>{pr.p ? pr.p.name : 'Removed drink'}</b>
                    <small>{pr.p ? lineSummary(l, pr) : ''}</small>
                    {l.note && <small className="cart-note"><i className="fas fa-note-sticky"></i> {l.note}</small>}
                    {!pr.ok && <small className="cart-why"><i className="fas fa-circle-exclamation"></i> {pr.why === 'Sold out' || !pr.p ? 'No longer available — ' + (pr.p ? 'sold out' : 'removed from the menu') : pr.why}</small>}</div>
                  <div className="cart-r">
                    <span className="cart-amt">{pr.ok ? money(pr.total) : '—'}</span>
                    <div className="cz-qty sm" role="group" aria-label="Quantity">
                      <button type="button" onClick={() => cartApi.setQty(l.id, l.qty - 1)} disabled={l.qty <= 1} aria-label="One less"><i className="fas fa-minus"></i></button>
                      <b>{l.qty}</b>
                      <button type="button" onClick={() => cartApi.setQty(l.id, l.qty + 1)} disabled={l.qty >= QTY_MAX} aria-label="One more"><i className="fas fa-plus"></i></button>
                    </div>
                    <div className="cart-acts">
                      {pr.p && pr.p.is_available ? <button type="button" className="act" onClick={() => onEdit(l)} title="Edit" aria-label="Edit"><i className="fas fa-pen"></i></button> : null}
                      <button type="button" className="act act-del" onClick={() => cartApi.remove(l.id)} title="Remove" aria-label="Remove"><i className="fas fa-trash"></i></button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
            {lines.length > 0 && (
              <footer className="cart-f">
                <div className="cart-sum"><span>Subtotal</span><b>{money(subtotal)}</b></div>
                {short && <div className="cart-min"><i className="fas fa-circle-info"></i> Add {money(min - subtotal)} more — the minimum order is {money(min)}.</div>}
                <button type="button" className="btn btn-primary cart-go" disabled={!!block} onClick={onCheckout}><i className="fas fa-lock"></i> {block || 'Checkout · ' + money(subtotal)}</button>
                <button type="button" className="tb-tbtn ghost" onClick={onClose}><i className="fas fa-arrow-left"></i> Keep ordering</button>
              </footer>
            )}
          </aside>
        </div>
      );
    }

    // ============== Landing: hero · category strip (sticky pill bar once scrolled past) · search · popular · a banner + grid per category ==============
    const catPhoto = (F, c) => { const p = F.products.find((x) => x.category_id === c.id && x.image_url); return p ? p.image_url : ''; };
    function StoreLanding({ F, ix, money, go, onPick, cartN, bump, onCart }) {
      const [q, setQ] = useState('');
      const [act, setAct] = useState(F.categories.length ? F.categories[0].id : 0);
      const [bar, setBar] = useState(false), [edge, setEdge] = useState({ l: false, r: false }), [hint, setHint] = useState(0);
      const stripRef = useRef(null), rowRef = useRef(null), pillsRef = useRef(null);
      const term = useDeferredValue(q).trim().toLowerCase();
      const groups = useMemo(() => F.categories.map((c) => [c, F.products.filter((p) => p.category_id === c.id && (!term || (p.name + ' ' + p.description).toLowerCase().includes(term)))]).filter(([, l]) => l.length), [F, term]);
      const cats = useMemo(() => F.categories.filter((c) => F.products.some((p) => p.category_id === c.id)), [F]);
      const popular = useMemo(() => F.products.filter((p) => p.is_featured), [F]);
      const names = useMemo(() => F.products.filter((p) => p.is_available).map((p) => p.name), [F]);
      // scroll-spy: the section at the top of the viewport lights its category up
      useEffect(() => {
        if (!('IntersectionObserver' in window)) return;
        const io = new IntersectionObserver((es) => { const v = es.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
          v && setAct(Number(v.target.dataset.cat)); }, { rootMargin: '-90px 0px -60% 0px' });
        document.querySelectorAll('.sf-cat').forEach((el) => io.observe(el));
        return () => io.disconnect(); }, [groups]);
      // the pill bar slides in once the photo strip has scrolled out of view
      useEffect(() => { const el = stripRef.current; if (!el || !('IntersectionObserver' in window)) return;
        const io = new IntersectionObserver(([e]) => setBar(!e.isIntersecting && e.boundingClientRect.top < 0)); io.observe(el); return () => io.disconnect(); }, []);
      useEffect(() => { const b = pillsRef.current && pillsRef.current.querySelector('.on'); if (b && bar) pillsRef.current.scrollTo({ left: b.offsetLeft - pillsRef.current.clientWidth / 2 + b.offsetWidth / 2, behavior: 'smooth' }); }, [act, bar]);
      // strip arrows only when the row overflows
      const edges = () => { const el = rowRef.current; el && setEdge({ l: el.scrollLeft > 4, r: el.scrollLeft + el.clientWidth < el.scrollWidth - 4 }); };
      useEffect(() => { edges(); window.addEventListener('resize', edges); return () => window.removeEventListener('resize', edges); }, [cats]);
      // the search box suggests a drink name, one after another
      useEffect(() => { if (names.length < 2 || reduceMotion()) return; const t = setInterval(() => setHint((h) => h + 1), 2600); return () => clearInterval(t); }, [names]);
      const jump = (id) => { setAct(id); const el = document.getElementById('sf-cat-' + id); el && el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      const slide = (d) => rowRef.current && rowRef.current.scrollBy({ left: d * rowRef.current.clientWidth * 0.7, behavior: 'smooth' });
      const card = (p, icon) => <DrinkCard key={p.id} p={p} money={money} catIcon={icon} onOpen={p.is_available ? onPick : null} />;
      return (
        <>
          <div className="sf-wrap"><HeroBanner F={F} onPick={onPick} go={go} /></div>
          <div id="sf-menu" className="sf-menu-area">
          {cats.length > 0 && (
            <nav className="sf-wrap sf-cats" ref={stripRef} aria-label="Categories">
              {edge.l && <button type="button" className="sf-arr sm l" onClick={() => slide(-1)} aria-label="Scroll categories left"><i className="fas fa-chevron-left"></i></button>}
              <div className="sf-cats-row" ref={rowRef} onScroll={edges}>
                {cats.map((c) => { const ph = catPhoto(F, c);
                  return <button key={c.id} type="button" className={'sf-cat-b' + (act === c.id ? ' on' : '')} onClick={() => jump(c.id)} aria-current={act === c.id}>
                    <span className="sf-cat-img">{ph ? <img src={ph} alt="" loading="lazy" /> : <i className={'fas ' + c.icon}></i>}</span><b>{c.name}</b></button>; })}
              </div>
              {edge.r && <button type="button" className="sf-arr sm r" onClick={() => slide(1)} aria-label="Scroll categories right"><i className="fas fa-chevron-right"></i></button>}
            </nav>
          )}
          <div className={'sf-pillbar' + (bar ? ' show' : '')} aria-hidden={!bar}>
            <div className="sf-pillbar-in">
              <nav className="sf-pills" ref={pillsRef} aria-label="Jump to a category">
                {cats.map((c) => <button key={c.id} type="button" tabIndex={bar ? 0 : -1} className={act === c.id ? 'on' : ''} onClick={() => jump(c.id)}>{c.name}</button>)}
              </nav>
              {BUILD_PHASE >= 3 && <CartBtn n={cartN} bump={bump} onCart={onCart} />}
            </div>
          </div>
          <div className="sf-wrap">
            <div className="sf-find" id="sf-find">
              <label className="sf-search">
                <i className="fas fa-magnifying-glass"></i>
                <input id="sf-q" type="search" value={q} onChange={(e) => setQ(e.target.value)} placeholder={'Search for ' + (names.length ? names[hint % names.length] : 'drinks')} aria-label="Search drinks" />
                <button type="button" className="sf-go" onClick={() => (q ? setQ('') : document.getElementById('sf-q').focus())} aria-label={q ? 'Clear search' : 'Search'}>
                  <i className={'fas fa-' + (q ? 'xmark' : 'arrow-right')}></i></button>
              </label>
            </div>
            {!F.open.open && <div className="sf-closed"><i className="fas fa-circle-info"></i> {openLine(F.open)} — you can still build your order now.</div>}
            {!F.products.length ? (
              <div className="sf-empty"><i className="fas fa-mug-hot"></i><b>Menu coming soon</b><small>Our drinks will appear here.</small></div>
            ) : (
              <>
                {popular.length > 0 && !term && (
                  <section className="sf-pop" aria-label="Popular items">
                    <div className="sf-h2"><h2><i className="fas fa-fire"></i> Popular Items</h2><small>Our customers' favourites</small></div>
                    <div className="sf-pop-grid">{popular.map((p) => <PopCard key={p.id} p={p} money={money} catIcon={(ix.c.get(p.category_id) || {}).icon} onOpen={p.is_available ? onPick : null} />)}</div>
                  </section>
                )}
                {groups.length === 0 && <div className="sf-empty"><i className="fas fa-magnifying-glass"></i><b>No drinks match "{q}"</b><small>Try another word.</small></div>}
                {groups.map(([c, list]) => (
                  <section key={c.id} className="sf-cat" id={'sf-cat-' + c.id} data-cat={c.id} aria-label={c.name}>
                    <CatBanner c={c} list={list} />
                    <div className="dk-grid">{list.map((p) => card(p, c.icon))}</div>
                  </section>
                ))}
              </>
            )}
          </div>
          </div>
        </>
      );
    }
    // category banner: the name in big display type, its tagline as a tilted pill, two of its drinks in circles
    function CatBanner({ c, list }) {
      const ph = list.filter((p) => p.image_url).slice(0, 2);
      return (
        <div className="sf-banner">
          {ph[0] && <span className="sf-banner-ph l"><img src={ph[0].image_url} alt="" loading="lazy" /></span>}
          <div className="sf-banner-t"><h2 className="sf-display">{c.name}</h2><span className="sf-banner-tag">{c.tagline || list.length + ' drink' + (list.length === 1 ? '' : 's') + ' · made to order'}</span></div>
          {ph[1] && <span className="sf-banner-ph r"><img src={ph[1].image_url} alt="" loading="lazy" /></span>}
        </div>
      );
    }
    // popular card: the photo first, a round + on it, name and a price chip underneath
    function PopCard({ p, money, catIcon, onOpen }) {
      const off = !p.is_available;
      return (
        <article className={'pop-card' + (off ? ' off' : '')}>
          <button type="button" className="pop-hit" onClick={() => onOpen && onOpen(p)} disabled={!onOpen} aria-label={p.name + (off ? ', sold out' : '')}>
            <span className="pop-img">{p.image_url ? <img src={p.image_url} alt="" loading="lazy" /> : <i className={'fas ' + (catIcon || 'fa-mug-hot')}></i>}
              {off ? <em className="dk-tag out"><i className="fas fa-ban"></i> Sold out</em> : onOpen ? <span className="pop-add"><i className="fas fa-plus"></i></span> : null}</span>
            <b className="pop-name">{p.name}</b>
            <span className="pop-price">{p.sizes && p.sizes.length ? 'from ' : ''}{money(p.from_price)}</span>
          </button>
        </article>
      );
    }
    // floating: search (jumps to the box) · back to top (after a scroll)
    function StoreFabs() {
      const [up, setUp] = useState(false);
      useEffect(() => { const f = () => setUp(window.scrollY > 700); f(); window.addEventListener('scroll', f, { passive: true }); return () => window.removeEventListener('scroll', f); }, []);
      const find = () => { const el = document.getElementById('sf-find'); el && el.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => { const i = document.getElementById('sf-q'); i && i.focus({ preventScroll: true }); }, 450); };
      return (
        <>
          <button type="button" className="sf-fab l" onClick={find} title="Search drinks" aria-label="Search drinks"><i className="fas fa-magnifying-glass"></i></button>
          <button type="button" className={'sf-fab r' + (up ? ' show' : '')} onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} title="Back to top" aria-label="Back to top" tabIndex={up ? 0 : -1}><i className="fas fa-chevron-up"></i></button>
        </>
      );
    }

    // phones: a sticky bar while the cart has something in it
    const CartBar = ({ n, total, money, onOpen }) => (n > 0 ? (
      <button type="button" className="cart-bar" onClick={onOpen}><span><i className="fas fa-bag-shopping"></i> {n} item{n === 1 ? '' : 's'} · {money(total)}</span><b>View cart <i className="fas fa-chevron-up"></i></b></button>
    ) : null);

    // ============== Store shell — view state, deep links, cart, the page body ==============
    const FRONT_FETCH = () => gsRun('getStorefront');
    function StoreApp({ sess, onLogin, onLogout, onProfile, onAdmin, themeMode, onThemeToggle }) {
      const { F, error, mutate } = useFront();
      const cartApi = useCart();
      const ix = useMemo(() => (F ? menuIx(F) : null), [F]);
      const money = useMemo(() => moneyOf(F && F.shop), [F]);
      const [view, setView] = useState(() => (window.__RESET_TOKEN__ ? 'login' : window.__TRACK_TOKEN__ ? 'track' : 'home'));
      const [authMode, setAuthMode] = useState('login');
      const [pick, setPick] = useState(null);                            // { p, line } = the Customize sheet
      const [cartOpen, setCartOpen] = useState(false);
      const [bump, setBump] = useState(0);
      const [track, setTrack] = useState(() => window.__TRACK_TOKEN__ || '');   // the tracking page opens on this token (?track= deep link)
      const back = useRef('home');                                       // where sign-in returns to
      const go = (k) => {
        setCartOpen(false);
        if (k === 'menu' || k === 'about') { setView('home'); scrollToId('sf-' + k); return; }
        if (k === 'login' || k === 'signup') { if (view !== 'login') back.current = view; setAuthMode(k); }
        setView(k === 'signup' ? 'login' : k); window.scrollTo(0, 0);
      };
      useEffect(() => { if (F && window.__START_PAGE__ === 'menu') { window.__START_PAGE__ = ''; scrollToId('sf-menu'); } }, [!!F]);
      // a signed-out customer can't sit on a signed-in page
      useEffect(() => { if (!sess && (view === 'profile' || view === 'orders')) setView('home'); }, [sess, view]);
      const openTrack = (t) => { setTrack(t); go('track'); };
      const login = (r) => { onLogin(r); setView(back.current === 'login' ? 'home' : back.current); window.scrollTo(0, 0); };
      // opening the cart re-checks prices / sold-out against a fresh menu (30 s dedupe)
      const openCart = () => { swrRevalidate('store:front', FRONT_FETCH, 30000); setCartOpen(true); };
      const done = (l) => { const edit = pick && pick.line; setPick(null);
        edit ? cartApi.replace(edit.id, l) : cartApi.add(l); setBump((b) => b + 1); toastAdded(edit ? 'Cart updated' : 'Added to cart'); };
      const editLine = (l) => { const p = ix && ix.p.get(l.product_id); if (p) { setCartOpen(false); setPick({ p, line: l }); } };
      const sub = useMemo(() => (ix ? priceCart(ix, cartApi.cart).subtotal : 0), [ix, cartApi.cart]);

      let body;
      if (!F) body = error ? <div className="sf-sec"><LoadError onRetry={() => mutate()} /></div> : <StoreSkeleton />;
      else if (view === 'login') body = <LoginPage key={authMode} mode={authMode} onLogin={login} onBack={() => go(back.current === 'login' ? 'home' : back.current)} shop={F.shop} />;
      else if (view === 'profile' && sess) body = <CustomerProfile sess={sess} onProfile={onProfile} />;
      else if (view === 'checkout') body = <CheckoutView F={F} ix={ix} cartApi={cartApi} sess={sess} money={money} go={go} onLogin={onLogin} onTrack={openTrack} />;
      else if (view === 'track') body = <TrackView F={F} money={money} token={track} setToken={setTrack} sess={sess} />;
      else if (view === 'orders' && sess) body = <MyOrdersView ix={ix} money={money} cartApi={cartApi} openTrack={openTrack} go={go} />;
      else body = <StoreLanding F={F} ix={ix} money={money} go={go} onPick={(p) => setPick({ p, line: null })} cartN={cartApi.count} bump={bump} onCart={openCart} />;

    const NOTIF_ICONS = [[/login/, 'fa-right-to-bracket'], [/delete/, 'fa-trash'], [/add|create/, 'fa-plus'], [/update|edit/, 'fa-pen']];
    const notifIcon = (act) => { const a = String(act || '').toLowerCase(), h = NOTIF_ICONS.find(([re]) => re.test(a)); return h ? h[1] : 'fa-circle-info'; };
    const fmtShort = (t) => { const d = new Date(t); return isNaN(d.getTime()) ? '' : d.toLocaleString('en-US', { month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' }); };

    function NotificationBell({ currentUser, perms, setActiveMenu }) {
      const canSee = can(perms, 'logs', 'v');
      // same key as Activity Logs — identical payload, so the bell and the page share ONE fetch
      const { data } = useSWR(canSee ? 'logs:all' : null, () => gsRun('getLogs'), { refreshInterval: 60000 });

      const unread = useMemo(() => all.filter((n) => isNew(n, seen)).length, [all, seen, currentUser]);

      const toggle = () => {
        if (!open) {

          if (top > seen) { setSeen(top); ls.set(seenKey, String(top)); }

    // ============== 360 global search — pages + users + logs in one box (SWR-backed) ==============
    function GlobalSearch({ perms, canEditRbac, jump }) {
      const [q, setQ] = useState('');
      const [open, setOpen] = useState(false);
      const [act, setAct] = useState(0);
      const ref = useRef(null), inp = useRef(null);
      const term = useDeferredValue(q).trim().toLowerCase();   // typing stays smooth while the scan lags a frame
      const canU = can(perms, 'users', 'v'), canL = can(perms, 'logs', 'v');

      // fetch sources only once the user types — shares cache with Users/Logs views (dedupe)
      const { data: uRes } = useSWR(term && canU ? 'users:all' : null, () => gsRun('getAllUsers'), { revalidateOnFocus: false, dedupeMs: 30000 });
      const { data: lRes } = useSWR(term && canL ? 'logs:all'  : null, () => gsRun('getLogs'), { revalidateOnFocus: false, dedupeMs: 30000 });
      // "/" opens search from anywhere (not while typing in a field)
      useEffect(() => { const k = (e) => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || '')) && !e.target.isContentEditable) { e.preventDefault(); inp.current && inp.current.focus(); } };
        document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, []);

      useClickAway(ref, () => setOpen(false), open);

      // scan once per settled term, not once per render — logs can be 1000 rows
      const groups = useMemo(() => {
        if (!term) return [];
        const hit = (s) => String(s == null ? '' : s).toLowerCase().includes(term);
        const out = [];
        const pages = Object.keys(PAGE_META)
          .filter((k) => pageVisible(k, perms, canEditRbac) && (hit(PAGE_META[k].label) || hit(k)))
          .map((k) => ({ icon: PAGE_META[k].icon, title: PAGE_META[k].label, sub: 'Open page', page: k, term: '' }));
        if (pages.length) out.push(['Pages', pages]);
        if (canU && uRes && uRes.success) {
          const us = uRes.data.filter((u) => hit(u.Username) || hit(u.FullName) || hit(u.Email) || hit(u.Phone) || hit(u.Role)).slice(0, 8)
            .map((u) => ({ icon: 'fa-user', title: u.FullName || u.Username, sub: u.Email + ' · ' + u.Role, page: 'users', term: u.Username }));
          if (us.length) out.push(['Users', us]);
        }
        if (canL && lRes && lRes.success) {
          const ls = lRes.data.filter((g) => hit(g.Action) || hit(g.User) || hit(g.Details)).slice(0, 8)
            .map((g) => ({ icon: 'fa-clock-rotate-left', title: g.Action, sub: g.User + (g.Details ? ' · ' + g.Details : ''), page: 'logs', term: g.Action }));
          if (ls.length) out.push(['Activity', ls]);
        }
        return out;
      }, [term, uRes, lRes, canU, canL, perms, canEditRbac]);
      const flat = useMemo(() => groups.reduce((a, g) => a.concat(g[1]), []), [groups]);
      useEffect(() => setAct(0), [groups]);
      const pick = (r) => { setOpen(false); setQ(''); jump(r.page, r.term); };
      const onKey = (e) => {
        if (e.key === 'Escape') { setOpen(false); e.target.blur(); return; }
        if (!flat.length) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); setOpen(true); setAct((a) => (a + 1) % flat.length); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setAct((a) => (a - 1 + flat.length) % flat.length); }
        else if (e.key === 'Enter') { e.preventDefault(); pick(flat[act] || flat[0]); }
      };
      let n = -1;
      return (
        <div className="gsearch" ref={ref}>
          <i className="fas fa-magnifying-glass gs-lead"></i>
          <input className="gs-input" ref={inp} value={q} placeholder="Search pages, users…  ( / )" aria-label="Search"
                 onChange={(e) => { setQ(e.target.value); setOpen(true); }} onFocus={() => term && setOpen(true)} onKeyDown={onKey} />
          {q && <button className="gs-x" onClick={() => { setQ(''); setOpen(false); }} title="Clear"><i className="fas fa-xmark"></i></button>}
          {open && term && (
            <div className="gs-menu">
              <div className="gs-scroll">
                {flat.length === 0
                  ? <div className="gs-empty"><i className="fas fa-magnifying-glass"></i>No matches for "{q}"</div>
                  : groups.map(([name, items]) => (
                      <div className="gs-group" key={name}>
                        <div className="gs-group-h">{name}<span>{items.length}</span></div>
                        {items.map((r, i) => { n++; const on = n === act; return (
                          <div className={'gs-item' + (on ? ' on' : '')} key={i} onClick={() => pick(r)} onMouseEnter={((k) => () => setAct(k))(n)}>
                            <i className={'fas ' + r.icon + ' gs-ic'}></i>
                            <div className="gs-txt"><div className="gs-t">{r.title}</div><div className="gs-s">{r.sub}</div></div>
                            <i className="fas fa-arrow-right-long gs-go"></i>
                          </div>); })}
                      </div>
                    ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============== Shared list plumbing (Users + Logs) ==============
    // filter prepared ONCE per change -> Tabulator runs a cheap check per row (dates pre-parsed into _ts)
    const prepFilter = (f, exact, text) => ({ f, text, exact: exact.filter(([k]) => f[k]), dated: !!(f.from || f.to),
      lo: f.from ? Date.parse(f.from + 'T00:00:00') : -Infinity, hi: f.to ? Date.parse(f.to + 'T23:59:59') : Infinity,
      q: (f.search || '').trim().toLowerCase() });
    const rowMatch = (d, p) => p.exact.every(([k, field]) => d[field] === p.f[k])
      && (!p.dated || (d._ts >= p.lo && d._ts <= p.hi))
      && (!p.q || p.text.some((k) => String(d[k] == null ? '' : d[k]).toLowerCase().includes(p.q)));
    const withTs = (list, field) => list.map((r) => ({ ...r, _ts: Date.parse(r[field]) }));

    // build a Tabulator ONCE per shape, feed new rows with replaceData, re-apply the live filter after every build
    function useTabulator(elRef, rows, shape, build, filterArgs, match = rowMatch) {
      const tRef = useRef(null), fRef = useRef(filterArgs);
      fRef.current = filterArgs;
      useEffect(() => {
        if (!rows || !elRef.current) return;
        const cur = tRef.current;
        if (cur && cur._shape === shape) { cur.replaceData(rows); return; }
        if (cur) cur.destroy();                                   // perms changed -> columns differ -> rebuild
        const t = build(rows);
        t._shape = shape;
        t.on('tableBuilt', () => { t._built = true; t.setFilter(match, fRef.current); });
        tRef.current = t;
      }, [rows, shape]);
      useEffect(() => { const t = tRef.current; if (t && t._built) t.setFilter(match, filterArgs); }, [filterArgs]);
      useEffect(() => () => { if (tRef.current) { try { tRef.current.destroy(); } catch (e) {} tRef.current = null; } }, []);
      return tRef;
    }

    // live shown/total counter off the table's own render
    const trackCounts = (t, setCounts) => t.on('renderComplete', () => setCounts((c) => {

      return c.shown === n.shown && c.total === n.total ? c : n; }));   // same numbers -> same object -> no re-render

    // date presets shared by every More Filters popover (week starts on Settings week_start, like the dashboard)
    const QUICK_RANGES = [['today', 'Today'], ['week', 'This week'], ['month', 'This month'], ['year', 'This year']];
    const quickRange = (k, s) => { const t = todayYmd();
      if (k === 'week') { const st = { SUNDAY: 0, MONDAY: 1, SATURDAY: 6 }[(s && s.week_start) || 'SUNDAY'] || 0; return { from: addDaysYmd(t, -((new Date(t + 'T12:00:00Z').getUTCDay() - st + 7) % 7)), to: t }; }
      return { from: k === 'month' ? t.slice(0, 8) + '01' : k === 'year' ? t.slice(0, 5) + '01-01' : t, to: t }; };
    const rangeTxt = (r) => dmy(r.from) + (r.to !== r.from ? ' – ' + dmy(r.to) : '');

    // shared list toolbar: search + picker selects + date popover | column menu + reset
    // range = {from, to, def, set, note}: the popover dates ARE the server window (registers) instead of a filter over loaded rows
    function TableToolbar({ filters, setF, onReset, searchPh, selects, dateLabel, cols, tableRef, noDates, range }) {

      const cur = range || filters;
      const put = (o) => (range ? range.set({ from: o.from != null ? o.from || range.def.from : range.from, to: o.to != null ? o.to || range.def.to : range.to }) : Object.keys(o).forEach((k) => setF(k, o[k])));
      const extra = range ? +(range.from !== range.def.from || range.to !== range.def.to) : (filters.from ? 1 : 0) + (filters.to ? 1 : 0);
      const quickOn = (k) => { const q = quickRange(k, s); return cur.from === q.from && cur.to === q.to; };
      const colShown = (f) => { try { return tableRef.current ? tableRef.current.getColumn(f).isVisible() : true; } catch (e) { return true; } };
      const toggleCol = (f) => { const c = tableRef.current && tableRef.current.getColumn(f); if (!c) return; c.isVisible() ? c.hide() : c.show(); tick((n) => n + 1); };

                <label>From<input type="date" value={cur.from} max={cur.to || undefined} onChange={(e) => put({ from: e.target.value })} /></label>
                <label>To<input type="date" value={cur.to} min={cur.from || undefined} max={todayYmd()} onChange={(e) => put({ to: e.target.value })} /></label>
                {range && range.note && <p className="tb-pop-note"><i className="fas fa-circle-info"></i> {range.note}</p>}
                <button className="tb-tbtn ghost" onClick={() => (range ? range.set(range.def) : put({ from: '', to: '' }))}>
                  <i className="fas fa-eraser"></i> {range ? 'Back to ' + (range.defLabel || 'the default') : 'Clear dates'}
                </button>
              </div>
            </div>}
          </div>
          <div className="tb-tools">
            <div className={'tb-pop' + (pop === 'cols' ? ' open' : '')} ref={colsRef}>
              <button className="tb-tbtn" onClick={() => flip('cols')}><i className="fas fa-table-columns"></i> Columns</button>
              <div className="tb-pop-menu">
                {cols.map(([f, label]) => (
                  <label key={f} className="tb-chk">
                    <input type="checkbox" checked={colShown(f)} onChange={() => toggleCol(f)} /> {label}
                  </label>
                ))}
              </div>
            </div>
            <button className="tb-tbtn" onClick={() => { onReset(); setPop(''); }}><i className="fas fa-rotate-right"></i> Reset</button>
          </div>
        </div>
      );
    }

    // filter state + deferred prepared args for a list view
    function useListFilters(blank, initialSearch, exact, text) {
      const [filters, setFilters] = useState(blank);
      const setF = useCallback((k, v) => setFilters((f) => ({ ...f, [k]: v })), []);
      useEffect(() => { if (initialSearch) setF('search', initialSearch); }, [initialSearch]);   // seeded by the 360 search
      const df = useDeferredValue(filters);                        // typing stays smooth, the table catches up
      const args = useMemo(() => prepFilter(df, exact, text), [df]);
      return { filters, setF, reset: () => setFilters(blank), args };
    }

    // ============== List kit: chips · chevron pipeline · form sections · demo fill · drawer · master page ==============
    // [label chip] left, value pinned right — every value goes through esc() before it lands here
    const cChip = (cls, icon, label) => '<span class="chip ' + cls + '"><i class="fas ' + icon + '"></i>' + label + '</span>';
    const cRow = (chipHtml, value, valCls) => '<div class="chip-row">' + chipHtml + '<span class="val ' + (valCls || '') + '">' + value + '</span></div>';
    const cStack = (rows) => '<div class="cell-stack">' + rows.filter(Boolean).join('') + '</div>';
    const C_DASH = '<span class="val-muted">&mdash;</span>';
    const orDash = (v) => (v === '' || v == null ? C_DASH : esc(v));

    // chevron pipeline — status / type tabs with live counts; tones come from theme tokens
    const PIPE_TONES = ['var(--navy-primary)', 'var(--navy-light)', 'var(--navy-accent)', 'var(--success)', 'var(--warning)', 'var(--danger)', 'var(--c-secondary)'];
    function Pipeline({ stages, value, onPick }) {
      return (

    // ---- demo fill (testing): set #n per form, +1 each click, remembered across reloads ----
    const demoSeq = (key) => { const k = 'rsDemoSeq_' + key, n = (parseInt(ls.get(k, '0'), 10) || 0) + 1; ls.set(k, String(n)); return n; };
    function demoValue(name, n, entity) {
      name = String(name || '').toLowerCase();
      if (/email/.test(name)) return 'demo' + n + '@demo.com';
      if (/mobile|phone/.test(name)) return (/alt/.test(name) ? '8' + (200000000 + n) : '9' + (100000000 + n));
      if (/pincode/.test(name)) return String(100000 + (n % 900));
      if (/address/.test(name)) return 'House ' + n + ', Street ' + ((n % 9) + 1);
      if (/city/.test(name)) return 'Demo City';
      if (/contact|person/.test(name)) return 'Contact ' + n;
      if (/notes|description|remark/.test(name)) return 'Demo ' + (entity || '').toLowerCase() + ' ' + n + ' — sample text for testing.';
      if (/^name$/.test(name)) return (entity || 'Demo') + ' ' + n;
      return '';
    }
    // keeps the form's keys; every value becomes set #n, overrides win per field
    const seedForm = (form, key, entity, overrides = {}) => {
      const n = demoSeq(key);

    // ---- form building blocks ----

    // drop zone around the real file input — drag a file on it or use the button; onPick(File)
    let dropGuard = false;                                            // a missed drop never opens the file over the app
    function FileDrop({ accept, onPick, disabled, title, hint, icon, autoFocus, compact }) {
      const [over, setOver] = useState(false);
      useEffect(() => { if (dropGuard) return; dropGuard = true; ['dragover', 'drop'].forEach((t) => window.addEventListener(t, (e) => e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files') && e.preventDefault())); }, []);
      const drag = (on) => (e) => { e.preventDefault(); !disabled && setOver(on); };
      return (
        <div className={'fdrop' + (over ? ' over' : '') + (compact ? ' compact' : '') + (disabled ? ' off' : '')} onDragEnter={drag(true)} onDragOver={drag(true)}
          onDragLeave={(e) => !e.currentTarget.contains(e.relatedTarget) && setOver(false)}
          onDrop={(e) => { e.preventDefault(); setOver(false); const fl = !disabled && e.dataTransfer.files[0]; fl && onPick(fl); }}>
          <span className="fdrop-ic"><i className={'fas ' + (over ? 'fa-arrow-down' : icon || 'fa-cloud-arrow-up')}></i></span>
          <div className="fdrop-t"><b>{over ? 'Release to add the file' : title || 'Drag & drop a file here'}</b>{hint && <small>{hint}</small>}</div>
          <span className="fdrop-or">or</span>
          <input type="file" className="file-input" accept={accept} disabled={disabled} autoFocus={autoFocus} onChange={(e) => { const fl = e.target.files[0]; e.target.value = ''; fl && onPick(fl); }} />
        </div>
      );
    }
    // the picked file as a card: icon or thumb, name, size line, remove
    const FileCard = ({ icon, thumb, name, meta, onRemove, disabled, busy }) => (
      <div className="fcard">
        {thumb ? <img src={thumb} alt="" className="fcard-thumb" /> : <span className="fcard-ic"><i className={'fas ' + (busy ? 'fa-spinner fa-spin' : icon || 'fa-file')}></i></span>}
        <div className="fcard-t"><b title={name}>{name}</b>{meta && <small>{meta}</small>}</div>
        {onRemove && <button type="button" className="fcard-x" onClick={onRemove} disabled={disabled} title="Remove file" aria-label="Remove file"><i className="fas fa-xmark"></i></button>}
      </div>
    );
    // two-or-three-way choice as buttons (radio semantics)
    const Seg = ({ value, options, onChange }) => (
      <div className="seg" role="radiogroup">
        {options.map(([v, l]) => <button key={v} type="button" role="radio" aria-checked={value === v} className={value === v ? 'on' : ''} onClick={() => onChange(v)}>{l}</button>)}
      </div>
    );

    // add / edit modal shell — demo-fill icon beside close, server error banner, busy save button
    // inline = the same form as a full page section (no overlay, no close ×, Esc does nothing); Cancel still calls onClose
    function FormModal({ icon, title, onClose, onSeed, onSubmit, busy, err, wide, children, altLabel, onAlt, submitLabel, submitIcon, inline, sub, aside, busyLabel }) {
      const sub_ = useRef(); sub_.current = () => !busy && onSubmit();
      useEffect(() => { if (inline) return; const k = (e) => e.key === 'Escape' && !busy && onClose(); document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, [busy, inline]);
      // ctrl/cmd + s saves the open form
      useEffect(() => { const k = (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); sub_.current(); } };
        document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, []);
      const errEl = err && <div className="form-err"><i className="fas fa-circle-exclamation"></i> {err}</div>;
      const acts = (
        <div className="form-actions">
          <button type="submit" className="btn btn-primary" disabled={busy}>
            <i className={'fas ' + (busy ? 'fa-spinner fa-spin' : submitIcon || 'fa-save')}></i> {busy ? busyLabel || 'Saving…' : submitLabel || 'Save'}
          </button>
          {onAlt && <button type="button" className="btn btn-success" disabled={busy} onClick={onAlt}><i className="fas fa-square-plus"></i> {altLabel}</button>}
          <button type="button" className="btn btn-secondary" onClick={onClose} disabled={busy}><i className="fas fa-times"></i> Cancel</button>
          {aside && <small className="kbd-hint"><i className="fas fa-keyboard"></i> <kbd>Ctrl</kbd> + <kbd>S</kbd> saves</small>}
        </div>
      );
      const submit = (e) => { e.preventDefault(); onSubmit(); };
      // aside = entry layout: sections left, sticky side panel (file, summary, error, buttons) right
      const body = inline && aside
        ? <form className="form-page-b entry" onSubmit={submit} noValidate><div className="entry-main">{children}</div><aside className="entry-side">{aside}{errEl}{acts}</aside></form>
        : <form className={inline ? 'form-page-b' : 'modal-body'} onSubmit={submit} noValidate>{errEl}{children}{acts}</form>;
      if (inline) return (
        <div className="data-section form-page">
          <div className="form-page-h">
            <h2><span><i className={'fas ' + icon}></i> {title}</span>{sub && <small>{sub}</small>}</h2>
            {onSeed && <button type="button" className="close-btn demo-seed-btn" title="Fill demo data (testing)" aria-label="Fill demo data" onClick={onSeed}><i className="fas fa-circle-info"></i></button>}
          </div>
          {body}
        </div>
      );
      return (
        <div className="modal-overlay" onClick={() => !busy && onClose()}>
          <div className={'modal' + (wide ? ' modal-lg' : '')} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className={'fas ' + icon}></i> {title}</h3>
              <div className="modal-head-tools">
                {onSeed && <button type="button" className="close-btn demo-seed-btn" title="Fill demo data (testing)" aria-label="Fill demo data" onClick={onSeed}><i className="fas fa-circle-info"></i></button>}

            </div>
            {body}
          </div>
        </div>
      );
    }
    // save plumbing for a FormModal: busy flag + server error kept in the modal (form stays filled)
    const useSaver = (onSave) => {
      const [busy, setBusy] = useState(false), [err, setErr] = useState('');
      const run = (data) => { setBusy(true); setErr('');
        return Promise.resolve(onSave(data)).then((m) => m && setErr(m)).finally(() => setBusy(false)); };
      return { busy, err, setErr, run };
    };

    // csv import window: template -> drop the file -> header check + preview -> ONE import call
    // onImport(recs) resolves '' when done (caller closes + reports) or an error message kept in the window
    function ImportModal({ title, need, cols, onTemplate, onImport, onClose }) {
      const [csv, setCsv] = useState(null);                           // { name, kb, heads, recs }
      const { busy, err, setErr, run } = useSaver((p) => p);
      const pick = (fl) => {
        if (!/\.csv$/i.test(fl.name) && !/csv/i.test(fl.type)) return setErr('Pick a .csv file — ' + fl.name + ' is not one');
        setErr(''); fl.text().then((t) => { const all = parseCSV(t).filter((r) => r.some((c) => String(c).trim()));
          if (all.length < 2) return setErr('This CSV has a header row but no data rows');
          const heads = all[0].map((h) => h.replace(/^\uFEFF/, '').trim());
          setCsv({ name: fl.name, kb: Math.max(1, Math.round(fl.size / 1024)), heads, recs: all.slice(1).map((r) => Object.fromEntries(heads.map((h, i) => [h, (r[i] || '').trim()]))) });
        }).catch(() => setErr('Could not read that file')); };
      const miss = !!csv && !csv.heads.includes(need), extra = csv && cols ? csv.heads.filter((h) => h && !cols.includes(h)) : [];
      const submit = () => { if (!csv) return setErr('Choose the CSV file first');
        if (miss) return setErr('The "' + need + '" column is missing — download the template for the exact headers');
        run(Promise.resolve(onImport(csv.recs)).catch((e) => (e && e.message) || 'Connection error')); };
      return (
        <FormModal icon="fa-file-import" title={title} onClose={onClose} onSubmit={submit} busy={busy} busyLabel="Importing…" err={err} wide submitIcon="fa-file-import"
          submitLabel={csv && !miss ? 'Import ' + num0(csv.recs.length) + ' row' + (csv.recs.length === 1 ? '' : 's') : 'Import'}>
          <ol className="imp-steps">
            <li><b>1</b><span>Download the template</span><button type="button" className="tb-tbtn ghost" onClick={onTemplate}><i className="fas fa-file-arrow-down"></i> Template</button></li>
            <li><b>2</b><span>Fill one row per record — keep the header row as it is</span></li>
            <li><b>3</b><span>Drop the CSV below and check the preview</span></li>
          </ol>
          {csv ? <FileCard icon="fa-file-csv" name={csv.name} meta={num0(csv.recs.length) + ' rows · ' + csv.heads.length + ' columns · ' + num0(csv.kb) + ' KB'} onRemove={() => { setCsv(null); setErr(''); }} disabled={busy} />
            : <FileDrop accept=".csv,text/csv" icon="fa-file-csv" onPick={pick} title="Drag & drop the CSV here" hint="or choose it below · the first row must be the column headers" />}
          {csv && <div className="imp-check">
            <span className={miss ? 'bad' : 'ok'}><i className={'fas ' + (miss ? 'fa-circle-xmark' : 'fa-circle-check')}></i> "{need}" column {miss ? 'missing' : 'found'}</span>
            <span className="ok"><i className="fas fa-list-ol"></i> {num0(csv.recs.length)} data rows</span>
            {extra.length > 0 && <span className="warn"><i className="fas fa-circle-exclamation"></i> Not in the template: {extra.join(', ')}</span>}
          </div>}
          {csv && <div className="about-table-wrapper imp-prev">
            <table className="about-roles-table"><thead><tr><th>#</th>{csv.heads.map((h, i) => <th key={i} className={h === need ? 'need' : ''}>{h}</th>)}</tr></thead>
              <tbody>{csv.recs.slice(0, 5).map((r, i) => <tr key={i}><td>{i + 1}</td>{csv.heads.map((h, j) => <td key={j}>{r[h]}</td>)}</tr>)}</tbody></table>
            {csv.recs.length > 5 && <small className="imp-more"><i className="fas fa-ellipsis"></i> and {num0(csv.recs.length - 5)} more rows</small>}
          </div>}
          <p className="sec-note"><i className="fas fa-circle-info"></i> Rows that fail a check are skipped and listed after the import; the rest are saved.</p>
        </FormModal>
      );
    }

    // quick-look popup — centred, 90% of the screen: record facts on the left (side), tabs on the right; every View / stock-card action opens it
    function Drawer({ icon, title, sub, side, tabs, tab, setTab, onClose, children }) {

      return (
        <div className="drawer-ov" onClick={onClose}>
          <aside className={'drawer' + (side ? ' has-side' : '')} onClick={(e) => e.stopPropagation()} role="dialog" aria-modal="true" aria-label={title}>
            <header className="drawer-h">
              <span className="set-ic"><i className={'fas ' + icon}></i></span>
