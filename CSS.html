    @keyframes sfBump { 50% { transform: scale(1.18); } }
    .sf-avatar span { width: 32px; height: 32px; border-radius: 50%; background: var(--navy-accent); color: var(--c-on-accent); font-size: 13px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center; }
    .sf-open { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: var(--r-pill); font-size: 12px; font-weight: 700;
      background: rgba(255,255,255,.12); color: #fff; white-space: nowrap; }
    .sf-open i { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }
    .sf-open.on i { background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 35%, transparent); }
    .sf-open b { font-weight: 600; opacity: .9; }
    .sf-acct { position: relative; }
    .sf-acct-menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px; background: var(--c-card); color: var(--text-primary); border-radius: var(--r-md);
      box-shadow: 0 12px 30px rgba(0,0,0,.18); padding: 6px; display: none; z-index: 950; }
    .sf-acct.open .sf-acct-menu { display: block; animation: sfIn .15s var(--ease); }
    .sf-acct-h { padding: 10px 12px; border-bottom: 1px solid color-mix(in srgb, var(--text-muted) 20%, transparent); margin-bottom: 4px; }
    .sf-acct-h b { display: block; } .sf-acct-h small { color: var(--text-muted); }
    .sf-acct-menu button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; font: inherit; font-size: 14px; color: inherit; padding: 10px 12px;
      border-radius: var(--r-sm); cursor: pointer; text-align: left; min-height: 40px; }
    .sf-acct-menu button:hover { background: color-mix(in srgb, var(--navy-accent) 10%, transparent); }
    .sf-acct-menu button i { width: 18px; color: var(--navy-accent); }

    /* hero — banner image via --hero (runtime value), tint from the theme */
    .sf-hero { position: relative; padding: 72px 16px 64px; color: #fff; text-align: center;
      background: linear-gradient(135deg, var(--navy-primary) 0%, var(--navy-light) 60%, var(--navy-accent) 130%); }
    .sf-hero.has-img { background-image: linear-gradient(180deg, color-mix(in srgb, var(--navy-primary) 72%, transparent), color-mix(in srgb, var(--navy-primary) 88%, transparent)), var(--hero);
      background-size: cover; background-position: center; }
    .sf-hero-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .sf-hero h1 { font-size: clamp(30px, 5.5vw, 52px); font-weight: 900; line-height: 1.08; letter-spacing: -.5px; }
    .sf-hero p { font-size: clamp(15px, 2.2vw, 19px); opacity: .92; max-width: 620px; }
    .sf-cta { font-size: 16px; padding: 13px 26px; }
    .sf-note { margin-top: 6px; padding: 10px 14px; border-radius: var(--r-md); background: rgba(255,255,255,.14); font-size: 14px; }
    .sf-hero-mini { padding: 34px 16px; border-radius: var(--r-md); }
    .sf-hero-mini h1 { font-size: 26px; } .sf-hero-mini p { font-size: 14px; }

    /* page sections */
    .sf-sec { max-width: 1180px; margin: 0 auto; padding: 40px 16px; scroll-margin-top: 76px; }
    .sf-narrow { max-width: 760px; }
    .sf-h { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; color: var(--navy-primary); margin-bottom: 18px; }
    .sf-h i { color: var(--navy-accent); }
    .sf-card { background: var(--c-card); border-radius: var(--r-md); padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 16px; }
    .sf-card h3 { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; margin-bottom: 12px; color: var(--navy-primary); }
    .sf-card h3 i { color: var(--navy-accent); } .sf-card h3 small { font-weight: 500; font-size: 13px; color: var(--text-muted); }
    .sf-card p { margin-bottom: 12px; line-height: 1.55; }
    .sf-small { font-size: 13px; color: var(--text-muted); margin-top: 10px; }
    .sf-empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 46px 16px; background: var(--c-card); border-radius: var(--r-md); text-align: center; color: var(--text-muted); }

    .sf-foot { background: var(--navy-primary); color: rgba(255,255,255,.85); margin-top: 20px; }

    .sf-foot button:hover { color: #fff; background: rgba(255,255,255,.1); }

    .sf-skel-card { height: 220px; border-radius: var(--r-md); }

    /* sign in inside the storefront */
    .sf-auth { display: flex; justify-content: center; padding: 34px 16px 50px; }
    .sf-auth-card { max-width: 460px; background: var(--c-card); padding: 30px 28px; border-radius: var(--r-md); box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    .sf-auth-card h2 { margin-bottom: 8px; font-size: 26px; font-weight: 800; text-align: center; color: var(--navy-primary); }
    .sf-back { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--navy-accent); font: inherit; font-weight: 600; font-size: 14px;
      cursor: pointer; padding: 8px 0; margin-bottom: 8px; min-height: 40px; }
    .auth-switch { margin-top: 16px; text-align: center; font-size: 14px; color: var(--text-muted); }

    /* settings editors: hours grid + pick-list */
    .hrs-ed { display: flex; flex-direction: column; gap: 6px; }
    .hrs-row { display: grid; grid-template-columns: 110px 1fr 14px 1fr 130px; gap: 8px; align-items: center; }

    .hrs-row input[type=time] { width: 100%; }
    .hrs-closed { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
    .lvl-ed { display: flex; flex-direction: column; gap: 6px; }
    .lvl-row { display: flex; align-items: center; gap: 6px; }
    .lvl-row input { flex: 1; min-width: 0; }
    .lvl-n { width: 28px; height: 28px; flex: 0 0 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; font-weight: 800;
      background: color-mix(in srgb, var(--navy-accent) 12%, transparent); color: var(--navy-accent); }
    .lvl-n.def { background: var(--navy-accent); color: var(--c-on-accent); }
    .hdr-store { color: var(--navy-accent); }

    body.dark-mode .sf-shell { background: #0f1424; color: #e8eaf6; }
    body.dark-mode .sf-card, body.dark-mode .sf-empty, body.dark-mode .sf-auth-card, body.dark-mode .sf-acct-menu { background: #1a2035; color: #e8eaf6; }
    body.dark-mode .sf-h, body.dark-mode .sf-card h3, body.dark-mode .sf-auth-card h2 { color: #e8eaf6; }
    body.dark-mode .sf-empty b { color: #e8eaf6; }

    @media (max-width: 640px) {
      .sf-head-in { gap: 8px; }
      .sf-open { display: none; }
      .sf-ic { width: 40px; height: 40px; }
      .sf-hero { padding: 48px 16px 44px; }
      .hrs-row { grid-template-columns: 1fr 1fr 12px 1fr; } .hrs-row .hrs-closed { grid-column: 1 / -1; }
      .sf-auth-card { padding: 22px 16px; }
    }
    @media (prefers-reduced-motion: reduce) { .sf-main, .sf-acct.open .sf-acct-menu, .sf-cart.bump { animation: none; } }

    /* ===== drink card — ONE component for the storefront menu and the admin grid preview ===== */
    .dk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
    .dk-grid.one { grid-template-columns: minmax(0, 280px); }
    .dk-card { background: var(--c-card); border-radius: var(--r-md); box-shadow: 0 2px 10px rgba(0,0,0,.06); overflow: hidden;
      transition-property: var(--tr-props); transition-duration: var(--t-fast); }
    .dk-card:hover { box-shadow: 0 8px 22px rgba(0,0,0,.12); transform: translateY(-2px); }
    .dk-card.off { opacity: .62; }
    .dk-card.off:hover { transform: none; }
    .dk-hit { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; width: 100%; height: 100%; border: 0; background: none; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
    .dk-hit:disabled { cursor: default; }
    .dk-hit:focus-visible { outline: 2px solid var(--navy-accent); outline-offset: -2px; }
    .dk-img { position: relative; width: 100%; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; overflow: hidden;
      background: linear-gradient(135deg, color-mix(in srgb, var(--navy-accent) 16%, var(--c-card)), color-mix(in srgb, var(--navy-primary) 10%, var(--c-card))); }
    .dk-img img { width: 100%; height: 100%; object-fit: cover; }
    .dk-img > i { font-size: 46px; color: color-mix(in srgb, var(--navy-accent) 70%, transparent); }
    .dk-tag { position: absolute; top: 10px; font-style: normal; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: var(--r-pill); display: inline-flex; gap: 5px; align-items: center; }
    .dk-tag.pop { left: 10px; background: var(--warning); color: #222; }
    .dk-tag.out { right: 10px; background: var(--danger); color: #fff; }
    .dk-body { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 14px; flex: 1; width: 100%; min-width: 0; }
    .dk-name { font-size: 16px; font-weight: 800; color: var(--text-primary); }
    .dk-desc { color: var(--text-muted); font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .dk-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 6px; }
    .dk-price { font-size: 17px; font-weight: 800; color: var(--navy-primary); }
    .dk-price small { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .dk-add { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--navy-accent); color: var(--c-on-accent); }
    .dk-thumb { width: 52px; height: 52px; border-radius: var(--r-sm); object-fit: cover; display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
    .dk-thumb.ph { background: color-mix(in srgb, var(--navy-accent) 12%, transparent); color: var(--navy-accent); font-size: 20px; }
    .dk-sec { margin-bottom: 24px; }
    .dk-sec-h { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; margin-bottom: 12px; color: var(--navy-primary); }
    .dk-sec-h small { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .dk-preview { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .size-ed { display: flex; flex-direction: column; gap: 6px; }
    .size-row { display: grid; grid-template-columns: 1fr 16px 110px 100px 40px; gap: 8px; align-items: center; }
    .size-plus { text-align: center; color: var(--text-muted); font-weight: 800; }
    .size-full { font-weight: 700; color: var(--navy-primary); font-variant-numeric: tabular-nums; }
    .icon-pick { display: flex; align-items: flex-end; gap: 10px; }
    .icon-pick > .form-group { flex: 1; }
    .icon-prev { width: 46px; height: 46px; flex: 0 0 46px; margin-bottom: 18px; border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--navy-accent) 12%, transparent); color: var(--navy-accent); font-size: 20px; }
    .cat-ic { color: var(--navy-accent); margin-right: 4px; }
    .seg button:disabled { opacity: .4; cursor: not-allowed; }
    body.dark-mode .dk-card { background: #1a2035; }
    body.dark-mode .dk-name { color: #e8eaf6; } body.dark-mode .dk-price, body.dark-mode .dk-sec-h, body.dark-mode .size-full { color: #cfe2ff; }
    @media (max-width: 640px) {
      .dk-grid:not(.one) { grid-template-columns: 1fr; gap: 10px; }
      .dk-grid:not(.one) .dk-hit { flex-direction: row-reverse; align-items: stretch; }
      .dk-grid:not(.one) .dk-img { width: 112px; flex: 0 0 112px; aspect-ratio: auto; min-height: 112px; }
      .dk-grid:not(.one) .dk-img > i { font-size: 32px; }
      .dk-grid:not(.one) .dk-tag { top: 6px; font-size: 10px; padding: 3px 6px; }
      .dk-grid:not(.one) .dk-tag.pop { left: 6px; } .dk-grid:not(.one) .dk-tag.out { right: 6px; }
      .size-row { grid-template-columns: 1fr 14px 90px 40px; } .size-row .size-full { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .dk-card, .dk-card:hover { transition: none; transform: none; } }

    /* ===== storefront menu: popular row · sticky tabs · search · customize sheet · cart — new, built from tokens ===== */
    body.no-scroll { overflow: hidden; }
    .sf-pop { padding-bottom: 10px; }
    .sf-menu { padding-top: 20px; }
    .sf-search { position: relative; flex: 0 0 240px; }

    .cz-ov, .cart-ov { position: fixed; inset: 0; z-index: 1200; background: rgba(0,0,0,.45); display: flex; animation: czFade .15s var(--ease); }

    .myo-items { margin: 8px 0; color: var(--text-muted); }

    .a4-foot { width: 100%; border-collapse: collapse; margin-top: 3mm; }
    .a4-foot td { vertical-align: top; padding: 2mm; border: 1px solid #000; } .a4-foot .a4-tot { width: 42%; }
    body.dark-mode .trk-h b, body.dark-mode .myo-h b { color: #cfe2ff; } body.dark-mode .trk-steps span, body.dark-mode .trk-recent button { background: #1a2035; }
    @media (max-width: 480px) { .trk-steps b { font-size: 10px; } .trk-steps span { width: 30px; height: 30px; font-size: 12px; } .trk-steps li::before { top: 14px; } .trk-h b { font-size: 24px; } }

    /* ===================== STOREFRONT SKIN — food-ordering look: dark first, rounded, photo-led (storefront only; the admin keeps its squared tokens) ===================== */
    .sf-shell { --r-sm: 10px; --r-md: 16px; --r-lg: 26px; --r-pill: 999px;
      --sf-line: color-mix(in srgb, var(--text-muted) 22%, transparent); --sf-2: color-mix(in srgb, var(--navy-primary) 6%, var(--c-card)); --sf-head: var(--c-card);
      --sf-deep: color-mix(in srgb, var(--navy-dark) 60%, black); --sf-flame: color-mix(in srgb, var(--warning) 55%, var(--danger));
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .sf-shell input, .sf-shell textarea, .sf-shell button, .sf-shell select { font-family: inherit; }
    body.dark-mode .sf-shell { --c-bg: color-mix(in srgb, var(--navy-dark) 38%, black); --c-card: color-mix(in srgb, var(--navy-dark) 62%, black);
      --sf-2: color-mix(in srgb, var(--navy-light) 40%, black); --sf-head: color-mix(in srgb, var(--navy-dark) 52%, black);
      --text-primary: color-mix(in srgb, white 94%, var(--navy-accent)); --text-muted: color-mix(in srgb, white 60%, transparent); --sf-line: color-mix(in srgb, white 13%, transparent);
      background: var(--c-bg); color: var(--text-primary); }
    body.dark-mode .sf-shell :is(.sf-card, .sf-empty, .sf-auth-card, .sf-acct-menu, .dk-card, .cz, .cart, .cz-foot, .pm-card, .co-choice, .co-meth, .co-steps li, .copy-btn:not(.primary):not(.ok), .trk-steps span, .trk-recent button) { background: var(--c-card); color: var(--text-primary); }
    body.dark-mode .sf-shell :is(.sf-h, .sf-card h3, .sf-auth-card h2, .pay-amt b, .co-no b, .trk-h b, .myo-h b, .dk-price, .dk-name) { color: var(--text-primary); }
    .sf-wrap { max-width: 1360px; margin: 0 auto; padding: 0 clamp(14px, 2.6vw, 40px); }
    .sf-display { font-family: 'Anton', 'Poppins', sans-serif; font-weight: 400; text-transform: uppercase; line-height: .95; letter-spacing: .5px; }

    /* header — status + phone pills · round logo · icon circles */
    .sf-shell .sf-head { position: relative; background: var(--sf-head); color: var(--text-primary); box-shadow: none; border-bottom: 1px solid var(--sf-line); }
    .sf-shell .sf-head-in { max-width: none; height: 76px; padding: 0 clamp(14px, 2.6vw, 40px); display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: 76px; align-items: center; gap: 12px; }
    .sf-hl { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .sf-pill { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px 0 5px; border-radius: var(--r-pill); border: 1px solid var(--sf-line);
      background: var(--sf-2); color: inherit; text-decoration: none; font-weight: 800; font-size: 14px; white-space: nowrap; transition-property: var(--tr-props); transition-duration: var(--t-fast); }
    .sf-pill:hover { border-color: color-mix(in srgb, var(--text-primary) 35%, transparent); }
    .sf-pill-ic { width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--text-primary) 10%, transparent); font-size: 14px; }
    .sf-shell .sf-open { height: 48px; padding: 0 18px 0 16px; gap: 12px; border-radius: var(--r-pill); border: 1px solid var(--sf-line); background: var(--sf-2); color: var(--text-primary); font-size: 13px; }
    .sf-shell .sf-open > i { width: 10px; height: 10px; flex: 0 0 10px; }
    .sf-open-t { display: flex; flex-direction: column; line-height: 1.15; }
    .sf-open-t small { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .7px; opacity: .75; }
    .sf-open-t b { font-size: 13px; font-weight: 700; }
    .sf-logo { justify-self: center; align-self: start; margin-top: 8px; width: 92px; height: 92px; padding: 5px; border: 0; border-radius: 50%; background: var(--sf-head); cursor: pointer; z-index: 5;
      box-shadow: 0 0 0 1px var(--sf-line), 0 12px 28px rgba(0,0,0,.35); transition-property: var(--tr-props); transition-duration: var(--t-fast); }
    .sf-logo:hover { transform: scale(1.04); }
    .sf-logo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: white; display: block; }
    .sf-logo:focus-visible { outline: 2px solid var(--navy-accent); outline-offset: 3px; }
    .sf-shell .sf-tools { justify-self: end; gap: 2px; margin: 0; padding: 3px; border: 1px solid var(--sf-line); border-radius: var(--r-pill); background: var(--sf-2); }
    .sf-shell .sf-ic { width: 40px; height: 40px; border-radius: 50%; background: transparent; border: 0; color: var(--text-primary); font-size: 16px; }
    .sf-shell .sf-ic:hover, .sf-shell .sf-ic.on { background: color-mix(in srgb, var(--navy-accent) 20%, transparent); }
    .sf-shell .sf-ic.on { color: var(--navy-accent); }
    .sf-shell .sf-tools > .sf-acct, .sf-shell .sf-tools > .sf-login { margin-left: 6px; }
    .sf-shell .sf-theme i { color: var(--warning); }
    .sf-shell .sf-login { background: var(--navy-accent); border-color: var(--navy-accent); color: var(--c-on-accent); }
    .sf-shell .sf-login:hover { background: color-mix(in srgb, var(--navy-accent) 85%, white); }
    .sf-shell .sf-acct-menu { border: 1px solid var(--sf-line); }

    /* hero carousel */
    .sf-shell .sf-hero { position: relative; margin: 40px 0 0; padding: 0; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--sf-line); background: var(--sf-deep); text-align: left; color: white; }
    .sf-slide { min-height: clamp(320px, 36vw, 520px); position: relative; display: flex; align-items: center; overflow: hidden; }
    .sf-slide.shop { background: linear-gradient(120deg, var(--navy-dark), var(--navy-light) 62%, var(--navy-accent)); }
    .sf-slide.shop.has-img { background-image: linear-gradient(90deg, color-mix(in srgb, black 80%, transparent) 0%, color-mix(in srgb, black 40%, transparent) 55%, color-mix(in srgb, black 10%, transparent) 100%), var(--hero);
      background-size: cover; background-position: center; }
    .sf-slide-in { position: relative; z-index: 1; width: 100%; padding: clamp(26px, 5vw, 76px); max-width: 700px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
    .sf-slide .sf-display { font-size: clamp(42px, 7.2vw, 108px); color: white; text-shadow: 0 4px 24px rgba(0,0,0,.35); }
    .sf-slide p { font-size: clamp(14px, 1.5vw, 18px); color: color-mix(in srgb, white 86%, transparent); max-width: 470px; line-height: 1.55; }
    .sf-slide .sf-open { background: color-mix(in srgb, black 40%, transparent); border-color: color-mix(in srgb, white 25%, transparent); color: white; }
    .sf-shell .sf-slide .sf-open { display: none; }   /* the header carries it on desktop */
    .sf-slide.has-fan .sf-slide-in { max-width: 58%; }
    .sf-slide.shop.has-img.has-fan { background-image: linear-gradient(90deg, color-mix(in srgb, black 82%, transparent) 0%, color-mix(in srgb, black 55%, transparent) 55%, color-mix(in srgb, black 35%, transparent) 100%), var(--hero); }
    /* banner photo fan — the shop's own drinks */
    .sf-fan { position: absolute; z-index: 1; right: clamp(56px, 7.5vw, 130px); top: 50%; transform: translateY(-50%); width: clamp(300px, 34vw, 480px); height: clamp(240px, 27vw, 380px); }
    .sf-fan-c { --rot: 0deg; position: absolute; bottom: 0; width: 44%; aspect-ratio: 3 / 4; padding: 0; border: 5px solid color-mix(in srgb, white 92%, transparent); border-radius: var(--r-md);
      overflow: hidden; cursor: pointer; background: var(--sf-deep); box-shadow: 0 22px 50px rgba(0,0,0,.45); transform: rotate(var(--rot)); transition-property: var(--tr-props); transition-duration: var(--t-fast); }
    .sf-fan-c img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sf-fan-c span { position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 5px 10px; border-radius: var(--r-pill); background: color-mix(in srgb, black 58%, transparent); color: white;
      font-size: 12px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sf-fan-c:not(.c0) span { display: none; }   /* only the front card is fully visible */
    .sf-fan-c.c0 { left: 25%; width: 50%; bottom: 7%; z-index: 3; }
    .sf-fan-c.c1 { left: 0; z-index: 1; --rot: -8deg; }
    .sf-fan-c.c2 { right: 0; z-index: 2; --rot: 8deg; }
    .sf-fan-c:hover { transform: translateY(-6px) rotate(var(--rot)); }
    .sf-fan-c:focus-visible { outline: 2px solid var(--warning); outline-offset: 3px; }
    .sf-cta { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 28px; margin-top: 4px; border: 0; border-radius: var(--r-pill); background: white; color: var(--navy-dark);
      font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 10px 26px rgba(0,0,0,.3); transition-property: var(--tr-props); transition-duration: var(--t-fast); }
    .sf-cta:hover { transform: translateY(-2px); }
    .sf-cta:focus-visible, .sf-arr:focus-visible { outline: 2px solid var(--warning); outline-offset: 3px; }
    .sf-arr { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 46px; height: 46px; border: 0; border-radius: 50%; cursor: pointer; font-size: 15px;
      background: color-mix(in srgb, white 82%, transparent); color: var(--navy-dark); box-shadow: 0 6px 16px rgba(0,0,0,.25); transition-property: var(--tr-props); transition-duration: var(--t-fast); }
    .sf-arr:hover { background: white; }

    /* category strip (photo tiles) + the pill bar that takes over once it scrolls away */
    .sf-cats { position: relative; display: flex; align-items: center; margin-top: 26px; scroll-margin-top: 20px; }
    .sf-menu-area { scroll-margin-top: 0; padding-top: 1px; }
    .sf-cats-row { flex: 1; display: flex; gap: clamp(6px, 1.6vw, 22px); overflow-x: auto; padding: 6px 2px; scrollbar-width: none; justify-content: safe center; }
    .sf-cats-row::-webkit-scrollbar { display: none; }
    .sf-cat-b { flex: 0 0 auto; width: 136px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 8px; border: 1px solid transparent; border-radius: var(--r-md);
      background: none; color: var(--text-primary); font-size: 14px; cursor: pointer; transition-property: var(--tr-props); transition-duration: var(--t-fast); }
    .sf-cat-b:hover, .sf-cat-b.on { background: var(--sf-2); border-color: var(--sf-line); }
    .sf-cat-b b { font-weight: 600; white-space: nowrap; }
    .sf-cat-img { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--sf-2); }
    .sf-cat-img img { width: 100%; height: 100%; object-fit: cover; }
    .sf-cat-img i { font-size: 30px; color: var(--navy-accent); }
    .sf-arr.sm { position: relative; top: auto; transform: none; flex: 0 0 38px; width: 38px; height: 38px; font-size: 13px; background: var(--sf-2); color: var(--text-primary); border: 1px solid var(--sf-line); box-shadow: none; }
    .sf-arr.sm.l { margin-right: 6px; } .sf-arr.sm.r { margin-left: 6px; }
    .sf-pillbar { position: fixed; top: 0; left: 0; right: 0; z-index: 880; background: var(--sf-head); border-bottom: 1px solid var(--sf-line); box-shadow: 0 8px 22px rgba(0,0,0,.28);
      transform: translateY(-110%); transition: transform .25s var(--ease); }
    .sf-pillbar.show { transform: none; }
    .sf-pillbar-in { max-width: 1360px; margin: 0 auto; padding: 10px clamp(14px, 2.6vw, 40px); display: flex; align-items: center; gap: 12px; }
    .sf-pills { flex: 1; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
    .sf-pills::-webkit-scrollbar { display: none; }
    .sf-pills button { flex: 0 0 auto; height: 42px; padding: 0 20px; border-radius: var(--r-pill); border: 1px solid var(--sf-line); background: var(--sf-2); color: var(--text-primary);
      font-weight: 600; font-size: 13px; white-space: nowrap; cursor: pointer; transition-property: var(--tr-props); transition-duration: var(--t-fast); }
    .sf-pills button.on { border-color: var(--navy-accent); box-shadow: 0 0 0 1px var(--navy-accent); }

    /* search pill */
    .sf-find { display: flex; justify-content: center; margin: 26px 0 6px; scroll-margin-top: 90px; }
    .sf-shell .sf-search { position: relative; flex: 0 1 480px; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 7px 0 22px; border-radius: var(--r-pill);
      border: 1px solid var(--sf-line); background: var(--sf-2); }
    .sf-shell .sf-search:focus-within { border-color: var(--navy-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--navy-accent) 25%, transparent); }
    .sf-shell .sf-search > i { position: static; transform: none; color: var(--text-muted); font-size: 17px; }
    .sf-shell .sf-search .sf-go i { position: static; transform: none; color: inherit; }
    .sf-shell .sf-search input[type=search] { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--text-primary); font-size: 16px; outline: none; box-shadow: none; }
    .sf-shell .sf-search input[type=search]::-webkit-search-cancel-button { display: none; }
    .sf-shell .sf-search input::placeholder { color: var(--text-muted); }
    .sf-go { flex: 0 0 46px; width: 46px; height: 46px; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--text-primary) 12%, transparent); color: var(--text-primary); font-size: 16px; cursor: pointer; }
    .sf-go:hover { background: var(--navy-accent); color: var(--c-on-accent); }
    .sf-shell .sf-closed { margin: 16px 0 0; border: 1px solid color-mix(in srgb, var(--warning) 35%, transparent); background: color-mix(in srgb, var(--warning) 12%, var(--c-card)); }
    .sf-shell .sf-empty { margin-top: 30px; border: 1px solid var(--sf-line); }

    /* section heads · popular grid */
    .sf-h2 { margin: 42px 0 18px; }
    .sf-h2 h2 { display: flex; align-items: center; gap: 10px; font-size: clamp(22px, 2.5vw, 30px); font-weight: 800; color: var(--text-primary); }
    .sf-h2 h2 i { color: var(--sf-flame); }
    .sf-h2 small { display: block; margin-top: 2px; color: var(--text-muted); font-size: 14px; }
    .sf-pop-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .pop-hit { display: flex; flex-direction: column; gap: 10px; width: 100%; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
    .pop-hit:disabled { cursor: default; }
    .pop-hit:focus-visible { outline: 2px solid var(--navy-accent); outline-offset: 4px; border-radius: var(--r-lg); }
    .pop-img { position: relative; width: 100%; aspect-ratio: 1; border-radius: var(--r-lg); overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--sf-2); }
    .pop-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s var(--ease); }
    .pop-hit:hover .pop-img img { transform: scale(1.05); }
    .pop-img > i { font-size: 54px; color: color-mix(in srgb, var(--navy-accent) 70%, transparent); }
    .pop-add { position: absolute; right: 14px; bottom: 14px; width: 50px; height: 50px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      background: var(--sf-deep); color: white; font-size: 18px; box-shadow: 0 6px 16px rgba(0,0,0,.35); transition-property: var(--tr-props); transition-duration: var(--t-fast); }
    .pop-hit:hover .pop-add { background: var(--navy-accent); }
    .pop-name { padding: 0 6px; font-size: clamp(15px, 1.35vw, 20px); font-weight: 800; color: var(--text-primary); }
    .pop-price { align-self: flex-start; margin: 0 6px; padding: 3px 10px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--navy-accent) 22%, var(--c-card)); color: var(--text-primary);
      font-weight: 800; font-size: clamp(13px, 1.15vw, 17px); font-variant-numeric: tabular-nums; }
    .pop-card.off { opacity: .55; }

    /* category banner */
    .sf-cat { scroll-margin-top: 78px; }
    .sf-banner { display: flex; align-items: center; justify-content: center; gap: clamp(8px, 3vw, 44px); margin: 64px 0 30px; min-height: clamp(150px, 20vw, 290px); }
    .sf-banner-t { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
    .sf-banner .sf-display { font-size: clamp(46px, 8.4vw, 132px); color: var(--text-primary); }
    .sf-banner-tag { margin-top: -6px; padding: 8px 20px; border-radius: var(--r-pill); background: var(--text-primary); color: var(--c-bg); font-weight: 600; font-size: clamp(12px, 1.25vw, 17px);
      transform: rotate(-2deg); box-shadow: 0 8px 20px rgba(0,0,0,.25); }
    .sf-banner-ph { position: relative; flex: 0 0 auto; width: clamp(92px, 15vw, 220px); aspect-ratio: 1; }
    .sf-banner-ph::before { content: ''; position: absolute; inset: 10% -8% -8% 10%; border-radius: 50%; background: var(--warning); }
    .sf-banner-ph img { position: relative; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
    .sf-banner-ph.l { transform: rotate(-8deg) translateY(14px); } .sf-banner-ph.r { transform: rotate(8deg) translateY(-14px); }

    /* drink cards — bordered tile, inset photo, name in caps, price + square add */
    .sf-shell .dk-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .dk-card { border: 1px solid color-mix(in srgb, var(--text-muted) 22%, transparent); box-shadow: none; }
    .sf-shell .dk-card { border-color: var(--sf-line); border-radius: var(--r-md); }
    .dk-card:hover { box-shadow: 0 14px 30px rgba(0,0,0,.22); }
    .dk-img { margin: 6px; width: calc(100% - 12px); aspect-ratio: 1; border-radius: calc(var(--r-md) - 4px); }
    .dk-name { font-weight: 500; text-transform: uppercase; letter-spacing: .2px; line-height: 1.2; font-size: clamp(15px, 1.4vw, 20px); }
    .dk-body { padding: 8px 14px 14px; }
    .dk-price { font-weight: 600; font-size: clamp(16px, 1.5vw, 21px); color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .dk-add { width: 42px; height: 42px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--text-primary) 14%, transparent); color: var(--text-primary); font-size: 17px;
      transition-property: var(--tr-props); transition-duration: var(--t-fast); }
    .dk-card:hover .dk-add { background: var(--navy-accent); color: var(--c-on-accent); }
    .dk-tag.pop { background: color-mix(in srgb, var(--navy-dark) 78%, transparent); color: white; text-transform: uppercase; font-size: 10px; letter-spacing: .6px; }
    .dk-tag.pop i { color: var(--sf-flame, var(--warning)); }

    /* customize — two panes */
    .sf-shell .cz { max-width: 1060px; height: min(86vh, 700px); max-height: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); grid-template-rows: minmax(0, 1fr); border-radius: var(--r-lg); border: 1px solid var(--sf-line); }
    .cz-media { position: relative; min-height: 0; background: var(--sf-2); overflow: hidden; }
    .sf-shell .cz-img { position: absolute; inset: 0; aspect-ratio: auto; }
    .cz-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 70px 28px 26px; background: linear-gradient(transparent, color-mix(in srgb, black 88%, transparent)); color: white; }
    .cz-cap h3 { font-size: clamp(22px, 2.6vw, 34px); font-weight: 800; color: white; }
    .cz-cap p { margin-top: 4px; color: color-mix(in srgb, white 85%, transparent); line-height: 1.5; }
    .cz-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .cz-top { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--sf-line); }
    .cz-price { margin-right: auto; font-size: clamp(22px, 2.4vw, 30px); font-weight: 800; font-variant-numeric: tabular-nums; }
    .sf-shell .cz-x { position: static; width: 44px; height: 44px; border: 1px solid var(--sf-line); background: var(--sf-2); color: var(--text-primary); font-size: 17px; }
    .sf-shell .cz-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 6px; }
    .sf-shell .cz-sec { border: 1px solid var(--sf-line); border-radius: var(--r-md); padding: 0; margin: 0 0 14px; overflow: hidden; }
    .sf-shell .cz-sec legend { float: left; width: 100%; margin: 0; padding: 13px 16px; background: var(--sf-2); font-weight: 700; }
    .sf-shell .cz-sec legend small { padding: 3px 10px; border-radius: var(--r-pill); border: 1px solid var(--sf-line); font-size: 11px; }
    .sf-shell .cz-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 12px; }
    .sf-shell .cz-opt { min-height: 48px; padding: 10px 14px 10px 42px; border-radius: var(--r-md); justify-content: space-between; font-weight: 600; }
    .sf-shell .cz-opt::before { content: ''; position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; border: 2px solid var(--text-muted); }
    .sf-shell .cz-opt.on { color: var(--text-primary); border-color: var(--navy-accent); background: color-mix(in srgb, var(--navy-accent) 12%, transparent); }
    .sf-shell .cz-opt.on::before { border-color: var(--navy-accent); background: var(--navy-accent); box-shadow: inset 0 0 0 3px var(--c-card); }
    .sf-shell .cz-adds { padding: 12px; gap: 8px; }
    .sf-shell .cz-add { min-height: 50px; padding: 10px 14px; border-radius: var(--r-md); border-color: var(--sf-line); }
    .sf-shell .cz-add input { appearance: none; -webkit-appearance: none; flex: 0 0 20px; width: 20px; height: 20px; margin: 0; border-radius: 50%; border: 2px solid var(--text-muted); background: transparent; cursor: pointer; }
    .sf-shell .cz-add input:checked { border-color: var(--navy-accent); background: var(--navy-accent); box-shadow: inset 0 0 0 3px var(--c-card); }
    .sf-shell .cz-add input:focus-visible { outline: 2px solid var(--navy-accent); outline-offset: 2px; }
    /* note: padded wrapper — a margin on the textarea itself collapses behind the floated legend */
    .cz-note { clear: both; padding: 12px; }
    .cz-note textarea { display: block; width: 100%; min-height: 78px; margin: 0; padding: 11px 14px; resize: vertical; font: inherit; font-size: 16px; line-height: 1.45;
      border-radius: var(--r-sm); background: var(--sf-2); color: var(--text-primary); border: 1px solid var(--sf-line); outline: none; transition: border-color var(--t-fast), box-shadow var(--t-fast); }
    .cz-note textarea::placeholder { color: var(--text-muted); }
    .cz-note textarea:focus { border-color: var(--navy-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--navy-accent) 22%, transparent); }
    .cz-note small { display: block; margin-top: 6px; text-align: right; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .sf-shell .cz-foot { padding: 14px 20px; border-top: 1px solid var(--sf-line); }
    .sf-shell .cz-qty { border-color: var(--sf-line); background: var(--sf-2); }
    .sf-shell .cz-qty button { color: var(--text-primary); }
    .sf-shell .cz-qty button:not(:disabled):hover { background: var(--navy-accent); color: var(--c-on-accent); }
    .cz-go { flex: 1; min-height: 54px; display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 0 22px; border: 0; border-radius: var(--r-pill);
      background: var(--navy-accent); color: var(--c-on-accent); font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 10px 24px color-mix(in srgb, var(--navy-accent) 35%, transparent);
      transition-property: var(--tr-props); transition-duration: var(--t-fast); }
    .cz-go:hover:not(:disabled) { transform: translateY(-1px); }
    .cz-go:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
    .cz-go b { font-weight: 800; font-variant-numeric: tabular-nums; }
    .cz-sep { width: 1px; height: 18px; background: color-mix(in srgb, currentColor 55%, transparent); }

    /* cart drawer */

    .sf-shell .cart-h b { font-size: 20px; }
    .sf-shell .cart-h .close-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--sf-line); background: var(--sf-2); color: var(--text-primary); }
    .sf-shell .cart-b { padding: 8px 20px; }
    .sf-shell .cart-line { gap: 12px; border-bottom-color: var(--sf-line); }
    .cart-th { flex: 0 0 64px; width: 64px; height: 64px; border-radius: var(--r-sm); overflow: hidden; display: inline-flex; align-items: center; justify-content: center; background: var(--sf-2); color: var(--navy-accent); font-size: 22px; }

    .sf-shell .cart-t { flex: 1; }
    .cart-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 60vh; text-align: center; color: var(--text-muted); }
    .cart-empty b { color: var(--text-primary); font-size: 18px; }
    .cart-empty-ic { width: 80px; height: 80px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--sf-2); color: var(--text-primary); font-size: 28px; margin-bottom: 6px; }
    .cart-browse { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: var(--r-pill);
      background: var(--navy-accent); color: var(--c-on-accent); font-weight: 700; font-size: 15px; cursor: pointer; }
    .sf-shell .cart-f { border-color: var(--sf-line); }
    .sf-shell .cart-go { border-radius: var(--r-pill); }
    .sf-shell .cart-bar { border-radius: var(--r-pill); }

    /* footer */
    .sf-shell .sf-foot { margin-top: 70px; background: var(--sf-head); color: var(--text-primary); border-top: 1px solid var(--sf-line); }
    .sf-shell .sf-foot-in { display: block; max-width: 1220px; padding: 42px clamp(16px, 3vw, 40px) 24px; font-size: 15px; }
    .sf-foot-card { padding: 26px 28px; margin-bottom: 30px; border-radius: var(--r-md); background: var(--sf-2); }
    .sf-foot-card h2 { font-size: clamp(18px, 2vw, 24px); font-weight: 700; margin-bottom: 8px; }
    .sf-foot-card p { color: var(--text-muted); line-height: 1.7; }
    .sf-foot-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: clamp(20px, 5vw, 80px); }
    .sf-foot-grid h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
    .sf-foot-info p { margin-bottom: 20px; color: var(--text-muted); }

    .sf-shell .sf-foot .sf-hours td { padding: 10px 2px; border-color: var(--sf-line); }
    .sf-shell .sf-foot .sf-hours tr.on td { color: var(--navy-accent); }

    .sf-foot-bar { display: flex; justify-content: center; align-items: center; gap: 8px 18px; flex-wrap: wrap; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--sf-line); color: var(--text-muted); font-size: 14px; }
    .sf-shell .sf-foot-bar nav { display: flex; gap: 4px; }
    .sf-shell .sf-foot button { color: var(--text-muted); text-decoration: underline; text-underline-offset: 3px; }
    .sf-shell .sf-foot button:hover { color: var(--text-primary); background: var(--sf-2); }

    /* floating search + back to top */
    .sf-fab { position: fixed; bottom: 18px; z-index: 850; width: 52px; height: 52px; border: 1px solid color-mix(in srgb, white 14%, transparent); border-radius: var(--r-md);
      background: var(--sf-deep); color: white; font-size: 18px; cursor: pointer; box-shadow: 0 10px 24px rgba(0,0,0,.35); transition-property: var(--tr-props); transition-duration: var(--t-fast); }
    .sf-fab:hover { background: var(--navy-accent); }
    .sf-fab.l { left: 18px; } .sf-fab.r { right: 18px; opacity: 0; pointer-events: none; transform: translateY(12px); }
    .sf-fab.r.show { opacity: 1; pointer-events: auto; transform: none; }
    .sf-shell .sf-skel-hero { margin: 30px 0 28px; height: clamp(300px, 34vw, 500px); border-radius: var(--r-lg); }
    .sf-shell .sf-skel-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .sf-shell .sf-skel-card { height: 300px; border-radius: var(--r-md); }

    @media (max-width: 1100px) {
      .sf-shell .dk-grid, .sf-pop-grid, .sf-shell .sf-skel-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .sf-shell .sf-pill { display: none; }
    }
    @media (max-width: 820px) {
      .sf-shell .sf-head-in { grid-template-columns: auto 1fr; height: 68px; }
      .sf-hl { display: none; }
      .sf-logo { order: -1; justify-self: start; align-self: center; margin: 0; width: 54px; height: 54px; padding: 3px; box-shadow: 0 0 0 1px var(--sf-line); }
      .sf-shell .sf-head-in { grid-template-rows: 68px; }
      .sf-shell .sf-ic { width: 40px; height: 40px; font-size: 15px; }
      .sf-shell .sf-slide .sf-open { display: inline-flex; height: 42px; }   /* header hides its pills here */
      .sf-slide.has-fan .sf-slide-in { max-width: none; padding-top: 214px; }

      .sf-shell .dk-grid, .sf-pop-grid, .sf-shell .sf-skel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .sf-shell .dk-grid:not(.one) .dk-hit { flex-direction: column; }

      .sf-shell .dk-add { width: 36px; height: 36px; font-size: 15px; }
      .sf-shell .cz { grid-template-columns: 1fr; grid-template-rows: 220px minmax(0, 1fr); height: 92vh; }

      .sf-slide { min-height: 400px; align-items: flex-end; }
      .sf-cat-b { width: 104px; padding: 10px 4px; font-size: 13px; }

      .sf-banner { margin: 46px 0 20px; }

    }
    @media (max-width: 640px) {
      .sf-shell .cz { border-radius: var(--r-lg) var(--r-lg) 0 0; max-height: 94vh; }
      .sf-shell .cart { border-radius: var(--r-lg) var(--r-lg) 0 0; }
      .sf-banner { position: relative; min-height: 170px; }
      .sf-banner-t { position: relative; z-index: 1; }

      .sf-banner-ph.l { left: 0; top: 0; } .sf-banner-ph.r { right: 0; bottom: 0; }
      .sf-banner-tag { white-space: nowrap; font-size: 12px; padding: 7px 14px; }
      .sf-slide-in { padding: 24px; }
      .sf-fab { width: 46px; height: 46px; font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sf-pillbar, .pop-img img, .sf-fab, .sf-logo, .cz-go, .sf-cta, .sf-fan-c { transition: none; }
      .pop-hit:hover .pop-img img, .sf-logo:hover, .sf-cta:hover { transform: none; }
      .sf-fan-c:hover { transform: rotate(var(--rot)); }
    }

    /* ===== admin orders: board cards · payment review · receipt viewer · 360 · thermal ticket — new, built from tokens ===== */
    .ocard-no { font-size: 20px !important; font-weight: 900; }
    .ocard-w { font-size: 12px; font-weight: 700; color: var(--text-muted); } .ocard-w.bad { color: var(--danger); }
    .ocard-lines { list-style: none; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .ocard-lines li { font-size: 13px; } .ocard-lines small { display: block; color: var(--text-muted); font-size: 12px; } .ocard-note { font-style: italic; }
    .ocard.fresh { animation: ocFresh .6s var(--ease) 2; }
    @keyframes ocFresh { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--warning) 55%, transparent); } }
    .board-tabs { display: none; }
    .board-rej { margin-top: 4px; display: flex; flex-direction: column; gap: 8px; }
    .board-rej-h { margin: 0; border: 1px dashed color-mix(in srgb, var(--danger) 45%, transparent); color: var(--danger); font-size: 12.5px; font-weight: 700;
      padding: 8px; border-radius: var(--r-sm); text-align: center; }
    .board-empty { margin-top: 10px; }
    .rv { display: flex; flex-direction: column; border: 1px solid color-mix(in srgb, var(--text-muted) 22%, transparent); border-radius: var(--r-md); overflow: hidden; background: #111; min-height: 360px; }
    .rv-tools { display: flex; gap: 4px; align-items: center; padding: 6px; background: var(--c-card); border-bottom: 1px solid color-mix(in srgb, var(--text-muted) 20%, transparent); }
    .rv-n { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--text-muted); padding-right: 6px; }
    .rv-stage { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; min-height: 320px; max-height: 70vh; }
    .rv-stage img { max-width: 100%; transition: transform var(--t-fast) var(--ease); transform-origin: center; }
    .rv-stage iframe { width: 100%; height: 70vh; border: 0; background: #fff; }
    .rv-empty { align-items: center; justify-content: center; color: #fff; gap: 8px; flex-direction: row; }
    .rv-skel { height: 360px; border-radius: var(--r-md); }
    .pp { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    .pp.compact { grid-template-columns: 1fr; }
    .pp-side { display: flex; flex-direction: column; gap: 10px; }
    .pp-amt { display: flex; flex-direction: column; padding: 12px 14px; border-radius: var(--r-md); background: color-mix(in srgb, var(--success) 12%, var(--c-card)); border: 1px solid color-mix(in srgb, var(--success) 35%, transparent); }
    .pp-amt span { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); }
    .pp-amt b { font-size: 32px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .pp-dup { display: flex; gap: 8px; align-items: center; text-align: left; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); border-radius: var(--r-sm);
      background: color-mix(in srgb, var(--danger) 10%, var(--c-card)); color: var(--text-primary); font: inherit; font-size: 13px; cursor: pointer; }
    .pp-dup i { color: var(--danger); }
    .pp-att { display: flex; gap: 6px; flex-wrap: wrap; }
    .pp-att button { min-height: 36px; padding: 4px 10px; border: 1px solid color-mix(in srgb, var(--text-muted) 30%, transparent); border-radius: var(--r-pill); background: var(--c-card); font: inherit; font-size: 12px; cursor: pointer; }
    .pp-att button.on { border-color: var(--navy-accent); color: var(--navy-accent); font-weight: 800; }
    .pp-items { list-style: none; font-size: 13px; display: flex; flex-direction: column; gap: 3px; } .pp-items small { color: var(--text-muted); }
    .pp-tick { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 2px solid color-mix(in srgb, var(--success) 45%, transparent); border-radius: var(--r-md); cursor: pointer; font-size: 14px; }
    .pp-tick input { width: 22px; height: 22px; flex: 0 0 22px; accent-color: var(--success); }
    .pp-acts .btn { width: 100%; min-height: 48px; justify-content: center; font-size: 16px; }
    .pp-rej { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px dashed color-mix(in srgb, var(--text-muted) 25%, transparent); }
    .pp-rej input[type=text] { width: 100%; }
    .pp-state { display: flex; flex-direction: column; gap: 4px; } .pp-state small { color: var(--text-muted); }
    kbd { display: inline-block; min-width: 20px; padding: 1px 5px; border: 1px solid color-mix(in srgb, var(--text-muted) 40%, transparent); border-bottom-width: 2px; border-radius: 3px; font: 700 11px/1.4 monospace; text-align: center; }
    .btn kbd { border-color: rgba(255,255,255,.5); color: inherit; background: rgba(255,255,255,.12); }
    .review { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
    .rv-rail { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 90px; max-height: calc(100vh - 110px); overflow-y: auto; }
    .rv-rail h3 { display: flex; align-items: center; gap: 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .4px; color: var(--navy-primary); }
    .rv-rail h3 span { margin-left: auto; min-width: 24px; padding: 1px 8px; border-radius: var(--r-pill); background: var(--warning); color: #222; text-align: center; }
    .rv-item { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; text-align: left; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--text-muted) 22%, transparent);
      border-radius: var(--r-sm); background: var(--c-card); color: inherit; font: inherit; cursor: pointer; min-height: 48px; }
    .rv-item b { font-size: 16px; font-weight: 900; } .rv-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rv-item small { grid-column: 1 / -1; color: var(--text-muted); font-size: 12px; } .rv-item small i { color: var(--danger); margin-left: 6px; }
    .rv-item.on { border-color: var(--navy-accent); box-shadow: inset 4px 0 0 var(--navy-accent); background: color-mix(in srgb, var(--navy-accent) 6%, var(--c-card)); }
    .rv-wait h4 { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 13px; font-weight: 700; padding: 8px 4px; color: var(--text-muted); }
    .rv-wait .rv-item { margin-top: 6px; }
    .rv-pane { min-width: 0; outline: none; }
    .rv-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .rv-head b { font-size: 26px; font-weight: 900; color: var(--navy-primary); } .rv-head span { color: var(--text-muted); } .rv-head .act { margin-left: auto; }
    .rv-back { display: none; margin-bottom: 10px; }
    .o360-acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid color-mix(in srgb, var(--text-muted) 18%, transparent); }
    .o360-acts .osp { margin-right: auto; }
    .o360-note, .o360-admin { margin-top: 12px; padding: 10px 12px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--navy-accent) 6%, var(--c-card)); }
    .o360-admin label { display: flex; gap: 6px; align-items: center; font-weight: 700; font-size: 13px; margin-bottom: 6px; } .o360-admin label small { color: var(--text-muted); font-weight: 500; }
    .o360-note-v { width: 100%; text-align: left; border: 1px dashed color-mix(in srgb, var(--text-muted) 35%, transparent); background: var(--c-card); color: inherit; font: inherit; padding: 8px 10px; border-radius: var(--r-sm); cursor: text; min-height: 40px; }
    .o360-note-e { display: flex; flex-direction: column; gap: 6px; } .o360-note-e textarea { width: 100%; }
    .o360-unit { display: block; font-weight: 500; color: var(--text-muted); font-size: 11px; text-align: right; }
    .o360-tl { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .o360-tl li { display: flex; gap: 10px; }
    .o360-tl-ic { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--navy-accent) 12%, transparent); color: var(--navy-accent); }
    .o360-tl li div { display: flex; flex-direction: column; } .o360-tl-m { color: var(--text-muted); font-size: 12px; }
    .ds-acts { display: flex; gap: 6px; margin-top: 6px; } .act-wa { color: #25D366; }
    .th-big { font-size: 26px; font-weight: 900; margin: 1mm 0; }
    .th-line { margin-bottom: 1.5mm; } .th-sub { padding-left: 4mm; font-size: .95em; }
    body.dark-mode .rv-item, body.dark-mode .pp-att button, body.dark-mode .o360-note-v { background: #1a2035; color: #e8eaf6; }
    body.dark-mode .rv-head b, body.dark-mode .rv-rail h3 { color: #cfe2ff; }
    @media (max-width: 1100px) { .pp { grid-template-columns: 1fr; } }
    @media (max-width: 768px) {
      .board-tabs { display: flex; overflow-x: auto; }
      .board .qboard { grid-template-columns: 1fr; } .board .qcol { display: none; } .board .qcol.on { display: block; }
      .review { grid-template-columns: 1fr; } .rv-rail { position: static; max-height: none; }
      .review.pane-open .rv-rail { display: none; } .review:not(.pane-open) .rv-pane { display: none; } .rv-back { display: inline-flex; }

    @media (prefers-reduced-motion: reduce) { .ocard.fresh { animation: none; } .rv-stage img { transition: none; } }

    /* ===== dashboard · customers · reports ===== */
    .sb-delta { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); background: rgba(255,255,255,.18); }
    .sb-delta small { font-weight: 500; opacity: .85; }
    .sb-delta.up i { color: #b6f5c4; } .sb-delta.down i { color: #ffc9c4; }
    .bg-warning .sb-delta { background: rgba(0,0,0,.08); } .bg-warning .sb-delta.up i { color: #146c2e; } .bg-warning .sb-delta.down i { color: #a31d1d; }
    /* two equal cards per row, same height; a lone card spans the row */
    .dsh-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
    .dsh-row > .lte-card { margin-bottom: 20px; min-width: 0; display: flex; flex-direction: column; }
    .dsh-row > .lte-card:only-child { grid-column: 1 / -1; }
    .dsh-row .lte-card-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .chart-box.fill { flex: 1; }
    .chart-box.fill canvas { position: absolute; inset: 0; }
    .att-more { align-self: center; margin-top: 12px; }

    /* ===== Settings — premium two-pane: section rail on the left, one section at a time on the right ===== */
