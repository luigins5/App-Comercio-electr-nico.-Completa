  <!-- tema: aplicar la paleta guardada ANTES del renderizado (evita parpadeos en la primera carga). Orden: predeterminado del servidor -> última elección en este dispositivo -->
  <script>window.__APP_THEME_RAW__ = '<?!= defaultThemeVars ?>'; window.__APP_THEME_ID__ = '<?!= defaultThemeId ?>';</script>
  <!-- enlaces directos (?reset= / ?track= / ?page=) — el iframe del sandbox no puede leer la URL principal por sí mismo; el servidor los filtra a [A-Za-z0-9-] -->
  <script>window.__RESET_TOKEN__ = '<?= resetToken ?>'; window.__TRACK_TOKEN__ = '<?= trackToken ?>'; window.__START_PAGE__ = '<?= startPage ?>';</script>
  <script>
    (function () {
      var root = document.documentElement;
      var put = function (v) {
        if (!v) return;
        try { if (typeof v === 'string') v = JSON.parse(v); } catch (e) { return; }
        if (v && v.vars) v = v.vars; // soporte de estructura {themeId,vars}
        Object.keys(v || {}).forEach(function (k) { if (k.indexOf('--') === 0) root.style.setProperty(k, v[k]); });
      };
      try { put(window.__APP_THEME_RAW__); } catch (e) {}          // predeterminado global (definido por admin)
      try { put(localStorage.getItem('app_theme_vars')); } catch (e) {} // la anulación por dispositivo tiene prioridad
    })();
  </script>
